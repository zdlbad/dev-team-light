<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台 · 业务</title>
<style>
:root{
  --bg:#f7f6f3; --panel:#ffffff; --ink:#1d1d1b; --ink-2:#55534e; --ink-3:#8a877f; --line:#dedbd3; --accent:#2563eb; --accent-bg:#e8efff;
  --role:#e3edff; --role-line:#2f5fc4; --data:#e7f5ec; --data-line:#2f855a; --area:#f4f4f1; --area-line:#b8b5ad; --topic:#faf9f6; --topic-line:#8a877f;
  --c1:#fdf1e3; --c1l:#c2410c; --c2:#e8efff; --c2l:#2563eb; --c3:#f1ebfd; --c3l:#7c3aed; --c4:#fbf3d5; --c4l:#b45309; --c5:#e3f6f8; --c5l:#0891b2;
  --note:#fffdf5; --note-line:#e5d9a8; --warn:#b35c00; --badge:#fff3cd; --badge-ink:#7a5200; --badge-line:#f0d58c; --bad:#d6342c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#18181a; --panel:#222225; --ink:#ecebe7; --ink-2:#b5b2ab; --ink-3:#85827b; --line:#3a3a3e; --accent:#7aa2ff; --accent-bg:#26314d;
    --role:#243352; --role-line:#7aa2ff; --data:#1f3327; --data-line:#4ade80; --area:#1d1d20; --area-line:#4a4a50; --topic:#26262a; --topic-line:#85827b;
    --c1:#3a2a1c; --c1l:#fb923c; --c2:#1f2a44; --c2l:#7aa2ff; --c3:#2d2342; --c3l:#c4b5fd; --c4:#3a3220; --c4l:#fbbf24; --c5:#1b3337; --c5l:#67e8f9;
    --note:#2e2b1f; --note-line:#6b5f2e; --warn:#fb923c; --badge:#3a3220; --badge-ink:#fbbf24; --badge-line:#6b5f2e; --bad:#f87171;
  }
}
/* 左边栏：流程那一行右边的红点，数字是这段流程还没答的条数 */
nav a.sub .open,nav .gn .open{display:inline-block;min-width:8px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:600;text-align:center;line-height:16px;vertical-align:1px}
/* 左边栏的组：点组名折叠展开，默认折叠；折叠时流程组右边带红点 */
nav .gn.fold{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
nav .gn.fold:hover{color:var(--ink-2)}
nav .gn .tri{display:inline-block;width:12px;font-size:10px}
nav .gn .open{margin-left:auto}
/* 大组里套的小组（流程 · 按主题 → 一个主题一组）：组名和组里的流程各缩进一层 */
nav .gb .gn.fold{padding-left:30px}
nav .gb .gb a.sub{padding-left:46px}
h1{font-size:22px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
h1 a{color:var(--accent);text-decoration:none;font-size:14px;font-weight:400}
h1 .sep{color:var(--ink-3);font-weight:400;font-size:16px}
.badge{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--badge);color:var(--badge-ink);border:1px solid var(--badge-line);font-weight:400}
.badge.done{background:var(--data);color:var(--data-line);border-color:var(--data-line)}
.act{font-size:12px;padding:2px 10px;border:1px solid var(--accent);color:var(--accent);background:var(--panel);border-radius:4px;cursor:pointer}
.sub{color:var(--ink-2);margin:0 0 12px;max-width:960px}
.lock{margin:0 0 10px;padding:7px 12px;border:1px solid var(--badge-line);background:var(--badge);color:var(--badge-ink);border-radius:8px;max-width:960px}
.diagram{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;overflow:auto}
.row{display:flex;gap:16px;align-items:flex-start}
.row .diagram{flex:1;min-width:0}
.side{width:300px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--ink-2);position:sticky;top:12px}
.side b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
.side .src{font-size:12px;color:var(--ink-3);margin-top:8px}
.ctbl{margin-top:16px}
.ctbl h3{font-size:15px;margin:0 0 4px}
.ctbl .def{font-size:13px;color:var(--ink-2);margin:0 0 8px}
.ctbl .wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.ctbl table{border-collapse:collapse;font-size:13px;min-width:720px;width:100%}
.ctbl th,.ctbl td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.ctbl th{color:var(--ink-3);font-weight:600;white-space:nowrap}
.ctbl td:first-child{font-weight:600;white-space:nowrap}
.ctbl tr:last-child td{border-bottom:none}
.ctbl .src{font-size:12px;color:var(--ink-3);margin-top:6px}
svg{display:block;margin:0 auto}
svg text{font:12px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--ink);pointer-events:none}
svg text.sub{font-size:11px;fill:var(--ink-3)}
.tp rect{stroke-width:1.4}
.tp text.t{fill:var(--ink)}
.lb rect{fill:var(--panel);stroke:var(--line);stroke-width:1;rx:6}
.lb text{font-size:11.5px;fill:var(--ink-2)}
.lb path{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3;opacity:.75}
.tp text.t{font-size:15px;font-weight:600}
.tp text.c{font-size:11px;fill:var(--ink-3)}
.tp text.d{font-size:12px;fill:var(--ink-2)}
.tp{cursor:pointer}
.grp rect{stroke-dasharray:2 4;stroke-width:1.2}
.grp text{font-size:13px;fill:var(--ink-3);letter-spacing:1px}
.nd rect{fill:var(--data);stroke:var(--data-line);stroke-width:1.2}
.nd.sel rect{stroke-width:2.6}
.nd{cursor:pointer}
.stub rect{stroke-dasharray:4 3;stroke-width:1}
.stub text{fill:var(--ink-2)}
.stub text.sub{fill:var(--ink-3)}
.stub{cursor:pointer}
.rl rect{fill:var(--role);stroke:var(--role-line);stroke-width:1}
.rl text{font-size:10.5px;fill:var(--role-line)}
.ed path.vis{fill:none;stroke:var(--ink-2);stroke-width:1.3}
.ed.tree path.vis{stroke:var(--ink-3);stroke-width:1}
.ed path.hit{fill:none;stroke:transparent;stroke-width:14}
/* 流程：时序图 */
.flow text{font-size:13px}
.head rect{fill:var(--role);stroke:var(--role-line);stroke-width:1.2}
.head text{font-weight:600;text-anchor:middle}
.head text.sub{font-weight:400;font-size:11px;fill:var(--ink-2)}
.life{stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.msg path{fill:none;stroke:var(--ink-2);stroke-width:1.4}
.msg text{text-anchor:middle}
.msg text.date,.self text.date{font-size:11px;fill:var(--ink-3)}
.self rect{fill:var(--panel);stroke:var(--ink-3);stroke-width:1;rx:4}
.data rect{fill:var(--data);stroke:var(--data-line);stroke-width:1;rx:2}
.data text{font-size:11px;text-anchor:middle}
.note rect{fill:var(--note);stroke:var(--note-line);stroke-width:1;rx:3}
.note text{font-size:12px;fill:var(--ink-2)}
.due text{fill:var(--warn);font-size:11px}
/* 流程：每步右边一个框，说明、规则、问题列成一张单子，一条虚线指回这一步。有待定的、没答的框红边红标题；全定了的灰框 */
.qa rect.bg{fill:var(--panel);stroke:var(--line);stroke-width:1;rx:3}
.qa text{font-size:12px;fill:var(--ink-2)}.qa text.h{font-weight:600}.qa text.s{font-size:11px;fill:var(--ink-3)}.qa text.id{font-size:10.5px;fill:var(--ink-3)}
.qa path.lead{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3}
.qa.pending rect.bg{stroke:var(--bad);stroke-width:1.2}.qa.pending text.h{fill:var(--bad)}.qa.pending path.lead{stroke:var(--bad)}
.qa.done rect.bg{fill:var(--area);stroke:var(--area-line)}.qa.done text.h{fill:var(--ink-3)}
.qa .tog{cursor:pointer}.qa .tog rect{fill:transparent;stroke:none}.qa .tog:hover text.h{text-decoration:underline}
.qa line.sep{stroke:var(--line);stroke-width:1}
.qa .it text.mk{font-size:11px;font-weight:600}.qa .it.pending text.mk{fill:var(--bad)}.qa .it.done text.mk{fill:var(--ink-3)}
.qa a.scr text{fill:var(--accent);pointer-events:auto;cursor:pointer}.qa a.scr:hover text{text-decoration:underline}
.qa .btn{cursor:pointer}.qa .btn rect{fill:var(--panel);stroke:var(--line);stroke-width:1;rx:4}.qa .btn text{fill:var(--ink);font-size:11.5px}
.qa .btn.b rect{stroke:var(--accent)}.qa .btn.b text{font-weight:600;fill:var(--accent)}
/* 业务（模块业务）的主题页：从上到下五块，每块能收起，统一最宽 1400。收着时是一行：三角、标题、一句提示；展开后右上角有「收起」 */
.sec{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;margin:0 0 12px;max-width:1400px}
.sec .sh{display:flex;align-items:baseline;gap:8px;padding:10px 16px;cursor:pointer;user-select:none}
.sec .sh .tri{font-size:10px;color:var(--ink-3);width:12px;flex:none}
.sec .sh b{font-size:14px;font-weight:600;flex:none}
.sec .sh .hint{font-size:12.5px;color:var(--ink-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec .sh .fold{margin-left:auto;font-size:12px;color:var(--accent-ink,var(--accent));flex:none;white-space:nowrap}
.sec.open .sh b{color:var(--accent-ink,var(--accent))}
.sec.red .sh .hint{color:var(--bad);font-weight:600}
.sec .sb{padding:2px 18px 16px}
.none{color:var(--ink-3)}
p.none,p.tip{margin:0 0 8px;font-size:13px}p.tip{color:var(--ink-3);font-size:12.5px}
/* 块里的页签：业务概述那一排是分段的小页签；流程速览和窗口里的那一排，选中的是实心 */
.stabs{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:var(--seg-track,var(--area));border-radius:10px;margin:0 0 10px}
.stabs button{font:inherit;font-size:13px;padding:4px 12px;border:0;border-radius:7px;background:none;color:var(--ink-2);cursor:pointer;font-weight:500}
.stabs button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--raise,0 1px 2px rgba(0,0,0,.15))}
.ptabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.ptabs button{font:inherit;font-size:13px;padding:4px 14px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink-2);cursor:pointer}
.ptabs button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
/* 业务概述：模块职责最上面先放背景；使用模块的角色是等宽的网格，一行几张卡一样宽、一样高，放不下换行 */
.io{font-size:13.5px;color:var(--ink-2);line-height:1.6}
.io .lab{font-size:11.5px;letter-spacing:1px;color:var(--accent-ink,var(--accent));font-weight:600;margin:2px 0 4px}
.io .bg{font-size:14.5px;line-height:1.7;color:var(--ink);padding-bottom:10px;margin-bottom:10px;border-bottom:1px dashed var(--line)}
.io ul,.io ol{margin:0;padding-left:20px}.io li{margin:2px 0}.io b{color:var(--ink)}
.io .who{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;align-items:stretch}.io .who>div{border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0}
.io .who .aim{color:var(--ink-3);font-size:12.5px;margin:2px 0 4px}
/* 主要流程速览：流程图自己折行，不出横向滚动条 */
.tour .tn{font-size:13px;color:var(--ink-2);margin:0 0 8px}
.tour .tf{overflow:hidden}.tour .tf svg{margin:0}
.tf .tb rect{fill:var(--panel);stroke:var(--ink-2);stroke-width:1.2}.tf .tb text{font-size:12.5px}
.tf .tb.ext rect{fill:var(--area);stroke:var(--ink-3);stroke-dasharray:5 4}.tf .tb.ext text{fill:var(--ink-3)}
.tf .tb circle{fill:var(--accent)}.tf .tb text.no{fill:var(--on-accent,#fff);font-size:11px;font-weight:600;text-anchor:middle}
.tf .tb.ext circle{fill:var(--ink-3)}.tf .tb.ext text.no{fill:var(--panel)}
.tf .tr rect{fill:var(--role);stroke:var(--role-line);stroke-width:1}.tf .tr text{font-size:10.5px;fill:var(--role-line);text-anchor:middle}
.tf path.tl{fill:none;stroke:var(--ink-3);stroke-width:1.3}
.tf .tc rect{fill:var(--panel);stroke:var(--ink-3);stroke-width:1}.tf .tc text{font-size:11.5px;text-anchor:middle;fill:var(--ink-2)}
.tf .tc.core rect{fill:var(--accent-bg);stroke:var(--accent);stroke-width:1.5}.tf .tc.core text{font-weight:600;fill:var(--ink)}
.tf .tg rect{fill:var(--area);stroke:var(--line);stroke-width:1}.tf .tg text{font-size:11.5px;fill:var(--ink-2)}
.tf [data-pop]{cursor:pointer}.tf [data-pop]:hover rect{stroke:var(--accent)}
/* 标签：核心数据实心，别的数据空心，资料虚线，功能和响应样式分开；带 data-pop 的点了开一个窗口 */
.chip{display:inline-block;font-style:normal;font-size:12px;line-height:1.7;padding:0 10px;border-radius:9px;border:1px solid transparent;white-space:nowrap;text-decoration:none;color:var(--ink-2)}
.chip.core{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip.part{border-color:var(--ink-3);color:var(--ink)}
.chip.res{border:1px dashed var(--ink-3)}
.chip.ext{border:1px dashed var(--badge-ink);background:var(--badge);color:var(--badge-ink)}.chip.ext small{margin-left:6px;font-size:10.5px;opacity:.8}
.chip.fn{border-color:var(--line);background:var(--panel)}
.chip.ch{border-color:var(--note-line);background:var(--note);border-radius:3px}
.chip.wf,.chip.cm{font-size:11px;border-color:var(--accent);color:var(--accent-ink,var(--accent));background:var(--panel)}.chip.cm{border-color:var(--line);color:var(--ink-2)}
.chip[data-pop],a.chip{cursor:pointer}.chip[data-pop]:hover,a.chip:hover{box-shadow:0 0 0 2px var(--accent-bg)}
/* 核心数据和概念：一组一样核心数据，装着的概念缩进排在下面 */
.cg{padding:8px 0;border-top:1px solid var(--line)}.cg:first-of-type{border-top:0;padding-top:2px}
.cg .gl{font-size:11.5px;letter-spacing:1px;color:var(--ink-3);font-weight:600;margin-bottom:2px}
.cr{display:flex;align-items:baseline;gap:8px;line-height:2;font-size:13px;color:var(--ink-2)}
.cr>*{flex:none}.cr .nt{flex:1;min-width:0}.cr .ld{font-style:normal;font-size:11.5px;color:var(--ink-3);width:74px;white-space:nowrap}.cr .wn{color:var(--ink)}
/* 一个概念的栏：名字那一行后面的灰色标签「N 栏」，点了在这一行下面一栏一行展开：栏名加粗，蓝色小字是它指着的数据，灰字是说明 */
.chip.fc{font-size:11px;border-color:var(--line);background:var(--area);color:var(--ink-3);cursor:pointer;user-select:none}.chip.fc:hover{box-shadow:0 0 0 2px var(--accent-bg)}
.fd{display:flex;align-items:baseline;gap:10px;line-height:1.8;font-size:12.5px;color:var(--ink-3)}
.fd>*{flex:none}.fd b{min-width:96px;color:var(--ink);font-weight:600}.fd .rf{font-size:11.5px;color:var(--accent-ink,var(--accent))}.fd .nt{flex:1;min-width:0}
/* 业务目的及方案：一条业务目的一块，默认收着；展开是一张表，一行一条更细的目的 */
.pa{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);margin-bottom:4px}.pa span{margin-right:auto}
.pa button{font:inherit;font-size:12px;padding:2px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink-2);cursor:pointer}
.pu{border-top:1px solid var(--line);padding:8px 0}
.pu .pt{display:flex;align-items:baseline;gap:8px;cursor:pointer;user-select:none;font-size:15px;font-weight:600;line-height:1.5}
.pu .pt .tri{font-size:10px;color:var(--ink-3);width:12px;flex:none}.pu .pt .no{color:var(--accent-ink,var(--accent));flex:none}
.pu .pt .cnt{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:400;white-space:nowrap;flex:none;padding-left:12px}
.pu .guess{display:inline-block;font-size:11px;line-height:1.6;padding:0 8px;border-radius:9px;border:1px solid var(--badge-line);background:var(--badge);color:var(--badge-ink);margin-left:8px;vertical-align:2px;font-weight:400;white-space:nowrap}
.pu .pf{font-size:12px;color:var(--ink-3);margin:2px 0 6px 40px;line-height:1.6}
.pu .ns{font-size:12px;color:var(--ink-3);margin-top:2px;line-height:1.6}
.pu table{border-collapse:collapse;margin-left:40px;font-size:13.5px;width:calc(100% - 40px)}
.pu td{padding:7px 18px 7px 0;vertical-align:top;border-top:1px solid var(--line);line-height:1.6}
.pu td:first-child{width:38%;min-width:240px}.pu td b{color:var(--ink)}
.pu .how{font-size:12.5px;color:var(--ink-2);margin-top:2px}.pu .how i{font-style:normal;font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:6px}
.pu .tags,.warn{display:flex;flex-wrap:wrap;gap:5px;align-items:baseline}
.warn{font-size:13px;color:var(--warn);margin-top:8px;line-height:1.7}.warn a{color:inherit}
/* 窗口：每点开一样就多一个，盖在页面上面，各有自己的「关闭」；按住标题那一行能拖，点一下哪个窗口它到最上面；开着两个以上时右下角有「全部关闭」 */
.pop{position:fixed;inset:0;z-index:40;background:rgba(15,25,40,.45);overflow:auto}
.pop[hidden]{display:none}
.pop .wn{position:absolute;width:max-content;padding-bottom:36px}
.pop .pw{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.35);width:max-content;min-width:min(calc(100vw - 48px),640px);max-width:min(calc(100vw - 48px),1400px);padding:16px 22px 20px;box-sizing:border-box}
/* 核心数据的看板这一种窗口：最宽放到 1880，四周的留白小一些；别的窗口照旧 */
.pop .pw[data-kind="core"]{max-width:min(calc(100vw - 24px),1880px);padding:12px 16px 14px}
.pop .ph{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;cursor:move;user-select:none}.pop .ph>b{font-size:17px;flex:none}.pop .ph .in{font-size:12.5px;color:var(--ink-3);min-width:0}
.pop .ph .x{margin-left:auto;font:inherit;font-size:12.5px;border:0;background:none;color:var(--ink-3);cursor:pointer;white-space:nowrap;padding:2px 0 2px 16px}.pop .ph .x:hover{color:var(--ink)}
.pop .xall{position:fixed;right:24px;bottom:20px;z-index:400;font:inherit;font-size:13px;padding:7px 16px;border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.3)}.pop .xall:hover{border-color:var(--accent)}
.pop .pd{font-size:13px;color:var(--ink-2);margin:0 0 10px;max-width:960px;line-height:1.6}
.pop .pb{overflow-x:auto}
.pop .cdef{margin-top:10px;font-size:13px;color:var(--ink-2);line-height:1.6;max-width:960px}.pop .cdef b{display:block;color:var(--ink);font-size:14px}.pop .cdef .src{font-size:12px;color:var(--ink-3);margin-top:4px}
/* 类图画法的框：头是名字，下面一栏一行；框里套着它装着的概念，同一层横着排、放不下换行 */
.cls{flex:none;border:1.5px solid var(--ink-3);border-radius:8px;background:var(--panel);overflow:hidden;min-width:120px;max-width:560px;text-align:left}
.cls>.ct{padding:5px 12px;font-weight:600;font-size:13px;background:var(--area);line-height:1.5}
.cls>.ct i{display:block;font-style:normal;font-weight:400;font-size:10.5px;opacity:.85}
.cls>.cb{padding:6px 10px 8px;border-top:1px solid var(--line)}
.cls .fl{font-size:12.5px;color:var(--ink-2);line-height:1.7}.cls .fl b{color:var(--ink);font-weight:600}
.cls .kids{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;align-items:flex-start}

<script>
// 工作台起的时候 window.DATA 由 /data/<页>.js 先定义，下面每个常量都先取它；单开这份小样时 DATA 是空的，用写死的
const DATA = (typeof window !== 'undefined' && window.DATA) || {}
const LIVE = Object.keys(DATA).length > 0
const post = (action, body) => fetch('api/' + action, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then((r) => r.json()).then((o) => { if (o.ok) location.reload(); else alert(o.error) })
// 业务这个角色的三份输出，一个上下文一套；数据写死在这里，真做时是 上下文/<名>/业务/ 下三种 JSON 文件。
// 工作台注入 DATA.BIZ = { <上下文名>: { MAP, CONCEPTS, FLOWS } }，有业务的上下文各一项；单开时用下面写死的样例系统和排版系统。三份的形状：
// 1. 全局图.json
//    { topics: [{ id, title, c, x, y, does: [两句], concepts: [几样数据名] }],   c 是颜色号 1–5；x、y 是格子位置，从左到右、从上到下是发生的先后
//      edges:  [{ from, to, label }] }                                          label 是主题之间主要的业务交流，人写的，「；」分句
// 2. 概念/<主题>.json（一个主题一份，这里写 g2、g5 做例子）
//    { topic, title, summary,
//      concepts: [{ id, title, by: [角色], order, definition, source, fields?: [栏名 | { title, note?, ref?, topic?, for?, why? }], nudge?, table?: { columns: [列名], rows: [[一格一格]] } }],  这一块自己的数据；
//                                                                                 fields 是这个概念有哪几栏：一项是栏名，或者一个对象，note 是这一栏在业务上是什么，ref 是它指着的另一样数据的名字，
//                                                                                 topic 是那样数据归的主题的名字（同一主题里的只写 ref）；栏名里不带括号；
//                                                                                 先后（列）由线算出来，order 定同一列里的上下，nudge 是人手指定的上下挪动
//      external: [{ id, title, topic, context? }],                                别的主题里连着的数据，画成虚框；只连进来的在左、其余在右，由线定
//                                                                                 别的上下文的带 context（topic 是那边的主题号）；共享内核里的 topic 写「共享内核」
//      edges:    [{ id, from, to, label, by?: [角色], source?, tree? }] }           线是关系，by 是做这件事的角色（骑在线上）；tree: true 是上下层：from 装着 to，主题页照它一层层套；
//                                                                                 用到的资料和用它的概念之间连一条不是上下层的线，主题页照这条线把资料列到那样核心数据下面
//    数据太多、分了子主题的主题，这一份改成子主题图，形状照全局图：
//    { topic, title, summary, subs: [{ id, title, x, y, does: [两句], concepts: [数据名] }], edges: [{ from, to, label }] }
//    每个子主题一份 概念/<主题>/<子主题>.json，形状同上面的概念图，多一个 sub（子主题 id）；工作台给的 CONCEPTS 里键是「主题/子主题」
//    别处指进来的虚框写 sub 就进那个子主题；没写 sub 的，到那个主题的几份子主题里找这样数据在哪一份
// 3. 流程/<流程名>.json（一段流程一份）
//    { file, title, topic, summary, parties: [{ id, title, sub }],          文件名「主题号-两位序号-阶段名」；topic 是这一份讲的主题
//      entries?: [{ text, step, flow? }], exits?: [{ text, step, flow? }],    入口、出口：接在这一份的哪一步上；flow 是接着的那一份，两边都写
//      steps: [{ id, from, to, title, date, data?: [数据名], due?, source?, note?,
//                opt?: 一句话（可能发生的情况）, alt?: 一句话（几支只走一支）, case?: 这一支的情况,   挨着的几步写得一样就画在同一个框里；旁支步号写 9a、9b
//                rules?: [{ id, text, source?, status: '待定' | '定了', lean?, options?: [], answer?, answeredAt? }],   这一步守的规则；待定的就是问题
//                asks?:  [{ id, q, lean?, options?: [], answer?, answeredAt?, by?, screen? }] }] }                       这一步上不是规则的问题；答了写 answer
//                                                                    by 是别的角色问的（如「UI 设计」），screen 是它在界面页哪一屏问的「<需求编号>/<屏 id>」

// 4. 模块业务/<主题>.json（一个主题一份，页面上叫「业务」）：这个主题自己的业务逻辑，换一家公司来用也不变。顶层照下面的先后写
//    { topic, title, summary,
//      tours?: [{ title, note, steps: [{ by, text, concepts?: [概念名], fns?: [功能号], stage?, jobs?: [步骤号] }] }],     主要流程速览：by 是谁做的，concepts 是这一步碰到的概念；一步不写 fns 的，是别的主题办的；
//                                                                                                stage、jobs 只有新写法的主题写：这一步在流程表的哪一段（写段名）、对着各角色要办成的事里的哪几步（j-1.1 这样的号）
//      core: [{ title, why, parts?: [概念名],                                                    核心数据；parts 是它装着的概念，和概念图上的上下层线一致
//               sources: [{ heads?: [{ steps }], steps: [{ data, op, by, fn?, event?, topic? }] }],   来路：把它新建出来的几条路，一站一样数据，by 是把它变成下一站的那件业务，op 是创建、更新、删除
//               targets: [{ op, by, fn?, data, topic? }] }],                                     去处；带 topic 的是交给别的主题的数据，每条写 fn：这里的哪项功能让它新建或改变的
//      uses?: [{ title, note }],                                                                 用到的资料，每条都写 note
//      purposes: [{ id, text, from, source?,                                                         业务目的；from 是它对着背景里的哪一句，没写 source 的是推出来的。purposes 只有没写 goals 的主题还读，新写法的主题不写它
//                   needs: [{ id, aim, text, source?, cores?: [核心数据名], data?: [数据名], fns?: [功能号], chains?: [响应号] }] }],
//                                                                                                needs 一条是一条更细的目的：aim 是更细的目的，text 是做法，source 是出处、没写的是推出来的，后面四样是它落到哪里
//                                                                                                id 是目的的固定的号：业务目的写「p-1」「p-2」，更细的目的写「p-1.1」「p-1.2」，点前面是它所在的业务目的的号；
//                                                                                                号定了就不改，新加的一条用还没用过的号，不重排；页面照文件里的先后显示，不照号排。
//                                                                                                一个主题的目的都没写 id 的（旧写法），页面照先后数：「1.2」是第 1 条业务目的下面的第 2 条更细的目的
//      intro: { context, duty: [一条一句], concepts: [{ title, note }], users: [{ who, aim, steps: [一件一句] }], usual: [一步一句] },   业务概述：context 是背景，usual 是典型流程
//      groups: [{ title, functions: [{ id, title, called?, does, intent,
//        subject: { title, op, from?, to, edits: ['名字：逻辑'] },                                业务数据：title 里只带一个概念名，页面从里面认主数据；数据归别的主题的写成「已发邮件（消息通知）」；
//                                                                                                edits 是被动到的每一项，一项一句；概念里某一栏的逻辑写成「概念 › 栏：逻辑」
//                                                                                                op 是创建、更新、删除、查看。只是看、不改数据的功能标「查看」：subject 只写 title（它看的是哪样数据）和 op，
//                                                                                                不写 from、to、edits，也不写 out，calls 写成空的一列；看到的是什么写在 returns 里，
//                                                                                                「谁能看到哪些」「这个数怎么算」写成它自己的规则。标签的颜色和创建、更新、删除都不一样
//        in: [{ title, by?, note }],                                                             要用到的数据：by 是这样数据谁给的，比如「买手填的」「系统带出的」；只是指明办的是哪条记录的那一项不写 by
//        out: [{ kind, title, when? }], rules?, uses?: [{ flow, step }], source? }] }],          顺带留下的：kind 是新记录、状态改变、事件

//      workflows: [{ id, title, states: [{ id, title, called? }], moves: [{ from, to, label }], stages?: [{ title, states: [状态 id] }], note? }],

//          source 是这条规则的出处，和别处的出处一个叫法；旧数据里写成 from 的，页面照样当出处显示；

//          「一直要守的」规则都写，别的三种可以不写。「每条规则细说」里全话下面多一行「管着：……」，「做的时候守着」那张卡里列在 short 后面；没写的不出这一行
//          for 写它为了哪条更细的目的，写的是那条目的的 id，比如「p-1.2」；目的没写 id 的（旧写法），for 照先后数，写「1.2」；
//          for 指着一条业务目的的（「p-1」，旧写法「1」）页面也认，标签后面的话用那条业务目的的 text
//      core[i].keeps: [规则号]            这样核心概念一直要守的规则
//      core[i].actions: [{ id: 'act-N', title, from?, to?, for?, why?, does?, rules?: [规则号], in?: [{ title, note }], edits?: ['属性名：怎么改'],
//                          out?: [{ kind, title: '事件名：带着什么' }], steps?: [{ text, on?: [副作用的名字] }], doubt? }]
//          行为：这样核心概念自己做的一件事。steps[].on 里的名字等于自己 edits 某一项冒号前面的名字，或者自己 out 某一项 title 冒号前面的名字（title 里没有冒号的就是整个 title）
//      concepts: [{ title, keeps?: [规则号], actions?: [行为，写法和 core[i].actions 一样] }]      放在 core 后面

//          到得了的：{ id, aim, way, act?, land?, doubt?, made?, source? }     没有子目的。一个节点写了 way 或者 act，就算到得了的目的，哪怕它同时写了 parts

//          doubt   疑点
//          made    true：这一句不是照原话，是归出来的，页面标「推出来的」
//          source  根据：人哪天说的、原料哪一处；页面只在鼠标停在这句目的上时显示

//               steps: [{ id: 'j-1.1', title, why?, note?, fns?: [功能号], chains?: [响应号], side?, again? }] }]

//                stages: [{ title, states?: [状态名], note?,

":["r-6"],"in":[{"title":"服务协议","note":"她签的是哪一份"},{"title":"签约日期","note":"协议上写的签约那一天"}],"edits":["签了的服务协议：记下她签的是哪一份、哪天签的","她在哪一段：已建档 → 已签协议"],"out":[{"kind":"事件","title":"协议已签：带着她的 My Aged Care 编号和签约日期","when":"聊天 app 收到以后给她开聊天"}],"steps":[{"text":"记下她签的是哪一份服务协议、哪天签的","on":["签了的服务协议"]},{"text":"更新状态：「已建档」→「已签协议」","on":["她在哪一段"]},{"text":"发出事件","on":["协议已签"]}]},{"id":"act-3","title":"记分到资金","from":"已建档、已签协议或分到资金","to":"分到资金","why":"从分到资金的那一天起钱开在她名下，哪天分到、分到多少要记在档案上。","does":"照分资金的信记下哪天分到资金、分到的是全额还是一部分。","rules":["r-7","r-8"],"in":[{"title":"分资金的信","note":"写着分到资金的日期，分到的是全额资金还是过渡资金"}],"edits":["分到的资金：记下哪天分到、分到的是全额还是一部分","她在哪一段：变成「分到资金」"],"out":[{"kind":"事件","title":"资金已分到：带着她的 My Aged Care 编号、分到的日期、分到的是全额还是一部分"}],"steps":[{"text":"记下哪天分到资金、分到的是全额还是一部分","on":["分到的资金"]},{"text":"更新状态：变成「分到资金」","on":["她在哪一段"]},{"text":"发出事件","on":["资金已分到"]}]}]},{"title":"基金账户","why":"分到的钱开在她名下的基金账户里，一类服务一个账户。账户有自己的余额，每一次扣款都照账户办。","parts":["余额"],"sources":[{"steps":[{"data":"参与者档案","op":"创建","by":"记下分到资金的那天，批了几类服务就开几个账户","fn":"f-3"}]}],"targets":[{"op":"更新","by":"扣成了，发出「已扣款」，那边照它把这一行申报行记成已扣款","fn":"f-4","data":"申报行","topic":"服务发生与申报"}],"keeps":["r-3","r-4"],"actions":[{"id":"act-4","title":"开立","to":"可用","why":"分到的钱要开在她名下的账户里，一类服务一个账户。","does":"照她批到的分级和路径，给她开出基金账户。","rules":["r-9"],"in":[{"title":"批到的分级和路径","note":"她的参与者档案上记着的"},{"title":"这一次分到多少钱","note":"分到资金以后定出来的"}],"edits":["她名下的基金：记下这个账户是从哪一笔基金里分出来的","服务类型：记下这个账户对着哪一类服务","余额：记成这个账户分到的钱"],"out":[{"kind":"事件","title":"基金账户已开：带着她的 My Aged Care 编号和开了哪几个账户"}],"steps":[{"text":"一类服务开一个账户，记下它属于哪一笔基金、对着哪一类服务","on":["她名下的基金","服务类型"]},{"text":"把这个账户分到的钱记成余额","on":["余额"]},{"text":"发出事件","on":["基金账户已开"]}]},{"id":"act-5","title":"扣","why":"做了的服务从她名下对着这一类服务的账户里出钱，每扣一笔都查得到。","does":"从这个基金账户的余额里扣掉一笔。","rules":["r-10","r-11"],"in":[{"title":"金额","note":"要扣多少，澳元"},{"title":"服务类型","note":"这一笔是哪一类服务的钱"},{"title":"申报行","note":"这一笔是照哪一行申报行扣的"}],"edits":["余额：减去这一笔的金额"],"out":[{"kind":"事件","title":"已扣款：带着是照哪一行申报行扣的、她的 My Aged Care 编号、服务类型、扣了多少、还剩多少"}],"steps":[{"text":"从余额里减去这一笔的金额","on":["余额"]},{"text":"发出事件","on":["已扣款"]}]},{"id":"act-6","title":"补足额度","why":"先分到一部分、后来补到全额的，账户上的钱要跟着补上。","does":"把先前只分到一部分的账户补到全额。","rules":["r-15"],"in":[{"title":"这一次分到多少钱","note":"分到资金以后定出来的，是这一级的全额"}],"edits":["余额：加上全额和先前分到的那一部分的差"],"steps":[{"text":"把补的钱加到余额上","on":["余额"]}]}]}],"rules":[{"id":"r-1","kind":"做之前要满足的","short":"检查 My Aged Care 编号，还没有建过档案才能建档","text":"同一个 My Aged Care 编号只有一份参与者档案：这个编号已经有档案的，不再建第二份。","source":"手册 v4.4 §3 Participant","for":"j-1.1","why":"一位老人只有一份档案，后面的服务才有唯一的一份依据。","examples":[{"given":"编号 AC-1001 已经有一份参与者档案","when":"照护伙伴又拿这个编号建档","then":"被拒绝，不建第二份档案"},{"given":"编号 AC-1002 还没有档案","when":"照护伙伴拿这个编号建档","then":"核对通过，可以建档"}]},{"id":"r-2","kind":"一直要守的","short":"批到的分级和路径一直和决定通知书上批的一样","text":"参与者档案上批到的分级和路径只照决定通知书记，不能手改；政府发了新的决定通知书，才照新的那一份整个换掉。","source":"手册 v4.4 §6.6 行 562–568","for":"j-1.1","why":"她批到了什么以决定通知书为准，档案上记的不能和它不一样。","covers":["批到的分级和路径","参与者档案 › 决定通知书"],"examples":[{"given":"决定通知书上批的是第四级","when":"有人要把档案上的分级改成第五级","then":"不能改，档案上仍然是第四级"}],"doubt":"分级、路径和决定通知书不一样时，是不让建档，还是先建了再标出来，待定 q-1 还没有答。"},{"id":"r-3","kind":"一直要守的","short":"一个基金账户只能买她批了的那一类服务","text":"每个基金账户对着一类服务，只能买她批了的这一类服务；别的类的服务不能从这个账户扣。","source":"手册 v4.4 §9.2 行 1290","for":"j-5.1","why":"钱只能花在批给她的服务上，账户和服务类型一一对着才管得住。","covers":["基金账户 › 服务类型","参与者档案 › 批了的服务类型"],"examples":[{"given":"她名下有一个持续服务的基金账户","when":"有人要从这个账户扣一笔辅助技术的钱","then":"不能扣"}]},{"id":"r-4","kind":"一直要守的","short":"她名下各个账户的余额加起来，不超过这一季分到的钱","text":"一位老人名下各个基金账户的余额加起来，不超过她这一季分到的钱。","source":"手册 v4.4 §9.2 行 1290","for":"j-3.2","why":"账户上的钱和政府分给她的钱对得上，每一笔才说得清。","covers":["基金账户 › 余额","她名下的基金"],"examples":[{"given":"她这一季分到 2,000 澳元，名下有两个账户","when":"把两个账户的余额加起来","then":"不超过 2,000 澳元"}]},{"id":"r-5","kind":"做之前要满足的","short":"检查决定通知书，编号和分级都写着才能建档","text":"决定通知书上的内容不全的，不能照它建档。","items":["My Aged Care 编号必须写着。","批到的分级必须写着。"],"source":"手册 v4.4 §6.6 行 562–568","for":"j-1.1","why":"档案是照决定通知书建的，通知书不全就没有依据。","examples":[{"given":"决定通知书上没有写批到的分级","when":"照护伙伴照它建档","then":"被拒绝：通知书不全，不建档"}]},{"id":"r-6","kind":"状态能不能走","short":"检查档案状态，处于「已建档」才能记签协议","text":"只有处于「已建档」的参与者档案才能记下签了的服务协议；已经记过签协议的不再记。","source":"手册 v4.4 §7.1 行 676","for":"j-2.2","why":"一份档案只记一次签协议，看档案才分得清她签没签。","examples":[{"given":"档案已经是「已签协议」","when":"照护伙伴再记一次签协议","then":"被拒绝，档案不变"}]},{"id":"r-7","kind":"状态能不能走","short":"检查档案状态，还没有停用才能记分到资金","text":"参与者档案处于「已建档」「已签协议」或「分到资金」时才能记下分到资金；已经停用的档案不能再记。","source":"手册 v4.4 §6.8 行 592","for":"j-3.1","why":"分到的钱只开在还在这里的老人名下。","examples":[{"given":"档案已经是「已停用」","when":"照护伙伴照分资金的信记下分到资金","then":"被拒绝，档案不变"}],"doubt":"建模那边写的是只有已签协议的档案才能记分到资金；状态转换流程上还没签协议也能分到资金。以哪一个为准还没有定。"},{"id":"r-8","kind":"怎么算的","short":"定出分到的是全额还是一部分，照分资金的信","text":"分到的是全额还是一部分，照卫生部分资金的信上写的定，不由照护伙伴另选。","cases":["信上写的是全额资金：记成全额。","信上写的是过渡资金：记成一部分。"],"source":"手册 v4.4 §6.8.1.1 行 613–615","for":"j-3.1","why":"分到多少钱要查得到，全额和一部分开出来的钱不一样。","examples":[{"given":"分资金的信上写的是过渡资金","when":"照护伙伴照这封信记下分到资金","then":"档案上记成分到一部分"}]},{"id":"r-9","kind":"怎么算的","short":"定出开哪几个账户，照她批到的分级和路径","text":"她名下开哪几个基金账户，照决定通知书上批到的分级和路径定。","cases":["持续服务：照她批到的分级开一个账户。","批了辅助技术、家居改造、复健或临终这几条路径的：每条路径各多开一个账户。"],"source":"手册 v4.4 §9.2 行 1290","for":"j-3.2","why":"批了几类服务就有几个账户，每一类的钱分开记。","examples":[{"given":"她批到第四级的持续服务，另批了辅助技术这条路径","when":"分到资金以后开账户","then":"开两个账户：持续服务一个，辅助技术一个"}]},{"id":"r-10","kind":"做之前要满足的","short":"检查余额，够扣这一笔才能扣","text":"基金账户的余额不少于要扣的金额才能扣；不够的整笔不扣，余额不会扣成负数。","source":"手册 v4.4 §9.2 行 1290","for":"j-5.1","why":"账户里有多少钱才能花多少钱，余额才一直说得清。","examples":[{"given":"账户余额是 50 澳元","when":"要扣一笔 80 澳元","then":"被拒绝：余额不足，余额仍是 50 澳元"}]},{"id":"r-11","kind":"做之前要满足的","short":"检查服务类型，是这个账户对着的那一类才能扣","text":"要扣的这一笔的服务类型，必须是这个基金账户对着的那一类。","source":"申报格式 v1.14 第 4 节第 9 项","for":"j-5.1","why":"一类服务的钱只从对着它的那一个账户出。","examples":[{"given":"这个账户对着的是持续服务","when":"要扣的这一笔是辅助技术的钱","then":"被拒绝：服务类型不许"}]},{"id":"r-12","kind":"做之前要满足的","short":"检查申报行，政府审核通过、还没有扣过才能扣款","text":"只有政府审核通过、而且还没有扣过款的申报行才能拿来扣款；被退回的、已经扣过的都不扣。","source":"申报格式 v1.14 第 4 节","for":"j-5.1","why":"同一行申报只扣一次，没有通过的不动她的钱。","examples":[{"given":"一行申报行已经扣过款","when":"财务再拿这一行来扣款","then":"被拒绝，账户不变"},{"given":"一行申报行被政府退回","when":"财务拿这一行来扣款","then":"被拒绝，账户不变"}]},{"id":"r-13","kind":"怎么算的","short":"定出从哪个账户扣，照申报行上的编号和服务类型","text":"从哪个基金账户扣，照申报行上她的 My Aged Care 编号和服务类型定：她名下对着这一类服务的那一个。","source":"申报格式 v1.14 第 4 节第 9 项","for":"j-5.1","why":"别的业务要动钱都到这里来办，由这里定从哪个账户出。","examples":[{"given":"申报行上写着编号 AC-1001，服务类型是持续服务","when":"财务照这一行扣款","then":"找到 AC-1001 名下持续服务的那个账户"}]},{"id":"r-14","kind":"怎么算的","short":"定出这一次分到多少钱，照她批到的分级和分到的是全额还是一部分","text":"这一次分到多少钱，照她批到的分级算：分到全额的，是这一级一季的全额；分到一部分的，是这一级过渡资金的数。","source":"手册 v4.4 §6.8.1 行 597–624","for":"j-3.2","why":"开账户和补额度的钱数有一处说了算。","examples":[{"given":"她批到第四级，分到的是过渡资金","when":"分到资金以后开账户","then":"账户里记的是第四级过渡资金的数"}]},{"id":"r-15","kind":"怎么算的","short":"定出补多少，照全额和先前分到的那一部分的差","text":"补足额度时补的钱，是这一级一季的全额减去先前已经分到的那一部分。","source":"手册 v4.4 §6.8.1.1 行 613–615","for":"j-3.2","why":"先分到一部分、后来补到全额，加起来正好是全额。","examples":[{"given":"先前分到的一部分是 600 澳元，这一级的全额是 2,000 澳元","when":"补足额度","then":"账户的余额加上 1,400 澳元"}]},{"id":"r-16","kind":"怎么算的","short":"定出这个账户还能用多少，照它现在的余额","text":"一个基金账户还能用多少，就是它现在的余额：开立时记下的分到的钱，加上后来补足的额度，减去已经扣掉的每一笔。","for":"j-4.1","why":"看到的数和账户上记着的每一笔进出对得上。","examples":[{"given":"一个基金账户开立时分到 2,000 澳元，后来扣过 300 澳元和 450 澳元两笔","when":"照护伙伴查看这个账户还能用多少","then":"看到的是 1,250 澳元"}],"doubt":"这个算法是照基金账户的三个行为（开立、扣、补足额度）怎么改余额推出来的，原料里没有写「还能用多少」怎么算，所以没有出处。服务已经做了、申报行还没有扣款的那些钱，这里没有先减掉；要不要先减掉，还没有问过做业务的人。"}],"intro":{"context":"政府批给老人的钱开在她名下，由 Services Australia 保管；注册服务方替她建档，做了服务以后从她名下的账户里扣。","duty":["管每位老人的档案和她名下的基金、账户：建档，记下她签了协议、分到了资金，按申报从账户扣款。","不管评估怎么做、服务怎么排、发票怎么开。"],"concepts":[{"title":"参与者档案","note":"注册服务方替一位老人留的记录，写着她批了什么、走到了哪一步。"},{"title":"她名下的基金","note":"政府开在老人名下、替她保管的一笔钱。"},{"title":"基金账户","note":"一笔基金按批了的服务类型分开的账户，扣款只从对应的那一个扣。"}],"users":[{"who":"照护伙伴","aim":"替老人把档案建好、记准，钱到了就能开始用","steps":["照决定通知书给她建档","她签了服务协议，在档案上记下来","分到资金那天记下来，开出她名下的基金"]},{"who":"财务","aim":"服务做完、申报以后，把钱从对的账户里扣掉","steps":["照申报行从基金账户扣款"]}],"usual":["照护伙伴照决定通知书给老人建档","她签了服务协议，档案上记下","卫生部来信说分到了资金，开出她名下的基金和账户","做了服务、申报以后，从对应的账户扣款"]},"jobs":[{"id":"j-1","by":"照护伙伴","title":"照决定通知书替一位老人建立参与者档案","done":"她的参与者档案建好了，状态是「已建档」。","steps":[{"id":"j-1.1","title":"照决定通知书建立参与者档案","why":"老人交来决定通知书，要给她留一份档案，以后签协议、分资金、记服务都记在这一份上。","fns":["f-1"]}]},{"id":"j-2","by":"照护伙伴","title":"在她的档案上记下签了的服务协议","done":"参与者档案的状态是「已签协议」，档案上记着她签的是哪一份服务协议、哪天签的。","steps":[{"id":"j-2.1","title":"先查看她的档案","why":"记之前先看清她批到了什么、签没签过服务协议。","fns":["f-5"]},{"id":"j-2.2","title":"记下她签了的服务协议","why":"她跟注册服务方签了服务协议，档案上要看得出她已经签了、签的是哪一份。","fns":["f-2"]}]},{"id":"j-3","by":"照护伙伴","title":"记下她分到了资金，让钱开在她名下","done":"参与者档案的状态是「分到资金」，她批了的每一类服务都有一个基金账户，账户上记着分到的钱。","steps":[{"id":"j-3.1","title":"照分资金的信记下她分到了资金","why":"卫生部来信说她分到了资金，从这一天起钱开在她名下。","fns":["f-3"]},{"id":"j-3.2","title":"系统开出她名下的基金账户，先前只分到一部分的补到全额","why":"档案上记下分到资金以后，分到的钱要落到她名下的基金账户上。","chains":["c-1"],"side":true}]},{"id":"j-4","by":"照护伙伴","title":"替老人安排服务之前，看她名下的钱还能用多少","done":"看到了她名下对着这一类服务的基金账户还能用多少钱。","steps":[{"id":"j-4.1","title":"查看基金账户还能用多少","why":"安排服务之前，要知道她名下这一类服务的基金账户还能用多少钱。","fns":["f-6"]}]},{"id":"j-5","by":"财务","title":"照审核通过的申报行，从她名下的基金账户扣款","done":"这一行申报的钱从她名下对着这一类服务的基金账户里扣掉了，余额少了这一笔。","steps":[{"id":"j-5.1","title":"照申报行从基金账户扣款","why":"服务做了、申报通过了，这一行的钱要从她名下对着这一类服务的账户里扣掉。","fns":["f-4"]}]}],"flows":[{"title":"从建档到分到资金","purpose":"替一位新来的老人把档案建好、记准，分到的钱开在她名下，后面做的服务才有依据、有钱可扣。","why":"建档、签协议、分到资金是接着办的一条线：后一段都记在前一段建好的那份参与者档案上，所以排成一张表。","stages":[{"title":"建档","states":["已建档"],"note":"老人交来决定通知书和支持计划，照护伙伴照它们建立参与者档案。","parts":["j-1.1"]},{"title":"签协议","states":["已签协议"],"note":"她和注册服务方签了服务协议，照护伙伴先看她的档案，再在档案上记下她签的是哪一份。","parts":["j-2.1","j-2.2"]},{"title":"分到资金","states":["分到资金"],"note":"卫生部来信说她分到了资金，照护伙伴照信记下来；系统接着开出她名下的基金账户。还没签协议就分到资金的，也照这一段办。","parts":["j-3.1","j-3.2"]}],"anytime":{"title":"看还能用多少","note":"分到资金以后，照护伙伴替老人安排服务之前，随时可以看她名下的基金账户还能用多少。","parts":["j-4.1"]}},{"title":"做了服务以后扣款","purpose":"做了的服务，钱从她名下对着这一类服务的基金账户里扣掉，每一笔都说得清。","why":"扣款是「服务发生与申报」那边的申报行审核通过以后才引起的，不接在建档那条线后面，所以另起一张表。","stages":[{"title":"扣款","note":"政府审核通过一行申报行以后，财务照这一行从她名下对着这一类服务的基金账户扣款。","parts":["j-5.1"]}]}],"groups":[{"title":"参与者档案","functions":[{"id":"f-1","title":"照决定通知书建立参与者档案","called":"建档","does":"照决定通知书记下她批了哪一级、哪条路径","intent":"老人交来决定通知书，给她留一份档案，以后签协议、分资金、记服务都记在这一份上。","who":"照护伙伴","subject":{"title":"这位老人的参与者档案","op":"创建","to":"档案建好了，记着她批到的分级和路径"},"in":[{"title":"决定通知书","by":"老人交来的","note":"政府评估后发给她的那一份，上面写着编号、分级和路径"},{"title":"支持计划","by":"老人交来的","note":"同一次评估一起发的，写着批了她哪些服务类型"}],"out":[],"rules":[],"services":["s-1"],"calls":["act-1"],"steps":[{"text":"照决定通知书和支持计划，读出她的编号、批到的分级和路径、批了的服务类型。"},{"fn":"f-2","after":true,"text":"她交来决定通知书时已经签了服务协议的，接着记下签了的服务协议。"}],"returns":"新建的参与者档案","uses":[{"flow":"01-老人注册","step":5}],"source":"手册 v4.4 §3 Participant"},{"id":"f-2","title":"在参与者档案上记下签了的服务协议","does":"记下她跟哪家签了协议、哪天签的","intent":"她跟注册服务方签了服务协议，档案上要看得出她已经签了、签的是哪一份。","who":"照护伙伴","subject":{"title":"这位老人档案上签了的服务协议","op":"创建","to":"档案上记着她签了哪一份服务协议、哪天签的"},"in":[{"title":"参与者档案","note":"记在哪一位老人的档案上"},{"title":"服务协议","by":"老人签的","note":"她跟注册服务方签的那一份"}],"out":[],"rules":[],"calls":["act-2"],"steps":[{"call":{"topic":"服务方与协议","title":"查一份服务协议"},"text":"取回这份服务协议上的签约日期，和它现在是不是还有效。"}],"uses":[{"flow":"01-老人注册","step":6}]},{"id":"f-3","title":"记下分到资金并开出她名下的基金","does":"记下分到资金那天和分到的是全额还是一部分，开出她名下的基金","intent":"卫生部来信说她分到了资金，从这一天起钱开在她名下，后面的服务才能从这笔钱里扣。","who":"照护伙伴","subject":{"title":"这位老人的参与者档案","op":"更新","to":"档案上记着她哪天分到资金、分到的是全额还是一部分"},"in":[{"title":"参与者档案","note":"哪一位老人分到了资金"},{"title":"分资金的信","by":"卫生部发的","note":"写着分到资金的日期，分到的是全额还是一部分"}],"out":[],"rules":[],"calls":["act-3"],"uses":[{"flow":"01-老人注册","step":8}]},{"id":"f-5","title":"查看一位老人的档案","does":"照 My Aged Care 编号看她的档案：批到的分级和路径、她在哪一段","intent":"照护伙伴替一位老人办事之前，先看清她批到了什么、签没签服务协议，再接着往下办。","who":"照护伙伴","subject":{"title":"这位老人的参与者档案","op":"查看"},"in":[{"title":"My Aged Care 编号","note":"要看的是哪一位老人的档案"}],"rules":[],"calls":[],"steps":[{"text":"照 My Aged Care 编号找到她的参与者档案。"}],"returns":"她的参与者档案、批到的分级和路径、她在哪一段"}]},{"title":"基金账户","functions":[{"id":"f-4","title":"照申报行从基金账户扣款","does":"按申报行上她的编号和服务类型，从对应的账户扣","intent":"服务做了、申报了，这一行的钱要从她名下对应的那个账 了再标出来"]},{"id":"q-2","q":"「后面的服务有一份说了算的依据」这条目的是推出来的，原料没有写为什么要替老人建档。建档是为了这个吗？","lean":"是这个目的","options":["是这个目的","建档只是为了记下她是谁"]},{"id":"q-3","q":"「她签了服务协议，要在档案上看得出签了、签的是哪一份」这条子目的是推出来的，原料只写了签了协议要记进档案，没有写记下来是为了什么。记下来是为了这个吗？","lean":"是这个目的","options":["是这个目的","记下来只是为了留一份底"]},{"id":"q-4","q":"参与者档案上的「共付比例」这一栏是为了什么？原料里写了它定了每次服务老人自己付几成，没有写这一栏在这个主题里给谁用，目的的树上现在没有哪一个落点落到它上面。","lean":"为了申报时分出政府补多少、老人自己付多少，这里只替「服务发生与申报」记着","options":["为了申报时分出政府补多少、老人自己付多少，这里只替「服务发生与申报」记着","为了说得清她名下的钱，归到「分到的钱和扣掉的钱，每一笔都查得到」","是为了别的，另写一条目的"]},{"id":"q-5","q":"参与者档案上的「建档日期」这一栏是为了什么？原料里没有写记下建档的那一天给谁用，目的的树上现在没有哪一个落点落到它上面。","lean":"只是留一份底，不为哪一条目的","options":["只是留一份底，不为哪一条目的","为了查的时候说得清她从哪一天起由这家注册服务方照护"]}]},"g5":{"topic":"g5","title":"服务发生与申报","summary":"注册服务方把做了的每一次服务记成服务记录，再照服务记录向政府申报。","tours":[{"title":"外部服务方做的服务：从发票到申报、月结单","note":"请外部服务方做的服务，从发票登记进来，核对后记成服务记录，写成申报行报给政府，月底列进月结单。","steps":[{"by":"照护伙伴","text":"外部服务方开来发票，把发票上的每一行登记成发票行。","concepts":["发票行"],"fns":["f-2"],"stage":"记下服务","jobs":["j-2.1"]},{"by":"照护伙伴","text":"对着老人签的服务协议核对发票行，核对无误的一行记成一条服务记录。","concepts":["服务协议","服务记录","凭据"],"fns":["f-3"],"stage":"记下服务","jobs":["j-2.2","j-2.3"]},{"by":"财务","text":"把还没申报的服务记录写成申报行，报给政府。","concepts":["申报行"],"fns":["f-5"],"stage":"申报","jobs":["j-5.1"]},{"by":"财务","text":"政府审核完，记下每一行申报行是通过还是被退回。","concepts":["申报行"],"fns":["f-8"],"stage":"审核","jobs":["j-5.2"]},{"by":"财务","text":"审核通过的一行，从老人名下的基金账户扣款。扣款在「参与者档案与她名下的钱」里办。","concepts":["基金账户"],"stage":"扣款","jobs":["j-5.4"]},{"by":"财务","text":"月底把这个月的服务记录和照护管理记录汇总成月结单，发给老人。","concepts":["月结单","月结单明细"],"fns":["f-6"],"stage":"出月结单","jobs":["j-6.1"]}]},{"title":"自己做的服务、老人先付的钱和照护管理","note":"另外三种情形各记各的：自己的工作者做的服务直接记，老人先付的钱照收据记，照护伙伴做的照护管理单独记。","steps":[{"by":"照护伙伴","text":"自己的工作者上门做了一次服务，照服务清单选出做的是哪一项，记下一条服务记录。","concepts":["服务清单","服务记录"],"fns":["f-1"],"stage":"记下服务","jobs":["j-1.1"]},{"by":"照护伙伴","text":"老人自己先付了钱、交来收据的，核对收据以后记成服务记录。","concepts":["服务记录","凭据"],"fns":["f-4"],"stage":"记下服务","jobs":["j-3.1"]},{"by":"照护伙伴","text":"替老人做了一次照护管理，记下一条照护管理记录。","concepts":["照护管理记录"],"fns":["f-7"],"jobs":["j-4.1"]}]}],"goals":[{"id":"g-1","aim":"每一次服务都照政府的要求留痕，查的时候拿得出依据。","source":"人 2026-11-24 说：按照要求为服务留痕","plan":"要成立三样：做了的服务一次不漏，都落成服务记录；每条服务记录都指得出它的依据；照护伙伴做的照护管理也留下记录。外部服务方做的服务，要等它的发票行核对过了，才落成服务记录。","parts":[{"id":"g-1.1","aim":"做了的服务不管从哪里来，都要落成一条服务记录，一次不漏。","way":"服务记录-记下一次服务","act":"act-1","land":"服务记录-老人、日期、服务项、数量、金额、状态","source":"人 2026-11-24 说：按照要求为服务留痕"},{"id":"g-1.2","aim":"每条服务记录都指得出它的依据。","source":"手册 v4.4 §10.3 行 1520","plan":"要成立三样：外部服务方开来的发票，每一行都登记成发票行；发票行核对过了才算数；服务记录上记着它是照哪一份凭据记的。核对要等发票行登记了；服务记录上记凭据，要等发票行核对过了。","parts":[{"id":"g-1.2.1","aim":"外部服务方做的服务要留下凭据，发票上的每一行都登记成一条发票行。","way":"发票行-登记并等着核对","act":"act-8","land":"发票行-发票号、服务项、数量、金额"},{"id":"g-1.2.2","aim":"发票行要核对过才算数，核对过没核对过在发票行上看得出，核对过的才记成服务记录。","way":"发票行-记成核对过了","act":"act-9","land":"发票行-状态"},{"id":"g-1.2.3","aim":"外面来的服务，每一条服务记录都指得出它的凭据是哪一份。","way":"服务记录-记下一次服务","act":"act-1","land":"凭据-凭据的种类、发票行、收据"}]},{"id":"g-1.3","aim":"照护伙伴替老人做的照护管理也要留下记录，月底看得出这个月做没做、做了多久。","way":"照护管理记录-记下一次照护管理","act":"act-3","land":"照护管理记录-老人、日期、做了多久、做了什么","source":"手册 v4.4 §8.4 行 960"}]},{"id":"g-2","aim":"交给政府的申报行要通得过政府的审核。","source":"人 2026-11-24 说：系统要提供出符合政府审核的申报项","plan":"要成立三样：报上去的每一行都对得上一次真做了的服务；不报政府不认的服务；政府审核的结果有着落。写申报行要等服务记录记下了；审核的结果要等申报行报上去才有。","parts":[{"id":"g-2.1","aim":"报上去的每一行都对得上一次真做了的服务。","source":"申报格式 v1.14 第 4 节","plan":"要成立三样：服务清单上每一项服务属于哪一类服务类型，从「服务清单」取得回来；每一行申报行都照一条服务记录写出来；写过申报行的服务记录不再写第二行。写申报行要等服务类型取回来；服务记录记成已申报，要等它的申报行写出来。","parts":[{"id":"g-2.1.1","aim":"写申报行之前，取得回服务清单上每一项服务属于哪一类服务类型。","way":"外部调用-服务清单-查一项服务","land":"向服务清单发出的一次请求","made":true},{"id":"g-2.1.2","aim":"每一行申报行都从一条服务记录写出来，上面写的都照这一条服务记录。","way":"申报行-写出并报给政府","act":"act-4","land":"申报行-服务记录、老人的编号、服务类型、申报的金额"},{"id":"g-2.1.3","aim":"一条服务记录只写成一行申报行，写过的不再写。","way":"服务记录-记成已申报","act":"act-2","land":"服务记录-状态"}]},{"id":"g-2.2","aim":"不报政府不认的服务。","source":"手册 v4.4 §10.1 行 1466","plan":"要成立两样：老人签的服务协议里有哪几项服务，从「服务方与协议」取得回来；服务协议里没有的服务，不记成服务记录。记服务记录要等协议里的服务项取回来。","parts":[{"id":"g-2.2.1","aim":"记服务记录、核对发票行之前，取得回这位老人签的服务协议里 做了几小时，或者做了几次"},{"title":"金额","note":"这一次服务多少钱，澳元"},{"title":"凭据","note":"核对过的那一行发票行，或者老人交来的那张收据；自己的工作者做的服务没有"},{"title":"服务协议上的服务项","note":"老人签的服务协议里有哪几项服务，由叫这个行为的功能取回来"}],"edits":["老人：记下这一次服务是给哪一位老人做的","日期：记下这一次服务是哪天做的","服务项：记下做的是服务清单上的哪一项","数量：记下做了多少","金额：记下这一次服务多少钱","做服务的人：记下是自己的工作者，还是外部服务方","凭据：有凭据的，记下这一条是照哪一行发票行或者哪一张收据记的","状态：新记下的服务记录是「等着申报」"],"out":[{"kind":"事件","title":"服务记录已记下：带着是哪一位老人、哪天、哪项服务和金额"}],"steps":[{"text":"记下这一次服务是给哪一位老人、哪天做的","on":["老人","日期"]},{"text":"记下做的是哪一项服务、做了多少、多少钱","on":["服务项","数量","金额"]},{"text":"照这一次服务从哪里来，记下做服务的人和凭据","on":["做服务的人","凭据"]},{"text":"状态记成「等着申报」","on":["状态"]},{"text":"发出事件","on":["服务记录已记下"]}],"doubt":"自己的工作者做的服务，金额从哪里来，原料里没有写：功能「记下自己的工作者做的一次服务」现在只带进服务项和数量。"},{"id":"act-2","title":"记成已申报","from":"等着申报","to":"已申报","why":"一条服务记录只写成一行申报行，写过的不再写。","does":"这一条服务记录写成申报行报给政府以后，把它记成「已申报」。","rules":["r-4"],"edits":["状态：等着申报 → 已申报"],"steps":[{"text":"更新状态：「等着申报」→「已申报」","on":["状态"]}]}]},{"title":"照护管理记录","why":"照护伙伴替老人做的照护管理也要留下记录：这个月做没做、做了多久，照这些记录来看，月结单上也要列出来。","sources":[{"steps":[{"data":"照护伙伴做了一次照护管理","event":true,"op":"创建","by":"记下这一次照护管理","fn":"f-7"}]}],"targets":[{"op":"创建","by":"按月汇总，发给老人","fn":"f-6","data":"月结单"}],"actions":[{"id":"act-3","title":"记下一次照护管理","why":"照护伙伴替老人做的照护管理也要留下记录，月底看得出这个月做没做、做了多久。","does":"记下一次照护管理：替哪一位老人、哪天、做了多久、做了什么。","rules":[],"in":[{"title":"老人","note":"这一次照护管理是替哪一位老人做的"},{"title":"日期","note":"哪天做的"},{"title":"做了多久","note":"这一次花的时间，按分钟记"},{"title":"做了什么","note":"照护伙伴用一两句话写的"}],"edits":["老人：记下是替哪一位老人做的","日期：记下哪天做的","做了多久：记下照护伙伴填的分钟数","做了什么：记下照护伙伴写的一两句话"],"out":[{"kind":"事件","title":"照护管理已记下：带着是哪一位老人、哪天、做了多久"}],"steps":[{"text":"记下老人、日期、做了多久和做了什么","on":["老人","日期","做了多久","做了什么"]},{"text":"发出事件","on":["照护管理已记下"]}]}]},{"title":"申报行","why":"向政府申报是一行一行办的：报上去、通过或者退回，通过了才扣款，每一步都照申报行办。","sources":[{"steps":[{"data":"服务记录","op":"创建","by":"一条写成一行，报给政府","fn":"f-5"}]}],"targets":[{"op":"更新","by":"审核通过的一行交去扣款","fn":"f-8","data":"基金账户","topic":"参与者档案与她名下的钱"}],"keeps":["r-6"],"actions":[{"id":"act-4","title":"写出并报给政府" "steps":[{"text":"记下老人和月份","on":["老人","月份"]},{"text":"把带进来的每一条记录各列成一行明细","on":["月结单明细"]},{"text":"把各行明细的金额加起来，记成合计","on":["合计"]},{"text":"发出事件，月结单照它发给老人","on":["月结单已出"]}]}]}],"concepts":[{"title":"发票行","actions":[{"id":"act-8","title":"登记并等着核对","to":"等着核对","why":"外部服务方做的服务要留下凭据，发票上的每一行都登记成一条发票行。","does":"照发票上的一行登记一条发票行：在哪一张发票上、哪项服务、做了多少、多少钱，登记了就等着核对。","rules":[],"in":[{"title":"发票","note":"这一行在哪一张发票上"},{"title":"发票上的一行","note":"这一行写的服务项、数量和金额"}],"edits":["发票号：记下这一行在哪一张发票上","服务项：照发票上这一行写的记下","数量：照发票上这一行写的记下","金额：照发票上这一行写的记下","状态：新登记的发票行是「等着核对」"],"steps":[{"text":"记下这一行在哪一张发票上","on":["发票号"]},{"text":"照发票上这一行记下服务项、数量和金额","on":["服务项","数量","金额"]},{"text":"状态记成「等着核对」","on":["状态"]}]},{"id":"act-9","title":"记成核对过了","from":"等着核对","to":"核对过了","why":"发票行要核对过才算数，核对过没核对过在发票行上看得出，核对过的才记成服务记录。","does":"这一行发票行核对无误以后，把它记成「核对过了」。","rules":["r-5"],"in":[{"title":"服务协议上的服务项","note":"老人签的服务协议里有哪几项服务，由叫这个行为的功能取回来"}],"edits":["状态：等着核对 → 核对过了"],"out":[{"kind":"事件","title":"发票行已核对：带着这一行发票行和服务协议上的服务项"}],"steps":[{"text":"更新状态：「等着核对」→「核对过了」","on":["状态"]},{"text":"发出事件；服务记录由响应「发票行核对过以后」接着记下。","on":["发票行已核对"]}]}]}],"uses":[{"title":"服务清单","note":"政府定的服务组、服务类型、服务三层；做的是清单上的哪一项，照它查。"},{"title":"服务协议","note":"老人跟注册服务方签的那一份；核对一项服务在不在她签的协议里，照它查。"}],"rules":[{"id":"r-1","kind":"一直要守的","short":"凭据记下以后不换、不改","text":"一条服务记录的凭据记下以后不换、不改：它是照哪一行发票行、哪一张收据记的，以后一直是那一份。","source":"手册 v4.4 §10.3 行 1520","for":"j-2.3","why":"查的时候每条服务记录都指得出它当初的依据。","covers":["服务记录 › 凭据","凭据"],"examples":[{"given":"一条服务记录的凭据是发票 INV-208 的第 2 行","when":"有人要把它的凭据换成这张发票的第 3 行","then":"不能换，凭据仍是第 2 行"}],"doubt":"建模那边的聚合把凭据写成「签到记录或照片，附上就不改」。「附上就不改」两边一样；凭据是什么两边不一样：业务这边的凭据是发票上的一行或者老人交来的收据，自己的工作者做的服务没有凭据。以哪一边为准还没有定。"},{"id":"r-2","kind":"做之前要满足的","short":"检查服务项，在她签的服务协议里才能记下","text":"服务记录上的服务项必须是老人签的服务协议里有的一项；协议里没有的服务不记成服务记录。","source":"手册 v4.4 §10.1 行 1466","for":"j-1.1","why":"政府不认协议以外的服务，记下来的每一条都要报得上去。","examples":[{"given":"她签的服务协议里有家务清洁，没有园艺","when":"照护伙伴记下一次园艺服务","then":"被拒绝：这项服务不在她签的服务协议里，不记服务记录"},{"given":"她签的服务协议里有家务清洁","when":"照护伙伴记下一次家务清洁","then":"核对通过，可以记下"}],"doubt":"手册还要求服务是批给这位老人的服务类型。批了哪几类记在「参与者档案与她名下的钱」的参与者档案上，那个主题现在没有可以调用来查它的功能，这一半还没有落成规则。"},{"id":"r-3","kind":"怎么算的","short":"定出服务记录的凭据和做服务的人，照这一次服务从哪里来","text":"一条服务记录的凭据是哪一份、做服务的人记成谁，照这一次服务从哪里来定。","cases":["自己的工作者做的：做服务的人记成自己的工作者，没有凭据。","外部服务方做的：做服务的人记成外部服务方，凭据是核对过的那一行发票行，一行发票行记一条服务记录。","老人自己先付了钱的：凭据是她交来的那张收据。"],"source":"手册 v4.4 §10.3 行 1520","for":"j-2.3","why":"外面来的服务，每一条都指得出它的凭据是哪一份。","examples":[{"given":"发票 INV-208 的第 2 行核对过了","when":"照这一行记下服务记录","then":"这条服务记录的凭据是 INV-208 的第 2 行，做服务的人是外部服务方"},{"given":"自己的工作者上门做了一次家务清洁","when":"照护伙伴记下这一次服务","then":"这条服务记录没有凭据，做服务的人是自己的工作者"}]},{"id":"r-4","kind":"状态能不能走","short":"检查服务记录的状态，等着申报才能记成已申报","text":"只有处于「等着申报」的服务记录才能写成申报行、记成「已申报」；已经申报过的不再写第二行。","source":"申报格式 v1.14 第 4 节","for":"j-5.1","why":"一条服务记录只对着一行申报行，同一次服务不报两次。","examples":[{"given":"一条服务记录已经是「已申报」","when":"财务又拿它写申报行","then":"被拒绝，不写第二行申报行"}]},{"id":"r-5","kind":"状态能不能走","short":"检查发票行的状态，等着核对才能核对","text":"只有处于「等着核对」的发票行才能核对；已经核对过的不再核对，也不再记第二条服务记录。","source":"手册 v4.4 §10.3 行 1512","for":"j-2.2","why":"一行发票行只记成一条服务记录，凭据和服务记录一行对一条。","examples":[{"given":"发票 INV-208 的第 2 行已经是「核对过了」","when":"照护伙伴再核对一次这一行","then":"被拒绝，不记第二条服务记录"}]},{"id":"r-6","kind":"一直要守的","short":"一行申报行一直对着同一条服务记录","text":"一行申报行从写出来起就对着一条服务记录，以后不换；被退回的申报行改了以后重新报，还是这一行，不另写一行。","source":"申报格式 v1.14 第 4 节","for":"j-5.1","why":"报上去的每一行什么时候查，都对得上那一次真做了的服务。","covers":["申报行 › 服务记录"],"examples":[{"given":"一行申报行是照 10 月 3 日那条家务清洁的服务记录写出来的，被政府退回了","when":"财务改了以后重新报上去","then":"报的仍是这一行，它对着的仍是 10 月 3 日那条服务记录"}]},{"id":"r-7","kind":"怎么算的","short":"定出申报行上写什么，照它对着的那一条服务记录","text":"申报行上的老人的编号、服务类型和申报的金额，都照它对着的那一条服务记录写，不由财务另填。","items":["老人的编号：服务记录上那位老人的 My Aged Care 编号。","服务类型：服务记录上的服务项在服务清单上属于的那一类。","申报的金额：服务记录上的金额。"],"source":"申报格式 v1.14 第 4 节","for":"j-5.1","why":"申报行只能从服务记录写出来，报的内容和记下的那一次服务一样。","examples":[{"given":"一条服务记录记着老人 AC-1001、家务清洁、80 澳元；家务清洁在服务清单上属于日常生活这一类","when":"财务照它写申报行","then":"申报行上写着编号 AC-1001、服务类型日常生活、申报的金额 80 澳元"}]},{"id":"r-8","kind":"状态能不能走","short":"检查申报行的状态，已报给政府才能记审核结果","text":"只有处于「已报给政府」的申报行才能记审核结果；已经记过结果的不再记。","source":"申报格式 v1.14 第 6 节","for":"j-5.2","why":"一行申报行报一次只有一个审核结果。","examples":[{"given":"一行申报行已经是「审核通过」","when":"财务又给它记一次审核结果","then":"被拒绝，申报行不变"}]},{"id":"r-9","kind":"怎么算的","short":"定出申报行走到哪个状态，照政府回的审核结果","text":"申报行记成审核通过还是被退回，照政府回的审核结果定，不由财务另选。","cases":["政府回的是通过：记成「审核通过」。","政府回的是退回：记成「被退回」，同时记下退回的原因。"],"source":"申报格式 v1.14 第 6 节","for":"j-5.2","why":"通过的才能扣款，被退回的要看得到原因才能改了重新报。","examples":[{"given":"政府对一行申报行回的是退回，原因是服务类型填错","when":"财务记下审核结果","then":"申报行记成「被退回」，退回的原因记着「服务类型填错」"},{"given":"政府对一行申报行回的是通过","when":"财务记下审核结果","then":"申报行记成「审核通过」"}]},{"id":"r-10","kind":"状态能不能走","short":"检查申报行的状态，审核通过才能记成已扣款","text":"只有处于「审核通过」的申报行才能记成「已扣款」；还没有通过的、被退回的、已经扣过款的都不能记。","source":"申报格式 v1.14 第 6 节","for":"j-5.4","why":"通过的才扣款，同一行只记一次已扣款。","examples":[{"given":"一行申报行是「被退回」","when":"要把它记成已扣款","then":"被拒绝，申报行不变"}]},{"id":"r-11","kind":"一直要守的","short":"月结单出了以后留着，不改","text":"月结单出给老人以后留着，上面的明细和金额不再改。","source":"手册 v4.4 §11.2 行 1630","for":"j-6.1","why":"老人手里的那一份和这里留着的那一份一直是同一份，她照它付自己该付的钱。","covers":["月结单","月结单明细"],"examples":[{"given":"十月的月结单已经出给老人","when":"有人要改上面一行明细的金额","then":"不能改，月结单仍是出给她的那一份"}],"doubt":"老人对月结单有异议、要更正的时候怎么办，原料里没有写。"},{"id":"r-12","kind":"怎么算的","short":"定出月结单上的明细，照带进来的每一条记录","text":"月结单上的明细照带进来的记录列：一条服务记录、一条照护管理记录各列一行，金额照那一条记录上的金额写。","source":"手册 v4.4 §11.2 行 1634","for":"j-6.1","why":"老人看得到每一项服务花了多少钱，不只是一个总数。","examples":[{"given":"一位老人十月有 3 条服务记录、1 条照护管理记录","when":"财务出十月的月结单","then":"月结单上列 4 行明细，每一行的金额和那一条记录上的一样"}],"doubt":"一条记录列一行是推出来的，待定 q-2 还没有答。照护管理记录上现在没有金额这一栏，它那一行的金额从哪里来，原料里没有写。"},{"id":"r-13","kind":"怎么算的","short":"定出这一次申报哪几条服务记录，照服务记录的状态","text":"这一次申报的是全部处于「等着申报」的服务记录；已申报的不再带出来。","source":"申报格式 v1.14 第 4 节","for":"j-5.1","why":"申报行只从还没有报过的服务记录写出来。","examples":[{"given":"有 5 条服务记录，其中 2 条已申报，3 条等着申报","when":"财务写申报行","then":"带出来的是等着申报的那 3 条"}]},{"id":"r-14","kind":"怎么算的","short":"定出月结单上列哪几条记录，照老人和月份","text":"一份月结单上列的是这一位老人在这一个月里的全部服务记录和照护管理记录；一条记录属于哪个月，照它上面的日期定。","source":"手册 v4.4 §11.2 行 1630","for":"j-6.1","why":"老人看到的是她自己这个月用了的全部服务，不多也不少。","examples":[{"given":"一位老人有一条 10 月 31 日的服务记录和一条 11 月 1 日的服务记录","when":"财务出她十月的月结单","then":"带出来的是 10 月 31 日那一条，11 月 1 日那一条留到十一月的月结单"}]}],"intro":{"context":"政府出钱替老人买居家照护服务：注册服务方先把服务做了，或者请外部服务方做，再向政府申报，政府审核通过才付钱。","duty":["管服务记录和照它做的申报：把做了的服务记准，登记和核对外面开来的发票，向政府申报，按月给老人出月结单。","不管钱从哪个账户扣、协议怎么签。"],"concepts":[{"title":"服务记录","note":"做了一次服务记一条：哪天、哪项服务、多少、多少钱。"},{"title":"发票行","note":"外部服务方开来的发票上的一行，对着一次服务。"},{"title":"申报行","note":"向政府申报的一行，对着一条服务记录。"},{"title":"月结单","note":"每月给老人的一份清单，列着这个月的服务和花的钱。"},{"title":"照护管理记录","note":"照护伙伴替老人做一次照护管理记一条：哪天、做了多久、做了什么。"}],"users":[{"who":"照护伙伴","aim":"把做了的服务记准","steps":["记下自己的工作者做的服务","登记外部服务方开来的发票，核对以后记成服务记录","核对老人交来的收据，记成服务记录","记下做了的照护管理"]},{"who":"财务","aim":"照服务记录向政府申报，按月给老人出清单","steps":["把服务记录写成申报行","记下政府对申报行的审核结果","出月结单"]}],"usual":["做了一次服务，记下一条服务记录","外面开来的发票登记、核对，记成服务记录","财务照服务记录写申报行，报给政府","政府审核通过的申报行交去扣款","月底给老人出月结单"]},"jobs":[{"id":"j-1","by":"照护伙伴","title":"记下自己的工作者做的一次服务","done":"这一次服务有了一条服务记录，状态是「等着申报」。","steps":[{"id":"j-1.1","title":"记下自己的工作者做的一次服务","why":"自己的工作者上门做了一次服务，要有一条记录，后面才能申报。","fns":["f-1"]}]},{"id":"j-2","by":"照护伙伴","title":"把外部服务方开来的发票记成服务记录","done":"发票上核对无误的每一行发票行都是「核对过了」，各有一条服务记录，状态是「等着申报」。","steps":[{"id":"j-2.1","title":"把发票上的每一行登记成发票行","why":"外部服务方做了服务、开来发票，先一行一行登记下来，核对以后才能记成服务记录。","fns":["f-2"]},{"id":"j-2.2","title":"对着服务协议核对发票行","why":"登记了的发票行要有人核对过才算数。","fns":["f-3"]},{"id":"j-2.3","title":"系统把核对过的发票行记成一条服务记录","why":"核对无误的一行发票行，要落成一条服务记录。","chains":["c-1"],"side":true}]},{"id":"j-3","by":"照护伙伴","title":"把老人自己先付了钱的服务记成服务记录","done":"这张收据对着的服务有了一条服务记录，状态是「等着申报」。","steps":[{"id":"j-3.1","title":"核对老人交来的收据，照它记成服务记录","why":"老人自己先付了钱、交来收据，核对无误才记成服务记录，后面照它申报、把钱退给她。","fns":["f-4"]}]},{"id":"j-4","by":"照护伙伴","title":"记下替老人做的一次照护管理","done":"这一次照护管理有了一条照护管理记录。","steps":[{"id":"j-4.1","title":"记下一次照护管理","why":"照护伙伴替老人联系、安排了一次，要有一条记录，月底才看得出这个月做没做。","fns":["f-7"]}]},{"id":"j-5","by":"财务","title":"把做了的服务报给政府，把审核的结果办完","done":"报上去的申报行是「已扣款」。","steps":[{"id":"j-5.1","   //    虚框之间的上下层级（tree）算一组：上一层在上、下一层紧贴在下面，同一列。
  //    左边：直接连进主题框、自己没有进线的一组在左 1 列；只往左边虚框送的再往左一列。
  //    其余都在右边：按先后排列，进线全来自主题框或左边的在右 1 列，从右边虚框来的比它晚一列。这样虚框挨着它连的那一头、线都往右走，少交叉
  const outside = [...new Set(edges.flatMap((e) => [e.from, e.to]).filter((id) => !inG(id)))]
  const isOut = new Set(outside)
  const parentOf = {}
  for (const e of edges) if (e.tree && isOut.has(e.from) && isOut.has(e.to) && e.from !== e.to) parentOf[e.to] ??= e.from
  // 别的上下文（含共享内核）的虚框，同一出处的也算一组：上下挨着放，不散到几列里去
  const uf = {}
  const find = (id) => (uf[id] && uf[id] !== id ? (uf[id] = find(uf[id])) : id)
  const join = (a, b) => { const x = find(a), y = find(b); if (x !== y) uf[y] = x }
  for (const [c, p] of Object.entries(parentOf)) join(p, c)
  const firstOf = {}
  for (const id of outside) if (byId[id].cx) { const k = byId[id].g; if (firstOf[k]) join(firstOf[k], id); else firstOf[k] = id }
  const parts = new Map()
  for (const id of outside) { const k = find(id); if (!parts.has(k)) parts.set(k, []); parts.get(k).push(id) }
  // 一组的成员：根在前，下层按层级往下；同一出处并起来的，按组里的线排先后（谁指向谁谁在上），没有先后的照原来的次序
  const members = {}, rootIdx = {}, groupRoots = []
  for (const ids of parts.values()) {
    let list
    if (ids.length > 1 && ids.some((id) => byId[id].cx)) {
      const inner = edges.filter((e) => e.from !== e.to && ids.includes(e.from) && ids.includes(e.to))
      const left = [...ids]
      list = []
      while (left.length) { const i = left.findIndex((id) => !inner.some((e) => e.to === id && left.includes(e.from))); list.push(...left.splice(Math.max(0, i), 1)) }
    } else {
      list = [ids.find((id) => !parentOf[id]) ?? ids[0]]
      for (let i = 0; i < list.length; i++) for (const e of edges) if (e.tree && e.from === list[i] && parentOf[e.to] === list[i] && !list.includes(e.to)) list.push(e.to)
      for (const id of ids) if (!list.includes(id)) list.push(id)
    }
    members[list[0]] = list; groupRoots.push(list[0])
    for (const id of list) rootIdx[id] = list[0]
  }
  const rootOf = (id) => rootIdx[id] ?? id
  const inner = (r, id) => isOut.has(id) && rootOf(id) === r
  const insOf = (r) => edges.filter((e) => members[r].includes(e.to) && !inner(r, e.from))
  const outsOf = (r) => edges.filter((e) => members[r].includes(e.from) && !inner(r, e.to))
  const side = {}, stubCol = {}
  for (const r of groupRoots) if (!insOf(r).length && outsOf(r).some((e) => inG(e.to))) { side[r] = 'L'; stubCol[r] = 1 }
  for (let grew = true; grew;) {
    grew = false
    for (const r of groupRoots) {
      if (side[r] || insOf(r).length) continue
      const outs = outsOf(r)
      if (outs.length && outs.every((e) => isOut.has(e.to) && side[rootOf(e.to)] === 'L')) { side[r] = 'L'; stubCol[r] = 1 + Math.max(...outs.map((e) => stubCol[rootOf(e.to)])); grew = true }
    }
  }
  const rightRoots = groupRoots.filter((r) => !side[r])
  for (const r of rightRoots) { side[r] = 'R'; stubCol[r] = 1 }
  for (let k = 0; k < rightRoots.length; k++) for (const r of rightRoots) {
    const from = insOf(r).filter((e) => isOut.has(e.from) && side[rootOf(e.from)] === 'R').map((e) => stubCol[rootOf(e.from)])
    stubCol[r] = Math.min(rightRoots.length, Math.max(1, ...from.map((c) => c + 1)))
  }
  const sideCols = (sd) => { const out = []; for (const r of groupRoots) if (side[r] === sd) (out[stubCol[r] - 1] ??= []).push(r); return out.map((c) => c ?? []) }
  const leftCols = sideCols('L'), rightCols = sideCols('R')
  const leftIds = outside.filter((id) => side[rootOf(id)] === 'L'), rightIds = outside.filter((id) => side[rootOf(id)] === 'R')

  // 四、摆：左虚框几列 | 树块、各层像文字一样从左往右放，主区宽度放不下才折到下一行接着 | 右边的虚框几列贴着主题框右边。画布比主区宽就整张缩
  const avail = opts.avail ?? availW() - (selected ? 316 : 0)
  // 右边虚框列与列之间：线多（超过两条）就放宽，线上的小卡才骑得上去，不被挤到远处
  const colOf = {}
  rightCols.forEach((rs, i) => rs.forEach((r) => members[r].forEach((id) => { colOf[id] = i + 1 })))
  const extraGap = rightCols.map((_, i) => i === 0 ? 0 : Math.min(200, Math.max(0, edges.filter((e) => !e.tree && [colOf[e.from], colOf[e.to]].sort().join() === [i, i + 1].join()).length - 2) * 30))
  const rightOff = (c) => (c - 1) * (W + GAP) + extraGap.slice(0, c).reduce((a, b) => a + b, 0)
  const leftW = leftCols.length * (W + GAP), rightW = rightCols.length * (W + GAP) + extraGap.reduce((a, b) => a + b, 0)
  const innerAvail = Math.max(W, avail - leftW - rightW - 98)
  const items = []
  if (rows.length) items.push({ kind: 'tree', w: treeW, rows })
  cols.forEach((ids) => items.push({ kind: 'col', ids: [...ids], w: W }))
  // 一行放几块：宽度放得下的前提下，块数开方取整（4 块排 2×2、5–9 块排 3 列），主题框近方形
  const perBand = Math.max(1, Math.ceil(Math.sqrt(items.length)))
  let cx = 0, band = 0, inBand = 0
  items.forEach((it, i) => {
    if (cx > 0 && (cx + it.w > innerAvail || inBand >= perBand)) { cx = 0; band++; inBand = 0 }
    inBand++
    it.x = cx; it.band = band; it.k = i + 1

  // 行号：一列里的节点落在离它连着的那些框最近的那一行，占了就往下挤；虚框也一样按它指着的框对齐

  items.forEach((it) => { if (it.kind === 'col') it.ids.forEach((id, i) => { row[id] = i }) })
  for (const colRoots of [...leftCols, ...rightCols]) { let i = 0; for (const r of colRoots) for (const id of members[r]) row[id] = i++ }
  const bandTop = [], bandH = []
  let frame = null
  const layout = () => {
    let y = Y0
    for (let b = 0; b < nBands; b++) {
      const its = items.filter((it) => it.band === b)
      const h = Math.max(H, ...its.map((it) => it.kind === 'tree' ? treeH : (Math.max(...it.ids.map((id) => row[id])) + 1) * ROW - (ROW - H)))
      bandTop[b] = y; bandH[b] = h; y += h + BAND_GAP
    }
    for (const it of items) {
      if (it.kind === 'tree') it.rows.forEach((r, l) => { const rw = r.length * (W + 40) - 40, x0 = X_IN + it.x + (it.w - rw) / 2; r.forEach((id, i) => place(id, x0 + i * (W + 40), bandTop[it.band] + l * TROW, it.k, it.band, false)) })
      // nudge：人手指定的上下挪动（像素数）；写成文字的 nudge 是备注，不参与排
      else it.ids.forEach((id) => place(id, X_IN + it.x, bandTop[it.band] + row[id] * ROW + (typeof byId[id].nudge === 'number' ? byId[id].nudge : 0), it.k, it.band, false))
    }
    const own = mine.map((n) => pos[n.id]).filter(Boolean)
    const bx1 = Math.min(...own.map((p) => p.x)), by1 = Math.min(...own.map((p) => p.y)), bx2 = Math.max(...own.map((p) => p.x + p.w)), by2 = Math.max(...own.map((p) => p.y + p.h))
    // 主题框只包住自己的数据：左右留 44，顶上留 120（主题名、角色标签、线上的卡都在框里），底下留 110
    frame = { x: bx1 - 44, y: by1 - 120, w: bx2 - bx1 + 88, h: by2 - by1 + 230 }
    // 虚框的每一列：照排好的先后一个挨一个，整列上下居中、对着主题框的正中
    const mid = frame.y + frame.h / 2, stubY = {}
    for (const colRoots of [...leftCols, ...rightCols]) {
      const ids = colRoots.flatMap((r) => members[r]).sort((a, b) => row[a] - row[b])
      ids.forEach((id, i) => { stubY[id] = mid - ((ids.length - 1) * ROW + 40) / 2 + i * ROW })
    }
    // 左边第 1 列贴着主题框，越往外列号越大；k 照从左到右的顺序
    leftIds.forEach((id) => { const c = stubCol[rootOf(id)]; place(id, 40 + (leftCols.length - c) * (W + GAP), stubY[id], -c, null, true) })
    rightIds.forEach((id) => { const c = stubCol[rootOf(id)]; place(id, frame.x + frame.w + GAP + rightOff(c), stubY[id], items.length + c, null, true) })
  }
  // 重心法：一列里按连着的对端的平均高度排，来回扫几遍，交叉就少了
  const cy = (id) => (pos[id] ? pos[id].y + pos[id].h / 2 : null)
  const bary = (id) => { const ys = edges.filter((e) => e.from === id || e.to === id).map((e) => cy(e.from === id ? e.to : e.from)).filter((v) => v != null); return ys.length ? ys.reduce((a, b) => a + b, 0) / ys.length : null }
  // 自己的列从本行顶上排起（行号减到从 0 起）；虚框那一列的行号是整张图的，不减，这样它就跟它指着的框对齐
  const assignRows = (ids, base, global) => {
    if (!ids.length) return
    const want = ids.map((id) => { const b = bary(id); return { id, r: b == null ? row[id] : (b - base) / ROW } }).sort((p, q) => p.r - q.r || (byId[p.id].order ?? 0) - (byId[q.id].order ?? 0))
    let last = -1
    // 挨着的两个最多空一行（虚框那一列最多空两行），别为了对齐把一列拉得老长
    for (const w of want) { const r = Math.min(Math.max(last + 1, Math.round(w.r)), last + (global ? 3 : 2)); row[w.id] = r; last = r }
    if (global) return
    const min = Math.min(...want.map((w) => row[w.id]))
    for (const w of want) row[w.id] -= min
  }
  // 虚框的一列：一组一组按重心排（组的重心是组里各框连到组外的平均高度），组里的框挨着往下排；行号是整张图的，跟它连着的框对齐
  const assignStubRows = (colRoots, base) => {
    const want = colRoots.map((r) => {
      const ys = edges.filter((e) => members[r].includes(e.from) !== members[r].includes(e.to)).map((e) => cy(members[r].includes(e.from) ? e.to : e.from)).filter((v) => v != null)
      return { r, at: ys.length ? (ys.reduce((a, b) => a + b, 0) / ys.length - base) / ROW : row[r] }
    }).sort((p, q) => p.at - q.at)
    let last = -1
    for (const w of want) {
      // 第一组直接对齐到它连着的框；后面的挨着前一组，最多空两行，别为了对齐把一列拉得老长
      const n = members[w.r].length, want0 = Math.max(last + 1, Math.round(w.at - (n - 1) / 2)), start = last < 0 ? want0 : Math.min(want0, last + 3)
      members[w.r].forEach((id, i) => { row[id] = start + i })
      last = start + n - 1
    }
  }
  // 树的一层里谁左谁右：按它连着的框（别的层、虚框、别的列）的平均横坐标排，连着左边的放左边，线就不用横穿同一层的别的框
  const cxOf = (id) => (pos[id] ? pos[id].x + pos[id].w / 2 : null)
  const orderTreeRows = () => rows.forEach((r) => {
    const at = new Map(r.map((id, i) => { const xs = edges.filter((e) => e.from === id || e.to === id).map((e) => (e.from === id ? e.to : e.from)).filter((o) => !r.includes(o)).map(cxOf).filter((v) => v != null)
      return [id, { i, x: xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null }] }))
    const keep = r.map((id) => at.get(id).x ?? cxOf(id))
    r.sort((p, q) => (at.get(p).x ?? keep[at.get(p).i]) - (at.get(q).x ?? keep[at.get(q).i]) || at.get(p).i - at.get(q).i)
  })
  layout()
  const colItems = items.filter((it) => it.kind === 'col')
  for (let pass = 0; pass < 3; pass++) {
    const order = pass % 2 ? [...colItems].reverse() : colItems
    if (rows.length) { orderTreeRows(); layout() }
    for (const it of order) { assignRows(it.ids, bandTop[it.band] + H / 2); layout() }
    for (const colRoots of [...leftCols, ...rightCols]) { assignStubRows(colRoots, Y0 + H / 2); layout() }
  }
  // 框的正下方、正上方有没有别的自己的框（折行的线想从底边出、顶边进时要看）
  const clearBelow = (p) => !mine.some((n) => { const q = pos[n.id]; return q !== p && q.y > p.y && q.x < p.x + p.w && q.x + q.w > p.x })
  const clearAbove = (p) => !mine.some((n) => { const q = pos[n.id]; return q !== p && q.y < p.y && q.x < p.x + p.w && q.x + q.w > p.x })

  // 几条线汇到同一个框、或从同一个框分出去，端点在框的边上错开：按对面那头的高低，从上到下占这条边上的位置
  const inTo = {}
  for (const e of edges) (inTo[e.to] ??= []).push(e)
  for (const list of Object.values(inTo)) list.sort((a, b) => pos[a.from].y - pos[b.from].y)
  const fwd = (e) => { const a = pos[e.from], b = pos[e.to]; return a.band != null && b.band != null && a.band !== b.band ? b.band > a.band : b.x > a.x }
  const sideOf = (e, id) => (e.from === id ? (fwd(e) ? 'r' : 'l') : (fwd(e) ? 'l' : 'r'))
  const farY = (e, id) => pos[e.from === id ? e.to : e.from].y
  const onSide = {}
  const stubColumn = (e) => !inG(e.from) && !inG(e.to) && Math.abs(pos[e.from].x - pos[e.to].x) < 1
  for (const e of edges) if (!e.tree && !stubColumn(e)) for (const id of [e.from, e.to]) (onSide[id + sideOf(e, id)] ??= []).push(e)
  for (const [key, list] of Object.entries(onSide)) list.sort((a, b) => farY(a, key.slice(0, -1)) - farY(b, key.slice(0, -1)))
  const slot = (e, id, p) => { const list = onSide[id + sideOf(e, id)]; return list?.length > 1 ? p.y + p.h * (list.indexOf(e) + 1) / (list.length + 1) : p.y + p.h / 2 }
  /** 折线：d 是路径，at(t) 按长度取线上的点 */
  const poly = (pts) => {
    const segs = []; let L = 0
    for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); segs.push({ a: pts[i - 1], b: pts[i], l }); L += l }
    return { d: 'M ' + pts.map((p) => `${p.x} ${p.y}`).join(' L '), at: (t) => { let d = t * L; for (const s of segs) { if (d <= s.l || s === segs[segs.length - 1]) { const u = s.l ? Math.min(1, d / s.l) : 0; return { x: s.a.x + (s.b.x - s.a.x) * u, y: s.a.y + (s.b.y - s.a.y) * u } } d -= s.l } return pts[pts.length - 1] } }
  }
  /** 曲线：照着折线的几个拐点走，每个拐角换成一段弯（从前一段的中点弯到后一段的中点），头尾两小段直着进出框；
   *  两个点的直线微微弯一点。弯在折线的拐角里面，不会比折线绕得更远。at(t) 照弯好的线取点 */
  const smooth = (pts0) => {
    const pts = pts0.filter((p, i) => i === 0 || Math.hypot(p.x - pts0[i - 1].x, p.y - pts0[i - 1].y) > 0.5)
    const f = (v) => +v.toFixed(1), samples = [pts[0]]

    if (pts.length < 3) {
      const a = pts[0], b = pts[pts.length - 1], len = Math.hypot(b.x - a.x, b.y - a.y) || 1, bend = Math.min(14, len * 0.12)
      const c = { x: (a.x + b.x) / 2 - (b.y - a.y) / len * bend, y: (a.y + b.y) / 2 + (b.x - a.x) / len * bend }
      quad(a, c, b)
      return { d: `M ${f(a.x)} ${f(a.y)} Q ${f(c.x)} ${f(c.y)}, ${f(b.x)} ${f(b.y)}`, at: poly(samples).at }
    }
    const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 })
    let m0 = mid(pts[0], pts[1]), d = `M ${f(pts[0].x)} ${f(pts[0].y)} L ${f(m0.x)} ${f(m0.y)}`
    samples.push(m0)
    for (let i = 1; i < pts.length - 1; i++) {
      const m1 = mid(pts[i], pts[i + 1])
      d += ` Q ${f(pts[i].x)} ${f(pts[i].y)}, ${f(m1.x)} ${f(m1.y)}`
      quad(m0, pts[i], m1); m0 = m1
    }
    const end = pts[pts.length - 1]
    d += ` L ${f(end.x)} ${f(end.y)}`
    samples.push(end)
    return { d, at: poly(samples).at }
  }
  let s = MARK
  s += `<g class="grp"><rect x="${frame.x}" y="${frame.y}" width="${frame.w}" height="${frame.h}" rx="12" style="${tint(g)};fill-opacity:.45"/><text x="${frame.x + 14}" y="${frame.y + 20}">${esc(g.title)}</text></g>`
  // 小卡要绕开的：所有数据框、虚框，和数据框上方那一排角色标签
  const taken = mine.map((n) => pos[n.id]).concat(outside.map((id) => pos[id])).map((p) => ({ x: p.x, y: p.y, w: p.w, h: p.h, hard: true }))
  for (const n of mine) if (n.by?.length) taken.push({ x: pos[n.id].x, y: pos[n.id].y - 28, w: W, h: 28, hard: true })
  taken.push({ x: frame.x, y: frame.y, w: textW(g.title) * 13 / 12 + 28, h: 30, hard: true })   // 主题框左上角写名字的地方：字，不许盖
  // 主题框的四条边各算一条窄带：卡不许压在框边上（要么整张在框里，要么整张在框外）
  taken.push({ x: frame.x, y: frame.y - 2, w: frame.w, h: 4 }, { x: frame.x, y: frame.y + frame.h - 2, w: frame.w, h: 4 }, { x: frame.x - 2, y: frame.y, w: 4, h: frame.h }, { x: frame.x + frame.w - 2, y: frame.y, w: 4, h: frame.h })
  let labels = ''
  const geo = [], laneUse = {}, gapUse = {}
  // 一条线隔着别的列：走行与行之间的空当（目标那一行的上方，目标在上面就走它下方），几条走同一条空当的错开 12
  const useLane = (y0) => { const key = Math.round(y0 / 10); laneUse[key] = (laneUse[key] ?? 0) + 1; return y0 - (laneUse[key] - 1) * 12 }
  const skipped = (a, b) => { // a 在 b 左边；中间隔着自己的列没有
    const bd = a.band ?? b.band; if (bd == null) return false
    return items.some((it) => it.band === bd && it.k > a.k && it.k < b.k)
  }
  // 线不许穿过两端以外的框：取线上的点，落进别的框（往里缩 3）就算穿了一个
  const idOfPos = new Map(Object.entries(pos).map(([id, p]) => [p, id]))
  const hitsOf = (cv, a, b) => Object.values(pos).filter((q) => q !== a && q !== b).filter((q) => { for (let t = 0; t <= 1.0001; t += 0.01) { const p = cv.at(t); if (p.x > q.x + 3 && p.x < q.x + q.w - 3 && p.y > q.y + 3 && p.y < q.y + q.h - 3) return true } return false }).length
  const lenOf = (pts) => pts.slice(1).reduce((t, p, i) => t + Math.abs(p.x - pts[i].x) + Math.abs(p.y - pts[i].y), 0)

    } else {

    if (n0) { const alt = e.tree ? treeDetour(a, b) : detour(a, b, slot(e, e.from, a), slot(e, e.to, b)); if (alt && alt.n < n0) { cv = alt.cv; d = cv.d } }

    s += `<g class="nd${n.id === ('sel' in opts ? opts.sel : selected) ? ' sel' : ''}" data-n="${n.id}"><rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="3"/>

      <text x="${p.x + W / 2}" y="${p.y + 17}" text-anchor="middle">${esc(n.title)}</text><text class="sub" x="${p.x + W / 2}" y="${p.y + 32}" text-anchor="middle">${esc(from.text)} ›</text></g>`

/** 数据名 → 它在哪个主题（照这个上下文各份概念图，分了子主题的也算主题的） */
function dataTopics() {
  const m = {}
  for (const [k, c] of Object.entries(CONCEPTS)) for (const n of c.concepts ?? []) m[n.title] ??= c.topic ?? k.split('/')[0]
  return m
}
/** 一份流程碰到的主题：这一份讲的主题在前，再是数据卡用到的别的主题 */
function flowTopics(f) {
  const DT = dataTopics(), ids = [f.topic, ...(f.steps ?? []).flatMap((p) => (p.data ?? []).map((d) => DT[d]))]

}
function drawFlow(st) {

  // 右边那一列框的宽度：按最长的一句自适应，280 起、最宽 360，再长就折行；单子里每条左边一列编号、右边一个标记，宽度里算上
  // 答过的问题不画（再有问题再问）；答过的规则当定了的画
  const asksOf = (p) => (p.asks ?? []).filter((a) => !a.answer)
  const qa = st.steps.flatMap((p) => [...(p.rules ?? []).map((r) => r.text), ...asksOf(p).map((a) => a.q), ...(p.rules ?? []).flatMap((r) => r.options ?? []), ...asksOf(p).flatMap((a) => a.options ?? [])])
  const NOTE_W = Math.max(280, Math.min(360, ...qa.length ? [Math.max(...qa.map((t) => tw(t, 12) + 96))] : []))
  const idx = (id) => st.parties.findIndex((p) => p.id === id)
  // 各方的名牌按字宽算；泳道间距先按最宽的名牌放宽（LANE 在下面算）
  const headW = Math.max(140, ...st.parties.map((p) => Math.max(tw(p.title, 13), tw(p.sub, 11)) + 28))
  const selfLines = (p) => wrapW(p.title, 220, 13)
  const selfW = (p) => Math.max(...selfLines(p).map((l) => tw(l, 13))) + 24
  // 数据卡前面写它在哪个主题、照主题上色；概念图里找不到的照旧绿卡
  const DT = dataTopics(), cardTopic = (d) => (DT[d] && grpOf[DT[d]]) || null
  const cardW = (d) => { const t = cardTopic(d); return tw(d, 11) + 14 + (t ? tw(t.title, 10) + 8 : 0) }
  // 第一条泳道左边要放得下「自己对自己」的框和它左边堆的数据卡；最后一条右边要放得下框和框底下的期限，再放说明卡

  const leftNeed = Math.max(headW / 2 + 10, ...selfAt(0).map((p) => Math.max(selfW(p) / 2 + 8 + Math.max(0, ...(p.data ?? []).map(cardW)) + 10, tw(p.due, 11) / 2 + 24)))

      const x = lx(a), lines = selfLines(p), w = selfW(p), h = lines.length * 18 + 12
