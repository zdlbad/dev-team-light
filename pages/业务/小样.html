      data.forEach((d, i) => { s += card(d, dir > 0 ? x2 - 10 - cardW(d) : x2 + 10, ty + 2 + i * 24) })
      bottom = data.length ? ty + 2 + data.length * 24 - 6 : ty
      lineEnd = Math.max(x1, x2) + 8
    }
    // 入口、出口卡：最左边一列，跟这一步一样高；虚线带箭头，入口指向这一步的起头，出口从这一步的起头指向卡
    const mine = ends.filter((x) => String(x.step) === String(p.id))
    if (mine.length) {
      const sx = a === b ? lx(a) - selfW(p) / 2 - 4 : Math.min(lx(a), lx(b)) - 4
      let top = y - 16
      for (const x of mine) {
        const c = endCard(x, top), cy = top + c.h / 2
        s += c.svg + (x.kind === 'in' ? `<path class="elead" d="M ${10 + END_W} ${cy} L ${sx} ${y}" marker-end="url(#a)"/>` : `<path class="elead" d="M ${sx} ${y} L ${10 + END_W + 3} ${cy}" marker-end="url(#a)"/>`)
        top += c.h + 6
      }
      bottom = Math.max(bottom, top - 6)
    }
    // 右边一步一个框：说明、规则、问题列成一张单子，一条虚线带箭头指回这一步那条横线；框多高这一步就占多高，下一步从它底下开始
    if (p.note || p.rules?.length || asksOf(p).length) {
      const c = sideBox({ p, asks: asksOf(p), flow: st.file, x: noteX, top: y - 12, w: NOTE_W, lineEnd, y })
      s += c.svg; bottom = Math.max(bottom, y - 12 + c.h)
    }
    lastBottom = bottom
    y = bottom + STEP_GAP + 25      // 下一步的箭头线：留出它标题的第一行
  }
  if (open) closeFrame(lastBottom)
  const height = y - STEP_GAP - 25 + 24
  // 各方的名牌单独一排 html，sticky 贴在主区顶上，往下滚也看得见是谁；横坐标和下面 svg 的泳道对齐。生命线在 svg 里照常跟着内容滚
  const heads = st.parties.map((p, i) => `<div class="hd${p.sub ? '' : ' one'}" style="left:${lx(i) - headW / 2}px;width:${headW}px">${esc(p.title)}${p.sub ? `<small>${esc(p.sub)}</small>` : ''}</div>`).join('')
  const lives = st.parties.map((p, i) => `<line class="life" x1="${lx(i)}" y1="0" x2="${lx(i)}" y2="${height - 10}"/>`).join('')
  // 比主区宽就整张等比缩：svg 用 viewBox 缩，顶上钉住的名牌那一排用同一个比例缩，列位跟 svg 对齐
  const k = width > avail ? avail / width : 1
  s = fr + s
  if (k === 1) return `<div class="heads" style="width:${width}px">${heads}</div><svg width="${width}" height="${height - HEAD_H}" viewBox="0 ${HEAD_H} ${width} ${height - HEAD_H}">${MARK}<g class="flow">${lives}${s}</g></svg>`
  return `<div class="heads" style="width:${Math.floor(width * k)}px;height:${Math.ceil(50 * k)}px"><div class="hds" style="position:relative;width:${width}px;height:50px;transform:scale(${k.toFixed(4)});transform-origin:0 0">${heads}</div></div><svg width="${Math.floor(width * k)}" height="${Math.ceil((height - HEAD_H) * k)}" viewBox="0 ${HEAD_H} ${width} ${height - HEAD_H}">${MARK}<g class="flow">${lives}${s}</g></svg>`
}

// 右边框展开没有：人点过的记下来（内存里一份，localStorage 再记一份，读写不成就只在内存）；没点过的按有没有要答的。
// 记的时候连带当时有没有要答的：要答的从有变没有、从没有变有，记的就不作数，回到默认（要答的不藏，全定了就折）
const SIDE_KEY = 'dev-team-lite/业务/右边框'
const sideOpen = (() => { try { return JSON.parse(localStorage.getItem(SIDE_KEY) ?? '{}') ?? {} } catch { return {} } })()
const sideKey = (flow, step) => context + '/' + flow + '/' + step
function isSideOpen(flow, step, pend) { const v = sideOpen[sideKey(flow, step)]; return v && v.pend === pend ? v.open : pend }
/** 点框的标题：展开的折起来、折着的展开，记下来、重画 */
function toggleSide(d) {
  sideOpen[sideKey(d.flow, d.step)] = { open: d.open !== '1', pend: d.pend === '1' }
  try { localStorage.setItem(SIDE_KEY, JSON.stringify(sideOpen)) } catch {}
  render()
}

/** 一步右边的一个框：标题一行「▾ 说明 · 规则 n 条 · 待定 k · 问 m」，点它展开、折叠；展开是一张单子：说明在最上（便签底色），
 *  规则一条一行（左边编号小字、右边「定了」「待定」），问题一条一行（右边「问」）。来源、谁在哪一屏问的小字跟在那条底下；
 *  待定的、没答的再列偏向和一排按钮（options 各一个，第一个加粗是偏向；「另说」自己输）。只有说明的不折、没有标题。
 *  框顶边在 top，虚线从框左边标题那一行指到这一步那条横线的右端。返回 svg 和框高 */
function sideBox({ p, asks, flow, x, top, w, lineEnd, y }) {
  const rules = p.rules ?? [], step = p.id
  const openRule = (r) => r.status !== '定了' && !r.answer
  const nPend = rules.filter(openRule).length, pend = nPend + asks.length > 0
  const list = rules.length + asks.length > 0
  const open = !list || isSideOpen(flow, step, pend)
  const HEAD = list ? 26 : 0
  const small = (t, wd) => wrapW(t, wd, 11)
  let cur = top + HEAD, body = ''
  if (list && open) body += `<line class="sep" x1="${x + 6}" y1="${cur}" x2="${x + w - 6}" y2="${cur}"/>`
  // 说明：便签底色一块，在单子最上
  if (open && p.note) {
    const lines = wrapW(p.note, w - (list ? 32 : 20), 12), nx = list ? x + 6 : x, nw = list ? w - 12 : w, ny = list ? cur + 6 : cur, nh = lines.length * 17 + 12
    body += `<g class="note"><rect x="${nx}" y="${ny}" width="${nw}" height="${nh}"/>${lines.map((l, k) => `<text x="${nx + 10}" y="${ny + 18 + k * 17}">${esc(l)}</text>`).join('')}</g>`
    cur = ny + nh + (list ? 2 : 0)
  }
  if (list && open) {
    const items = [...rules.map((r) => ({ kind: 'rule', item: r, open: openRule(r) })), ...asks.map((q) => ({ kind: 'ask', item: q, open: true }))]
    const idW = Math.max(26, ...items.map((t) => textW(String(t.item.id)) * 10.5 / 12)) + 12, MK = 34
    const tx = x + 10 + idW, colW = x + w - 10 - tx
    items.forEach(({ kind, item, open: o }, n) => {
      if (n > 0 || p.note) body += `<line class="sep" x1="${x + 10}" y1="${cur + 3}" x2="${x + w - 10}" y2="${cur + 3}"/>`
      const it0 = cur + 6, rule = kind === 'rule'
      const rows = wrapW(rule ? item.text : item.q, colW - MK, 12).map((l) => ({ l, cls: '', lh: 17 }))
      // 别的角色在界面上问的（by 谁问、screen 哪一屏）：小字标「UI 设计问 · N-01 屏名」，点它去界面页那一屏
      if (!rule && (item.by || item.screen)) {
        const sc = item.screen ? screenOf(item.screen) : null
        const text = [item.by ? item.by + '问' : '', sc ? sc.label : ''].filter(Boolean).join(' · ')
        rows.push(...small(text, colW).map((l) => ({ l, cls: 's', lh: 15, href: sc?.href, by: true })))
      }
      if (item.source) rows.push(...small('来源：' + item.source, colW).map((l) => ({ l, cls: 's', lh: 15 })))
      if (o && item.lean) rows.push(...wrapW('偏向：' + item.lean, colW, 12).map((l) => ({ l, cls: '', lh: 17 })))
      let h = 0, txt = ''
      for (const r of rows) {
        h += r.lh
        const t = `<text class="${r.cls}${r.by ? ' by' : ''}" x="${tx}" y="${it0 + h - 4}">${esc(r.l)}</text>`
        txt += r.href ? `<a class="scr" href="${esc(r.href)}">${t}</a>` : t
      }
      const mk = rule ? (o ? '待定' : '定了') : '问'
      let btns = '', end = it0 + h
      // 按钮：短的几个排一排，长的一个占一整行、字在按钮里折行，不会被框裁掉
      if (o) {
        const opts = [...(item.options ?? []).map((t, i) => ({ t, b: i === 0 })), { t: '另说', other: true }]
        let bx = tx, by = it0 + h + 4, rowH = 0
        for (const op of opts) {
          const lines = wrapW(op.t, colW - 16, 11.5), bw = lines.length > 1 ? colW : Math.min(colW, Math.max(...lines.map((l) => textW(l) * 11.5 / 12)) + 16), bh = lines.length * 15 + 8
          if (bx > tx && bx + bw > tx + colW) { bx = tx; by += rowH + 6; rowH = 0 }
          btns += `<g class="btn${op.b ? ' b' : ''}" data-flow="${esc(flow)}" data-step="${esc(step)}" data-kind="${kind}" data-id="${esc(item.id)}"${op.other ? ' data-other="1"' : ` data-opt="${esc(op.t)}"`}><rect x="${bx}" y="${by}" width="${bw}" height="${bh}"/>${lines.map((l, i) => `<text x="${bx + 8}" y="${by + 15 + i * 15}">${esc(l)}</text>`).join('')}</g>`
          bx += bw + 6; rowH = Math.max(rowH, bh)
        }
        end = by + rowH
      }
      body += `<g class="it ${kind} ${o ? 'pending' : 'done'}" data-id="${esc(item.id)}"><text class="id" x="${x + 10}" y="${it0 + 13}">${esc(item.id)}</text><text class="mk" x="${x + w - 10}" y="${it0 + 13}" text-anchor="end">${mk}</text>${txt}${btns}</g>`
      cur = end + 4
    })
    cur += 4
  }
  const h = cur - top
  const sum = [p.note ? '说明' : '', rules.length ? `规则 ${rules.length} 条` : '', nPend ? `待定 ${nPend}` : '', asks.length ? `问 ${asks.length}` : ''].filter(Boolean).join(' · ')
  const head = list ? `<g class="tog" data-flow="${esc(flow)}" data-step="${esc(step)}" data-open="${open ? 1 : 0}" data-pend="${pend ? 1 : 0}"><rect x="${x}" y="${top}" width="${w}" height="${HEAD}"/><text class="h" x="${x + 10}" y="${top + 17}">${open ? '▾' : '▸'} ${esc(sum)}</text></g>` : ''
  const ly = list ? top + 13 : y
  const svg = `<g class="qa side ${list ? (open ? 'open' : 'shut') : 'only'} ${pend ? 'pending' : 'done'}" data-step="${esc(step)}"><path class="lead" d="M ${x} ${ly} L ${lineEnd} ${y}" marker-end="url(#la)"/>${list ? `<rect class="bg" x="${x}" y="${top}" width="${w}" height="${h}"/>` : ''}${head}${body}</g>`
  return { svg, h }
}
/** 问题挂在哪一屏：screen 是「<需求编号>/<屏 id>」。label 是「N-01 屏名」（屏名找不到就照 screen 原文）；
 *  href 指界面页那一屏：工作台里是 <项目>/界面#<上下文>/<需求编号>/<屏 id>，单开时指旁边界面那份小样 */
function screenOf(screen) {
  const hit = SCREENS[screen], i = screen.indexOf('/'), req = i > 0 ? screen.slice(0, i) : screen
  const label = hit?.title ? req + ' ' + hit.title : screen
  const hash = (hit?.context ?? context) + '/' + screen
  const href = DATA.WB ? `${DATA.WB.base ?? ''}/${encodeURIComponent('界面')}#${hash}` : `../界面/小样.html#${hash}`
  return { label, href }
}
/** 答一条待定的规则或问题：工作台上发给后端写进流程文件、重载；单开时只改内存里的那条、重画 */
function answerQa(d) {
  const text = d.other ? (typeof prompt === 'function' ? prompt('另说：') : '') : d.opt
  if (!text) return
  const st = FLOWS.find((f) => f.file === d.flow)?.steps.find((s) => String(s.id) === String(d.step))
  const item = (d.kind === 'rule' ? st?.rules : st?.asks)?.find((r) => r.id === d.id)
  // sig 是工作台给每条没答的规则和问题带出来的「这一版的记号」：页面开着的时候业务改过这一条，工作台不记、提示刷新
  if (LIVE) return post('答', { flow: d.flow, context, step: d.step, [d.kind]: d.id, text, sig: item?.sig })
  if (!item) return
  item.answer = text; item.answeredAt = new Date().toISOString()
  if (d.kind === 'rule') item.status = '定了'
  render()
}

// ---------- 业务（模块业务）：一个主题一页，从上到下五块，每块能收起；功能、响应、状态转换流程、核心数据、概念图、行为、服务都是点标签开一个窗口看 ----------
// 五块：业务概述、主要流程速览、第三块、第四块、待定。第三、四块，新写法的主题（模块文件写了 goals）是「业务目的及模型」「业务方案」，没写 goals 的主题是「核心数据和概念」「业务目的及方案」
// 地址：module/<主题>。旧地址 module/<主题>/功能/<第几组>/<功能号>、module/<主题>/响应/<号>（更早叫 内部流程）、module/<主题>/工作流程/<号> 进来时开对应的窗口一次，
// module/<主题>/待定 进来时替人把「待定」那一块展开一次；然后地址换成 module/<主题>，重画时不再弹出来
const marr = (t) => `<span class="marr"><i>${esc(t ?? '')}</i></span>`
const fromTo = (x) => (x.from || x.to ? `<div class="ft">${x.from ? esc(x.from) : '新记下'} → ${esc(x.to ?? '')}</div>` : '')
// 查看只写在功能的 subject.op 上（只是看、不改数据的功能）；核心数据的来路、去处上只有前三种
const OPS = { 创建: 'new', 更新: 'upd', 删除: 'del', 查看: 'view' }
const opTag = (op) => (OPS[op] ? `<u class="op ${OPS[op]}">${esc(op)}</u>` : '')
// 哪几块展开着、每块里看的是哪个页签、哪几条业务目的展开着：键都带「上下文/主题」，只记在内存里，默认都收着
const secOpen = {}, introTab = {}, tourTab = {}, purposeOpen = {}
// 「核心数据和概念」那一块里哪几个概念的栏展开着：键是「上下文/主题/概念名」，也只记在内存里，默认都收着
const fieldsOpen = {}
// 拆过的主题里，一样核心数据「一直要守的」那几条展开着的（默认收着）、「N 个行为」收起来的（默认展开）：键是「上下文/主题/核心数据名」
const keepsOpen = {}, actsShut = {}
// 新写法的主题（写了 goals）：「业务目的及模型」「业务方案」各看的是哪个页签，看的是第几张流程表、哪个角色；目的的树上人点过展开或收起的节点（没点过的只展开第一层）。
// 键都带「上下文/主题」，只记在内存里
const modelTab = {}, planTab = {}, flowTab = {}, roleTab = {}, goalOpen = {}
// 刚从别处跳过来、要显眼一下的那一个：{ goal: 目的号 } 或者 { step: 步骤号 }。主题页画过一遍就清掉，再重画不再闪
let flash = null
// 开着的窗口，靠后的在上面；一个窗口是什么样见下面「窗口」那一段
let wins = []
/** 一块里的图能用的宽：每块最宽 1400，减去块自己的边框和左右留白 */
const secW = () => Math.min(1400, availW() + 8) - 40
/** 窗口里的图能用的宽 */
const popW = () => Math.min(1400, (typeof innerWidth === 'number' && innerWidth ? innerWidth : 1280) - 48) - 64
const allFns = (m) => (m?.groups ?? []).flatMap((g) => g.functions ?? [])
const fnIndex = (m) => Object.fromEntries(allFns(m).map((f) => [f.id, f]))
/** 把地址换成 v，不重画、也不多留一条后退记录 */
function settle(v) {
  view = v
  const h = '#' + context + '/' + v
  if (typeof history !== 'undefined' && history.replaceState) history.replaceState(null, '', h); else location.hash = h
}
/** 全局图上面：整个上下文的背景，和每个主题的业务目的（从各主题的模块业务里取） */
function cxFrame() {
  // 一个主题的业务目的：写了 goals 的主题取目的的树的每个根的 aim，一个根一条；没写 goals 的主题取 purposes
  const aims = (m) => (isNew(m) ? m.goals.map((n) => n?.aim ?? '') : (m?.purposes ?? []).map((p) => p.text ?? ''))
  const any = MAP.topics.some((t) => aims(MODULES[t.id]).length)
  if (!MAP.background && !any) return ''
  const rows = MAP.topics.map((t) => { const ps = aims(MODULES[t.id]); return `<tr><td><a href="#module/${esc(t.id)}">${esc(t.title)}</a></td><td>${ps.length ? ps.map((p) => `<div>${esc(p)}</div>`).join('') : '<span class="none">业务目的还没写</span>'}</td></tr>` }).join('')
  return `<div class="fr">${MAP.background ? `<div class="fh">背景</div><div class="fbg">${esc(MAP.background)}</div>` : ''}<div class="fh${MAP.background ? ' gap' : ''}">每个主题的业务目的</div><table class="ftp">${rows}</table></div>`
}
/** 一个概念的栏：fields 的每一项是栏名，或者 { title, note?, ref?, topic? }，都换成对象 */
const fieldsOf = (n) => (Array.isArray(n?.fields) ? n.fields : []).map((x) => (typeof x === 'string' ? { title: x } : x)).filter((x) => x && typeof x.title === 'string' && x.title.trim())
/** 一栏指着的数据：蓝色小字「→ 数据名 · 主题名」，没写 topic 的只有数据名；没写 ref 的不出 */
const refTag = (f) => (f.ref ? `<span class="rf">→ ${esc(f.ref)}${f.topic ? ' · ' + esc(f.topic) : ''}</span>` : '')
/** 一个主题的概念和它们的上下层：照这个主题的概念图（分了子主题的是各子主题那几份）和业务文件算出来，主题页的几块和窗口都用它。
 *  概念靠名字对上：业务文件里核心数据、装着的概念、用到的资料的名字，和概念图上的名字一样 */
function topicInfo(id, m = MODULES[id] ?? {}) {
  const top = CONCEPTS[id], docs = !top ? [] : top.subs ? top.subs.map((x) => CONCEPTS[id + '/' + x.id]).filter(Boolean) : [top]
  const cores = (m.core ?? []).filter((c) => c?.title), coreNames = cores.map((c) => c.title)
  const uses = (m.uses ?? []).map((u) => (typeof u === 'string' ? { title: u } : u)).filter((u) => u?.title)
  // node：名字 → 概念图上这个主题自己的那个概念；kids：上下层的线，名字 → 它装着的几样；links：不是上下层的线，名字 → 连着的名字
  const node = {}, kids = {}, links = {}
  for (const d of docs) {
    const t = Object.fromEntries([...(d.concepts ?? []), ...(d.external ?? [])].map((n) => [n.id, n.title]))
    for (const n of d.concepts ?? []) node[n.title] ??= n
    for (const e of d.edges ?? []) {
      const a = t[e.from], b = t[e.to]
      if (!a || !b || a === b) continue
      if (e.tree) { if (!(kids[a] ??= []).includes(b)) kids[a].push(b) }
      else { (links[a] ??= new Set()).add(b); (links[b] ??= new Set()).add(a) }
    }
  }
  // 一样核心数据装着的概念：照上下层的线一层层往下，碰到另一样核心数据就停；parts 里写了、概念图上没连下来的，接在第一层
  const under = cores.map((c) => {
    const out = [], seen = new Set([c.title])
    const walk = (t, depth) => { for (const k of kids[t] ?? []) if (!seen.has(k) && !coreNames.includes(k)) { seen.add(k); out.push({ title: k, depth }); walk(k, depth + 1) } }
    walk(c.title, 1)
    for (const p of (c.parts ?? []).map((p) => (typeof p === 'string' ? p : p?.title)).filter(Boolean)) if (!seen.has(p)) { seen.add(p); out.push({ title: p, depth: 1 }) }
    return out
  })
  // 照先后和深浅套成一棵树，画类图那样的框用
  const nest = cores.map((c, i) => {
    const root = { title: c.title, kids: [] }, stack = [root]
    for (const x of under[i]) { const n = { title: x.title, kids: [] }; stack.length = x.depth; stack[x.depth - 1].kids.push(n); stack[x.depth] = n }
    return root
  })
  const ownerOf = {}      // 装着的概念 → 它在第几样核心数据里
  under.forEach((list, i) => list.forEach((x) => { ownerOf[x.title] ??= i }))
  // 一样核心数据用到的资料：概念图上和它、或者和它装着的概念连着线的那几样
  const useOf = cores.map((c, i) => uses.filter((u) => [c.title, ...under[i].map((x) => x.title)].some((t) => links[t]?.has(u.title))))
  const intro = Object.fromEntries((m.intro?.concepts ?? []).filter((c) => c?.title).map((c) => [c.title, c.note ?? '']))
  const first = (s) => { const t = String(s ?? ''), k = t.indexOf('。'); return k >= 0 ? t.slice(0, k + 1) : t }
  // 一句说明，先后取：业务概述里的概念说明、用到的资料的说明、概念定义的头一句

    const fs = t ? info.shown(t) : [], open = fs.length > 0 && !!fieldsOpen[key + '/' + t]
    return `<div class="cr" style="padding-left:${depth * 24}px">${lead ? `<i class="ld">${lead}</i>` : ''}${name}${tags}${fs.length ? `<span class="chip fc" data-fields="${esc(key + '/' + t)}">${fs.length} 栏 ${open ? '▾' : '▸'}</span>` : ''}${extra}<span class="nt">${esc(note ?? '')}</span></div>`
      + (open ? fs.map((f) => fieldRow(f, depth * 24 + (lead ? 82 : 0) + 24)).join('') : '') + below
  }
  // 拆过的主题里一样核心数据的规则和行为。列在顶层 concepts 里的概念也有这两样：c 给它在 concepts 里的那一项（没列的给不出，就什么都不出），depth 是它那一行缩进了几层
  const conOf = Object.fromEntries(ownCons(m).map((k) => [k.title, k]))
  const own = (c, depth = 0) => {
    if (!split || !c) return ['', '']
    const pad = (depth + 1) * 24, k = key + '/' + c.title, keeps = (c.keeps ?? []).map((x) => R[x]).filter(Boolean), acts = (c.actions ?? []).filter((a) => a?.id), kOpen = !!keepsOpen[k], aOpen = !actsShut[k]
    return [(keeps.length ? `<span class="chip fc" data-keeps="${esc(k)}">一直要守的 ${keeps.length} 条 ${kOpen ? '▾' : '▸'}</span>` : '') + (acts.length ? `<span class="chip fc" data-acts="${esc(k)}">${acts.length} 个行为 ${aOpen ? '▾' : '▸'}</span>` : ''),
      (kOpen ? keeps.map((r) => `<div class="kp" style="padding-left:${pad}px"><code>${esc(r.id)}</code><b>${esc(r.short ?? '')}</b><span class="nt">${esc(r.text ?? '')}</span></div>`).join('') : '')
      + (aOpen ? acts.map((a) => { const said = (a.out ?? []).filter((o) => o.kind === '事件').length, mv = moveOf(a)
        return `<div class="ar" style="padding-left:${pad}px"><span class="chip bh" data-pop="act:${esc(a.id)}">${esc(a.title ?? a.id)}</span>${mv ? `<span class="mv">${esc(mv)}</span>` : ''}<span class="cn">${(a.rules ?? []).length} 条规则</span>${said ? `<span class="cn">向外说 ${said} 件事</span>` : ''}</div>` }).join('') : '')]
  }
  const res = (u) => `<span class="chip res"${findConcept(id, u.title) ? ` data-pop="concept:${esc(u.title)}"` : ''}>${esc(u.title)}</span>`
  // 被对方记住ID：去处里带主题的，是别的主题的数据记着它的编号，由这里的功能让那边新建或改变；点了去那个主题。别的上下文的主题写成「主题名（上下文名）」
  const given = (t) => {
    const mm = String(t.topic).match(/^(.*)（(.+)）$/), cx = mm && BIZ[mm[2]] ? mm[2] : context, title = mm && BIZ[mm[2]] ? mm[1] : t.topic
    const tp = (BIZ[cx]?.MAP?.topics ?? []).find((x) => x.title === title), mod = tp && BIZ[cx]?.MODULES?.[tp.id]
    const href = tp ? '#' + (cx !== context ? cx + '/' : '') + (mod ? 'module/' : 'concepts/') + tp.id : cx !== context ? '#' + cx + '/map' : ''
    const def = tp && Object.entries(BIZ[cx]?.CONCEPTS ?? {}).filter(([k]) => k === tp.id || k.startsWith(tp.id + '/')).flatMap(([, d]) => d.concepts ?? []).find((n) => n.title === t.data)?.definition
    const note = (mod?.intro?.concepts ?? []).find((c) => c.title === t.data)?.note || (def ? String(def).split('。')[0] + '。' : '') || t.by

  }
  const groups = cores.map((c, i) => {
    const out = [...new Map((c.targets ?? []).filter((t) => t.topic).map((t) => [t.data + '\n' + t.topic, t])).values()], [chips, below] = own(c)
    return `<div class="cg">${row(0, '', `<span class="chip core" data-pop="core:${i}">${esc(c.title)}</span>`, wfTag(wfOf(c.title)) + `<span class="chip cm" data-pop="concept:${esc(c.title)}">概念图</span>`, noteOf(c.title) || c.why, c.title, chips, below)}`
      + under[i].map((x) => row(x.depth, '', `<span class="chip part" data-pop="core:${i}:${esc(x.title)}">${esc(x.title)}</span>`, wfTag(wfOf(x.title)), noteOf(x.title), x.title, ...own(conOf[x.title], x.depth))).join('')
      + useOf[i].map((u) => row(1, '记住对方ID', res(u), '', u.note, u.title)).join('') + out.map(given).join('') + '</div>'
  })
  const inCore = new Set([...info.coreNames, ...under.flat().map((x) => x.title)]), useNames = new Set(uses.map((u) => u.title))
  const looseUses = uses.filter((u) => !useOf.some((list) => list.includes(u)))
  const others = info.names.filter((t) => !inCore.has(t) && !useNames.has(t))
  const lostWfs = wfs.filter((w) => !info.names.includes(w.title))
  const tail = (title, rows) => (rows.length ? `<div class="cg"><div class="gl">${title}</div>${rows.join('')}</div>` : '')
  const html = groups.join('')
    + tail('用到的资料', looseUses.map((u) => row(0, '', res(u), '', u.note, u.title)))
    + tail('不归哪一样核心数据的', others.map((t) => row(0, '', `<span class="chip part"${findConcept(id, t) ? ` data-pop="concept:${esc(t)}"` : ''}>${esc(t)}</span>`, wfTag(wfOf(t)), noteOf(t), t, ...own(conOf[t]))))
    + tail('名字对不上概念的状态转换流程', lostWfs.map((w) => row(0, '', `<b class="wn">${esc(w.title ?? w.id)}</b>`, wfTag(w), w.note)))
  return html ? `<p class="tip">点名字看它装着什么、从哪里来到哪里去；带「状态转换」的点了看它的状态怎么走；点「N 栏」看它有哪几栏；「记住对方ID」是它记着别处一样东西的编号、只读那边的资料；「被对方记住ID」是别的主题的数据记着它的编号，由这里的功能让那边新建或改变。</p>${html}` : '<p class="none">核心数据还没写。</p>'
}
// 业务目的及方案：每条业务目的默认收着，标题行最前面是它的编号，右边写有几条更细的目的；展开后先一行对着背景哪一句和出处，再一张表，一行一条更细的目的：
// 左边是更细的目的的编号（目的自己带的 id，没写 id 的照先后数，都由 purposeNos 给；for 就照这个号指过来）、更细的目的和它的做法，右边是它落到的核心数据（实心）、别的数据（空心）、功能、响应、服务，都能点。
// 服务不写在更细的目的上：哪项服务的 for 指着这一条，就列在这一条的右边。行为和规则不列在这里。
// 更细的目的没写 source 的，旁边标「推出来的」；写了的，做法下面一行小字写出处
// 最下面三行提醒，有才出：没有目的落到它上面的核心数据、没挂到目的上的功能、没挂到目的上的响应
function purposesView(m, id, key, info) {
  const ps = m.purposes ?? [], fns = allFns(m), chains = m.chains ?? [], fnOf = fnIndex(m), chOf = Object.fromEntries(chains.map((c) => [c.id, c])), svcs = allSvcs(m)
  const data = (t) => dataChip(id, info, t)
  const fn = (k) => (fnOf[k] ? `<span class="chip fn" data-pop="fn:${esc(k)}">${esc(k)} ${esc(fnOf[k].title)}</span>` : '')
  const ch = (k) => (chOf[k] ? `<span class="chip ch" data-pop="chain:${esc(k)}">${esc(k)} ${esc(chOf[k].title)}</span>` : '')
  const sv = (s) => `<span class="chip sv" data-pop="svc:${esc(s.id)}">${esc(s.id)} ${esc(s.title ?? '')}</span>`
  const tags = (n) => [...(n.cores ?? []).map(data), ...(n.data ?? []).map(data), ...(n.fns ?? []).map(fn), ...(n.chains ?? []).map(ch), ...svcs.filter((s) => needAt(m, s.for)?.n === n).map(sv)].join('')
  const need = (n, no) => `<tr><td><i class="nn">${esc(no)}</i>${n.aim ? `<b>${esc(n.aim)}</b>${n.source ? '' : '<span class="guess">推出来的</span>'}${n.text ? `<div class="how"><i>做法</i>${esc(n.text)}</div>` : ''}${n.source ? `<div class="ns">出处：${esc(n.source)}</div>` : ''}` : esc(n.text ?? '')}</td><td><div class="tags">${tags(n)}</div></td></tr>`
  const one = ({ p, i, no, needs }) => {
    const open = !!purposeOpen[key + '/' + i]
    return `<div class="pu${open ? ' open' : ''}"><div class="pt" data-purpose="${i}" data-key="${esc(key)}"><span class="tri">${open ? '▾' : '▸'}</span><span class="no">${esc(no)}</span><span class="tx">${esc(p.text ?? '')}${p.source ? '' : '<span class="guess">推出来的，等你确认</span>'}</span><span class="cnt">${needs.length} 条更细的目的</span></div>`
      + (open ? `${p.from || p.source ? `<div class="pf">${p.from ? `背景里对着：${esc(p.from)}` : ''}${p.from && p.source ? '　' : ''}${p.source ? `出处：${esc(p.source)}` : ''}</div>` : ''}${needs.length ? `<table>${needs.map((x) => need(x.n, x.no)).join('')}</table>` : '<div class="pf">更细的目的还没写。</div>'}` : '') + '</div>'
  }
  const needs = ps.flatMap((p) => p.needs ?? [])
  const landed = new Set(needs.flatMap((n) => n.cores ?? [])), hungF = new Set(needs.flatMap((n) => n.fns ?? [])), hungC = new Set(needs.flatMap((n) => n.chains ?? []))
  const looseCores = info.cores.map((c, i) => [c, i]).filter(([c]) => !landed.has(c.title)), looseFns = fns.filter((f) => f.id && !hungF.has(f.id)), looseChains = chains.filter((c) => c.id && !hungC.has(c.id))
  // 业务目的还没写的主题：功能和响应照样列在下面，点得开
  return (ps.length ? `<div class="pa"><span>背景里藏着的要求，和每一条靠什么做法、哪样核心数据、哪项功能、哪条响应、哪项服务达到。</span><button data-purposes-all="1" data-key="${esc(key)}">全部展开</button><button data-purposes-all="0" data-key="${esc(key)}">全部收起</button></div>${purposeNos(m).map(one).join('')}` : '<p class="none">业务目的还没写。</p>')
    + (ps.length && looseCores.length ? `<div class="warn"><span>没有目的落到它上面的核心数据：</span>${looseCores.map(([c, i]) => `<span class="chip core" data-pop="core:${i}">${esc(c.title)}</span>`).join('')}<span>它是为了什么，见<a href="#module/${esc(id)}/待定">待定</a>。</span></div>` : '')
    + (looseFns.length ? `<div class="warn"><span>没有挂到哪一条目的上的功能：</span>${looseFns.map((f) => fn(f.id)).join('')}</div>` : '')
    + (looseChains.length ? `<div class="warn"><span>没有挂到哪一条目的上的响应：</span>${looseChains.map((c) => ch(c.id)).join('')}</div>` : '')
}

/** 一样数据的标签：核心数据实心，点了看它的看板；装在核心数据里的概念，点了看那样核心数据（那一格标黄）；别的概念，概念图上有的点了看概念图 */
function dataChip(id, info, t) {
  const i = info.coreNames.indexOf(t), o = info.ownerOf[t]
  if (i >= 0) return `<span class="chip core" data-pop="core:${i}">${esc(t)}</span>`
  return `<span class="chip part"${o != null ? ` data-pop="core:${o}:${esc(t)}"` : findConcept(id, t) ? ` data-pop="concept:${esc(t)}"` : ''}>${esc(t)}</span>`
}
// ---------- 新写法的主题（模块文件写了 goals）：第三块「业务目的及模型」、第四块「业务方案」 ----------
// 一个主题的业务分成两套，都从同一批目的出发：
// 业务目的及模型回答「业务模型怎样撑起这块业务要达到的目的」：目的的树（goals），核心数据、概念、它们的行为和规则、状态转换流程；最小的一块是核心数据（或者有自己状态的概念）的一个行为。
// 业务方案回答「人和系统怎样使用这个模型，把目的办成」：流程表（flows），各角色要办成的事（jobs），功能、响应、服务；最小的一块是功能、响应。
// 两套在「功能、响应叫了哪个行为」这里接上，怎么算见下面 goalsBy 那几个函数
const MODEL_TABS = [['tree', '业务目的拆解'], ['parts', '业务模型成员']], PLAN_TABS = [['flow', '流程视角'], ['role', '角色视角']]
/** 第三块「业务目的及模型」：两个页签。「业务目的拆解」是目的的树；「业务模型成员」是核心数据和概念那张单子 */
function modelView(m, id, key, info, hot) {
  const tab = modelTab[key] === 'parts' ? 'parts' : 'tree'
  return `<div class="ptabs">${MODEL_TABS.map(([k, t]) => `<button data-model-tab="${k}" data-key="${esc(key)}"${k === tab ? ' class="on"' : ''}>${t}</button>`).join('')}</div>`
    + (tab === 'tree' ? goalTree(m, key, hot) : coreList(m, id, info))
}
/** 业务目的拆解：整个主题一棵树，几个根就接着排。节点只有两种样子。
 *  到不了的（写了 parts）：一行是标签（根是「目的」，别的是「子目的」）加粗的目的，右边「N 个子目的」；展开以后下面一行「如何拆为子目的」，再下面是子节点，用折线连着。点这一行展开或收起，没点过的只展开第一层。
 *  到得了的（写了 way 或者 act）：标签加粗的目的；「途径」一行是一个小块：写了 act 的点了开那个行为的窗口，「外部调用-主题名-功能名」是虚线的小块、不能点，别的（留记录这类到处都在做的，写的是一句话）是灰色实线的小块、也不能点；
 *  「落点」「疑点」写了才出，落点写了几样的（用「；」隔开）一样一行。
 *  带 made 的那一句后面标「推出来的」；写了 source 的，鼠标停在这句目的上显示它。hot 是刚跳过来的那个节点的号，它那一行底色闪一下。
 *  一个节点写了途径、同时又写了 parts 的，两样都画：途径、落点、疑点那几行一直在，点它那一行展开的是「如何拆为子目的」和子节点。
 *  旧样子的树（见 oldTree）不画，只说一句要重做 */
function goalTree(m, key, hot) {
  const roots = (m.goals ?? []).filter((n) => n && typeof n === 'object')
  if (oldTree(m)) return '<p class="none">目的的树是旧的样子，要重做。</p>'
  if (!roots.length) return '<p class="none">目的的树还没写。</p>'
  const acts = Object.fromEntries(allActs(m).map((y) => [y.a.id, y]))
  const head = (n, depth) => `<i class="gk${depth ? '' : ' root'}">${depth ? '子目的' : '目的'}</i><b${n.source ? ` title="${esc('根据：' + n.source)}"` : ''}>${esc(n.aim ?? '')}</b>${n.made ? '<span class="guess">推出来的</span>' : ''}`
  const way = (n) => (!n.way ? '<span class="none">还没写途径</span>'
    : n.act ? (acts[n.act] ? `<span class="chip bh" data-pop="act:${esc(n.act)}">${esc(n.way)}</span>` : `<span class="chip nf">${esc(n.way)}：业务文件里没有行为 ${esc(n.act)}</span>`)

    if (!hasParts(n)) return `<div class="gd leaf${hi}" data-goal-node="${esc(n.id ?? '')}"><div class="gh"><span class="tri"></span>${head(n, depth)}</div>${own}</div>`
    const k = key + '/' + n.id, open = goalOpen[k] ?? depth === 0
    return `<div class="gd${open ? ' open' : ''}${hi}" data-goal-node="${esc(n.id ?? '')}"><div class="gh" data-goal-fold="${esc(k)}" data-open="${open ? 1 : 0}"><span class="tri">${open ? '▾' : '▸'}</span>${head(n, depth)}<span class="cnt">${n.parts.length} 个子目的</span></div>${reached(n) ? own : ''}`
      + (open ? `${line('如何拆为子目的', `<span>${esc(n.plan ?? '')}</span>`)}<div class="gs">${n.parts.filter((c) => c && typeof c === 'object').map((c) => node(c, depth + 1)).join('')}</div>` : '') + '</div>'
  }
  return `<div class="gt"><p class="lg">一个 <i class="gk root">目的</i> 直接到不了的，拆成几个 <i class="gk">子目的</i> 去到，<i class="gq">如何拆为子目的</i> 说明是怎么拆的；到得了的，写 <i class="gq">途径</i>：哪样核心数据（或者有自己状态的概念）的哪个行为，点了看它的图解，虚线的小块是交给别的主题办的、不能点；数据承载了这个目的的，再写 <i class="gq">落点</i>。带「推出来的」的一句不是照原话，是归出来的。这棵树对着模型这一层，功能、响应不在里面，在「业务方案」的流程视角、角色视角里看。点带 ▸ 的一行展开或收起。</p>${roots.map((n) => node(n, 0)).join('')}</div>`
}
/** 第四块「业务方案」：两个页签，流程视角、角色视角。hot 是刚跳过来的那一步的号 */
function planView(m, id, key, info, hot) {
  const tab = planTab[key] === 'role' ? 'role' : 'flow'
  return `<div class="ptabs">${PLAN_TABS.map(([k, t]) => `<button data-plan-tab="${k}" data-key="${esc(key)}"${k === tab ? ' class="on"' : ''}>${t}</button>`).join('')}</div>`
    + (tab === 'flow' ? flowsView(m, key) : rolesView(m, id, key, info, hot))

/** 流程视角：一张流程表装一条主要的业务目的；有两张以上就再分一排页签「1 标题」「2 标题」，一次看一张。
 *  表头两行：业务目的；业务流程的名字和为什么排成这一张。一段一行：左边是序号加段名，下面小字是这一段里的状态；右边先是说明，下面是这一段的步骤。
 *  步骤是一个个小块「角色 · 步骤标题」，箭头连着，点了到角色视角看这一步；写了 roads 的一段，几条路一条一行、前面是路名；anytime（随时可能发生的一段）排在最后单独一行。
 *  流程视角只画路线，不列功能 */
function flowsView(m, key) {
  const flows = (m.flows ?? []).filter((f) => f && typeof f === 'object')
  if (!flows.length) return '<p class="none">流程表还没写。</p>'
  const fi = Math.min(flows.length - 1, Math.max(0, flowTab[key] ?? 0)), f = flows[fi], stepOf = Object.fromEntries(allSteps(m).map((x) => [x.s.id, x]))
  const block = (k) => { const x = stepOf[k]; return x ? `<span class="fp${x.s.side ? ' sys' : ''}${x.s.again ? ' again' : ''}" data-jstep="${esc(k)}">${esc(stepName(x))}</span>` : `<span class="fp miss">${esc(k)}：各角色要办成的事里没有这一步</span>` }
  const run = (parts) => (parts ?? []).map(block).join('<i class="fa">→</i>')
  const body = (st) => (st.note ? `<div>${esc(st.note)}</div>` : '')
    + ((st.roads ?? []).length ? st.roads.map((r) => `<div class="frd"><i class="rn">${esc(r.title ?? '')}</i><div class="frn">${run(r.parts)}</div></div>`).join('') : `<div class="frn">${run(st.parts)}</div>`)

  const c = { ...doc, concepts: (doc.concepts ?? []).filter((x) => keep.has(x.id)), external: (doc.external ?? []).filter((x) => keep.has(x.id)), edges }
  const t = grpOf[hit.topic] ?? { title: hit.topic, c: 1 }, g = { ...(hit.sub ?? t), c: t.c, id: doc.sub ?? doc.topic }
  const sel = c.concepts.find((x) => x.id === p.sel) ?? hit.n
  return { title: esc(name), sub: `概念图 · 只画它和它装着的概念、同它们直接连着的概念${hit.topic !== p.topic ? `；画在主题「${esc(t.title)}」的概念图上` : ''}`,
    body: `<div class="diagram">${drawLocal(g, c, { avail: popW(), sel: sel.id })}</div><div class="cdef"><b>${esc(sel.title)}</b>${esc(sel.definition ?? '')}${sel.source ? `<div class="src">出处：${esc(sel.source)}</div>` : ''}</div>` }

// ---------- 上下文地图 ----------
// 上下文排一排，框高跟着「管什么」那句撑开、字不截。
// 相邻两个上下文之间的来往一条一条横线，间距 30（卡高 22，上下至少留 8）：事件在上、查询在下，同类里先排往右的；
// 每条线一张卡，放在自己那条线正中；两个框之间的横向距离按最宽的卡放宽，卡两边还看得见线和箭头。
// 框高至少盖住所有线的出入点。隔着别的上下文的线从框顶上绕过去，一条一层。整张比主区宽就等比缩，不截、不横滚
function drawCxMap() {
  const CW = 240, X0 = 30, LH = 30, PADV = 22, n = PROJECT.contexts.length
  const idx = {}
  PROJECT.contexts.forEach((p, i) => { idx[p.id] = i })
  const cardW = (e) => Math.ceil(36 + textW(e.name) * 11.5 / 12 + 12)
  const sortLines = (list) => list.map((e, i) => ({ e, i })).sort((p, q) => (p.e.kind === '事件' ? 0 : 1) - (q.e.kind === '事件' ? 0 : 1) || idx[p.e.from] - idx[q.e.from] || p.i - q.i).map((x) => x.e)
  const pairs = {}, far = []
  for (const e of EDGES) {
    if (idx[e.from] == null || idx[e.to] == null || e.from === e.to) continue
    const lo = Math.min(idx[e.from], idx[e.to]), hi = Math.max(idx[e.from], idx[e.to])
    if (hi - lo === 1) (pairs[lo] ??= []).push(e); else far.push(e)
  }
  for (const k of Object.keys(pairs)) pairs[k] = sortLines(pairs[k])
  // 框：名字一行，「管什么」照框宽折行全写上
  const roleLines = Object.fromEntries(PROJECT.contexts.map((p) => [p.id, wrapW(p.role, CW - 28, 11.5)]))
  const textH = Math.max(...PROJECT.contexts.map((p) => 50 + roleLines[p.id].length * 16))
  const most = Math.max(0, ...Object.values(pairs).map((l) => l.length))
  const CH = Math.max(86, textH, most ? PADV * 2 + (most - 1) * LH : 0)
  const gapOf = (i) => Math.max(160, ...(pairs[i] ?? []).map((e) => cardW(e) + 80))
  const xs = []
  PROJECT.contexts.forEach((p, i) => { xs[i] = i ? xs[i - 1] + CW + gapOf(i - 1) : X0 })
  const Y0 = 30 + (far.length ? far.length * LH + 20 : 0)
  const pos = {}
  PROJECT.contexts.forEach((p, i) => { pos[p.id] = { x: xs[i], y: Y0 } })
  let s = `<defs><marker id="cxa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2)"/></marker></defs>`, labels = ''
  const card = (e, mx, my) => {
    const lw = cardW(e), lh = 22
    return `<g class="lb"><g class="${e.kind === '事件' ? 'evt' : 'qry'}"><rect x="${mx - lw / 2}" y="${my - lh / 2}" width="${lw}" height="${lh}" rx="4"/><text class="k" x="${mx - lw / 2 + 8}" y="${my + 4}">${esc(e.kind)}</text><text x="${mx - lw / 2 + 36}" y="${my + 4}">${esc(e.name)}</text></g></g>`
  }
  // 相邻的：在两个框之间、框高里竖着居中排开
  for (const [k, list] of Object.entries(pairs)) {
    const L = PROJECT.contexts[+k].id, R = PROJECT.contexts[+k + 1].id
    const xl = pos[L].x + CW, xr = pos[R].x, top = Y0 + (CH - (list.length - 1) * LH) / 2
    list.forEach((e, i) => {
      const y = top + i * LH, rightward = e.from === L
      const x1 = rightward ? xl : xr, x2 = rightward ? xr - 2 : xl + 2
      s += `<g class="ed"><path d="M ${x1} ${y} L ${x2} ${y}" marker-end="url(#cxa)"/></g>`
      labels += card(e, (xl + xr) / 2, y)
    })
  }
  // 隔着别的上下文的：从框顶上出去、横着走一层、再下到对面框顶；一条一层
  far.forEach((e, k) => {
    const a = pos[e.from], b = pos[e.to], y = Y0 - 20 - k * LH
    const ax = a.x + CW / 2 + (b.x > a.x ? 1 : -1) * (30 + k * 14), bx = b.x + CW / 2 + (b.x > a.x ? -1 : 1) * (30 + k * 14)
    s += `<g class="ed"><path d="M ${ax} ${Y0} L ${ax} ${y} L ${bx} ${y} L ${bx} ${Y0 - 2}" marker-end="url(#cxa)"/></g>`
    labels += card(e, (ax + bx) / 2, y)
  })
  for (const p of PROJECT.contexts) {
    const q = pos[p.id]
    s += `<g class="sp${selected === p.id ? ' sel' : ''}" data-cx="${p.id}"><rect x="${q.x}" y="${q.y}" width="${CW}" height="${CH}" style="fill:var(--c${p.c});stroke:var(--c${p.c}l)"/>
      <text class="n" x="${q.x + 14}" y="${q.y + 28}">${esc(p.name)}</text>
      ${roleLines[p.id].map((ln, i) => `<text class="d" x="${q.x + 14}" y="${q.y + 50 + i * 16}">${esc(ln)}</text>`).join('')}</g>`
  }
  // 共享内核：底下一条虚线框，每个上下文一条虚线下去，线上写用了哪几个概念
  const K = { x: X0 + CW / 2, y: Y0 + CH + 110, w: Math.max(CW, xs[n - 1] - X0), h: 44 }
  s += `<g class="kn${selected === 'kernel' ? ' sel' : ''}" data-cx="kernel"><rect x="${K.x}" y="${K.y}" width="${K.w}" height="${K.h}" rx="8"/><text class="n" x="${K.x + 14}" y="${K.y + 20}">共享内核</text><text class="d" x="${K.x + 14}" y="${K.y + 36}">${esc(PROJECT.kernel.concepts.join('、'))}</text></g>`
  for (const p of PROJECT.contexts) {
    const q = pos[p.id], cx = q.x + CW / 2, y1 = q.y + CH, y2 = K.y - 2
    s += `<g class="kd"><path d="M ${cx} ${y1} L ${cx} ${y2}"/></g>`
    const used = USES[p.id] ?? [], t = used.length ? '用 ' + used.join('、') : '还没用', lw = Math.ceil(textW(t) * 11.5 / 12 + 16), my = (y1 + y2) / 2
    labels += `<g class="lb"><g class="use"><rect x="${cx - lw / 2}" y="${my - 11}" width="${lw}" height="22" rx="4"/><text x="${cx - lw / 2 + 8}" y="${my + 4}">${esc(t)}</text></g></g>`
  }
  const w = Math.ceil(Math.max(xs[n - 1] + CW + X0, K.x + K.w + X0)), h = K.y + K.h + 24, avail = availW()
  const size = w > avail ? `width="${Math.floor(avail)}" height="${Math.ceil(h * avail / w)}"` : `width="${w}" height="${h}"`
  return `<svg ${size} viewBox="0 0 ${w} ${h}">${s}${labels}</svg>`
}
