<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台 · 业务</title>
<style>
:root{
  --bg:#f7f6f3; --panel:#ffffff; --ink:#1d1d1b; --ink-2:#55534e; --ink-3:#8a877f; --line:#dedbd3; --accent:#2563eb; --accent-bg:#e8efff;
  --role:#e3edff; --role-line:#2f5fc4; --data:#e7f5ec; --data-line:#2f855a; --area:#f4f4f1; --area-line:#b8b5ad; --topic:#faf9f6; --topic-line:#8a877f;
  --c1:#fdf1e3; --c1l:#c2410c; --c2:#e8efff; --c2l:#2563eb; --c3:#f1ebfd; --c3l:#7c3aed; --c4:#fbf3d5; --c4l:#b45309; --c5:#e3f6f8; --c5l:#0891b2;
  --note:#fffdf5; --note-line:#e5d9a8; --warn:#b35c00; --badge:#fff3cd; --badge-ink:#7a5200; --badge-line:#f0d58c; --bad:#d6342c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#18181a; --panel:#222225; --ink:#ecebe7; --ink-2:#b5b2ab; --ink-3:#85827b; --line:#3a3a3e; --accent:#7aa2ff; --accent-bg:#26314d;
    --role:#243352; --role-line:#7aa2ff; --data:#1f3327; --data-line:#4ade80; --area:#1d1d20; --area-line:#4a4a50; --topic:#26262a; --topic-line:#85827b;
    --c1:#3a2a1c; --c1l:#fb923c; --c2:#1f2a44; --c2l:#7aa2ff; --c3:#2d2342; --c3l:#c4b5fd; --c4:#3a3220; --c4l:#fbbf24; --c5:#1b3337; --c5l:#67e8f9;
    --note:#2e2b1f; --note-line:#6b5f2e; --warn:#fb923c; --badge:#3a3220; --badge-ink:#fbbf24; --badge-line:#6b5f2e; --bad:#f87171;
  }
}
/* 左边栏：流程那一行右边的红点，数字是这段流程还没答的条数 */
nav a.sub .open,nav .gn .open{display:inline-block;min-width:8px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:600;text-align:center;line-height:16px;vertical-align:1px}
/* 左边栏的组：点组名折叠展开，默认折叠；折叠时流程组右边带红点 */
nav .gn.fold{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
nav .gn.fold:hover{color:var(--ink-2)}
nav .gn .tri{display:inline-block;width:12px;font-size:10px}
nav .gn .open{margin-left:auto}
/* 大组里套的小组（流程 · 按主题 → 一个主题一组）：组名和组里的流程各缩进一层 */
nav .gb .gn.fold{padding-left:30px}
nav .gb .gb a.sub{padding-left:46px}
/* 业务概述：放在页签上面，点标题整块收起；一排五个页签，一次看一栏 */
.intro{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:0 0 12px;max-width:1100px}
.intro .ih{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;user-select:none;font-weight:600;font-size:14px}
.intro .ih .tri{font-size:10px;color:var(--ink-3);width:12px}
.intro .itabs{display:flex;flex-wrap:wrap;gap:2px;padding:0 10px;border-bottom:1px solid var(--line)}
.intro .itabs button{font:inherit;font-size:13px;padding:5px 12px;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;background:none;color:var(--ink-2);cursor:pointer;margin-bottom:-1px}
.intro .itabs button.on{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:600}
.intro .ib{padding:10px 16px 12px;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.intro .ib ul,.intro .ib ol{margin:0;padding-left:20px}.intro .ib li{margin:2px 0}
.intro .ib b{color:var(--ink)}
/* 使用角色：等宽的网格，一行几张卡一样宽、一样高，放不下换行 */
.intro .who{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;align-items:stretch}.intro .who>div{border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0}
.intro .who .aim{color:var(--ink-3);font-size:12.5px;margin:2px 0 4px}
.intro .none{color:var(--ink-3)}
.mc.data .note{font-size:12px;color:var(--ink-3);margin-top:2px}
h1{font-size:22px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
h1 a{color:var(--accent);text-decoration:none;font-size:14px;font-weight:400}
h1 .sep{color:var(--ink-3);font-weight:400;font-size:16px}
.badge{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--badge);color:var(--badge-ink);border:1px solid var(--badge-line);font-weight:400}
.badge.done{background:var(--data);color:var(--data-line);border-color:var(--data-line)}
.act{font-size:12px;padding:2px 10px;border:1px solid var(--accent);color:var(--accent);background:var(--panel);border-radius:4px;cursor:pointer}
.sub{color:var(--ink-2);margin:0 0 12px;max-width:960px}
.lock{margin:0 0 10px;padding:7px 12px;border:1px solid var(--badge-line);background:var(--badge);color:var(--badge-ink);border-radius:8px;max-width:960px}
.diagram{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;overflow:auto}
.row{display:flex;gap:16px;align-items:flex-start}
.row .diagram{flex:1;min-width:0}
.side{width:300px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--ink-2);position:sticky;top:12px}
.side b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
.side .src{font-size:12px;color:var(--ink-3);margin-top:8px}
.ctbl{margin-top:16px}
.ctbl h3{font-size:15px;margin:0 0 4px}
.ctbl .def{font-size:13px;color:var(--ink-2);margin:0 0 8px}
.ctbl .wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.ctbl table{border-collapse:collapse;font-size:13px;min-width:720px;width:100%}
.ctbl th,.ctbl td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.ctbl th{color:var(--ink-3);font-weight:600;white-space:nowrap}
.ctbl td:first-child{font-weight:600;white-space:nowrap}
.ctbl tr:last-child td{border-bottom:none}
.ctbl .src{font-size:12px;color:var(--ink-3);margin-top:6px}
svg{display:block;margin:0 auto}
svg text{font:12px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--ink);pointer-events:none}
svg text.sub{font-size:11px;fill:var(--ink-3)}
.tp rect{stroke-width:1.4}
.tp text.t{fill:var(--ink)}
.lb rect{fill:var(--panel);stroke:var(--line);stroke-width:1;rx:6}
.lb text{font-size:11.5px;fill:var(--ink-2)}
.lb path{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3;opacity:.75}
.tp text.t{font-size:15px;font-weight:600}
.tp text.c{font-size:11px;fill:var(--ink-3)}
.tp text.d{font-size:12px;fill:var(--ink-2)}
.tp{cursor:pointer}
.grp rect{stroke-dasharray:2 4;stroke-width:1.2}
.grp text{font-size:13px;fill:var(--ink-3);letter-spacing:1px}
.nd rect{fill:var(--data);stroke:var(--data-line);stroke-width:1.2}
.nd.sel rect{stroke-width:2.6}
.nd{cursor:pointer}
.stub rect{stroke-dasharray:4 3;stroke-width:1}
.stub text{fill:var(--ink-2)}
.stub text.sub{fill:var(--ink-3)}
.stub{cursor:pointer}
.rl rect{fill:var(--role);stroke:var(--role-line);stroke-width:1}
.rl text{font-size:10.5px;fill:var(--role-line)}
.ed path.vis{fill:none;stroke:var(--ink-2);stroke-width:1.3}
.ed.tree path.vis{stroke:var(--ink-3);stroke-width:1}
.ed path.hit{fill:none;stroke:transparent;stroke-width:14}
/* 流程：时序图 */
.flow text{font-size:13px}
.head rect{fill:var(--role);stroke:var(--role-line);stroke-width:1.2}
.head text{font-weight:600;text-anchor:middle}
.head text.sub{font-weight:400;font-size:11px;fill:var(--ink-2)}
.life{stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.msg path{fill:none;stroke:var(--ink-2);stroke-width:1.4}
.msg text{text-anchor:middle}
.msg text.date,.self text.date{font-size:11px;fill:var(--ink-3)}
.self rect{fill:var(--panel);stroke:var(--ink-3);stroke-width:1;rx:4}
.data rect{fill:var(--data);stroke:var(--data-line);stroke-width:1;rx:2}
.data text{font-size:11px;text-anchor:middle}
.note rect{fill:var(--note);stroke:var(--note-line);stroke-width:1;rx:3}
.note text{font-size:12px;fill:var(--ink-2)}
.due text{fill:var(--warn);font-size:11px}
/* 流程：每步右边一个框，说明、规则、问题列成一张单子，一条虚线指回这一步。有待定的、没答的框红边红标题；全定了的灰框 */
.qa rect.bg{fill:var(--panel);stroke:var(--line);stroke-width:1;rx:3}
.qa text{font-size:12px;fill:var(--ink-2)}.qa text.h{font-weight:600}.qa text.s{font-size:11px;fill:var(--ink-3)}.qa text.id{font-size:10.5px;fill:var(--ink-3)}
.qa path.lead{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3}
.qa.pending rect.bg{stroke:var(--bad);stroke-width:1.2}.qa.pending text.h{fill:var(--bad)}.qa.pending path.lead{stroke:var(--bad)}
.qa.done rect.bg{fill:var(--area);stroke:var(--area-line)}.qa.done text.h{fill:var(--ink-3)}
.qa .tog{cursor:pointer}.qa .tog rect{fill:transparent;stroke:none}.qa .tog:hover text.h{text-decoration:underline}
.qa line.sep{stroke:var(--line);stroke-width:1}
.qa .it text.mk{font-size:11px;font-weight:600}.qa .it.pending text.mk{fill:var(--bad)}.qa .it.done text.mk{fill:var(--ink-3)}
.qa a.scr text{fill:var(--accent);pointer-events:auto;cursor:pointer}.qa a.scr:hover text{text-decoration:underline}
.qa .btn{cursor:pointer}.qa .btn rect{fill:var(--panel);stroke:var(--line);stroke-width:1;rx:4}.qa .btn text{fill:var(--ink);font-size:11.5px}
.qa .btn.b rect{stroke:var(--accent)}.qa .btn.b text{font-weight:600;fill:var(--accent)}
/* 业务（模块业务）：三层页签，一屏看完不用上下滚 */
/* 核心数据：每一站是一样数据，线上是把前一样变成后一样的那件业务 */
.cf{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 12px;padding:12px 18px 18px;max-width:max-content;min-width:min(100%,1100px);overflow-x:auto}
.cf .ch{font-size:11.5px;letter-spacing:1px;color:var(--accent);font-weight:600}
.cf .cw{font-size:13px;color:var(--ink-2);margin:2px 0 16px;max-width:860px}
.cf .flow{display:flex;align-items:center;width:max-content}
.cf .d{flex:none;min-width:96px;max-width:170px;padding:8px 12px;text-align:center;border:2px solid var(--ink-2);border-radius:12px;background:var(--panel)}
.cf .d b{display:block;font-size:14.5px}.cf .d i{display:block;font-style:normal;font-size:11px;color:var(--ink-3)}
.cf .d small{display:block;font-size:11px;color:var(--ink-3);margin-top:3px;border-top:1px dashed var(--line);padding-top:3px}
.cf .d.core{min-width:132px;padding:16px 18px;background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.cf .d.core b{font-size:19px}
.cf .d.core i,.cf .d.core small{color:var(--on-accent);opacity:.85}.cf .d.core small{border-top-color:var(--on-accent)}
.cf .d.ext{border-style:dashed;border-color:var(--badge-ink);background:var(--badge)}.cf .d.ext i{color:var(--badge-ink)}
.cf .d.ev{border-style:dashed;border-color:var(--ink-3);font-size:12.5px;color:var(--ink-2);max-width:132px}
.cf .e{flex:none;display:flex;align-items:center}
.cf .e::before{content:'';width:16px;height:2px;background:var(--ink-3)}.cf .e::after{content:'';width:20px;height:2px;background:var(--ink-3)}
.cf .e span{max-width:168px;padding:5px 10px;border-radius:16px;background:var(--accent-bg);color:var(--accent-ink);font-size:12.5px;line-height:1.4;text-align:center;font-weight:600}
.cf .e span a,.cf .e span em{display:block;font-style:normal;font-weight:400;font-size:11px;color:var(--ink-2);text-decoration:none}.cf .e span a:hover{text-decoration:underline}
.cf .row{gap:0}
.cf .tip{flex:none;width:0;height:0;border-left:9px solid var(--ink-3);border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:-1px}
.cf .col{display:flex;flex-direction:column;gap:18px}
.cf .in>.row{display:flex;align-items:center;justify-content:flex-end;position:relative;padding-right:16px}
.cf .in>.row::before{content:'';position:absolute;right:0;top:50%;width:16px;border-top:2px solid var(--ink-3)}
.cf .in.fork>.row::after{content:'';position:absolute;right:0;border-right:2px solid var(--ink-3);top:-9px;bottom:-9px}
.cf .in.fork>.row:first-child::after{top:50%}.cf .in.fork>.row:last-child::after{bottom:50%}
.cf .out>.row{display:flex;align-items:center;position:relative;padding-left:16px}
.cf .out>.row::before{content:'';position:absolute;left:0;top:50%;width:16px;border-top:2px solid var(--ink-3)}
.cf .out.fork>.row::after{content:'';position:absolute;left:0;border-left:2px solid var(--ink-3);top:-9px;bottom:-9px}
.cf .out.fork>.row:first-child::after{top:50%}.cf .out.fork>.row:last-child::after{bottom:50%}
.cf .stub{flex:none;width:12px;height:2px;background:var(--ink-3)}
.op{display:inline-block;text-decoration:none;font-size:10.5px;font-weight:600;line-height:1.55;padding:0 6px;border-radius:8px;margin-right:5px;vertical-align:1px;color:#fff}
.fr{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;margin:0 0 12px;padding:12px 18px 14px;max-width:1100px}
.fr .fh{font-size:11.5px;letter-spacing:1px;color:var(--accent);font-weight:600;margin-bottom:5px}.fr .fh span{color:var(--ink-3);font-weight:400;letter-spacing:0;margin-left:4px}
.fr .fh.gap{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.fr .fbg{font-size:15px;line-height:1.7}.fr .none{color:var(--ink-3);font-size:13.5px}
.fr .fk{display:flex;gap:10px;align-items:baseline;font-size:13px;color:var(--ink-2);line-height:1.9}.fr .fk>:first-child{flex:none;min-width:104px;text-align:center}
.fr .fs{display:inline-block;font-size:11px;line-height:1.6;padding:0 8px;border-radius:9px;border:1px solid var(--badge-line);background:var(--badge);color:var(--badge-ink);margin-left:8px;vertical-align:2px;font-weight:400;white-space:nowrap}
.fr .fp{margin:10px 0 14px}.fr .ft{font-size:16px;font-weight:600;line-height:1.5}.fr .ft b{display:inline-block;width:22px;color:var(--accent)}
.fr .ffrom{font-size:12px;color:var(--ink-3);margin:1px 0 6px 22px;line-height:1.6}
.fr table{border-collapse:collapse;margin-left:22px;font-size:13.5px}.fr td{padding:5px 18px 5px 0;vertical-align:top;border-top:1px solid var(--line);line-height:1.6}
.fr .fp td:first-child{width:400px}.fr table.ftp{margin-left:0}.fr .ftp td:first-child{width:220px;white-space:nowrap}.fr .ftp a{color:inherit}
.fr .fa{display:flex;flex-wrap:wrap;gap:5px}
.fr .fc{font-size:12px;line-height:1.7;padding:0 10px;border-radius:9px;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:600;white-space:nowrap}
.fr .fd{font-size:12px;line-height:1.7;padding:0 10px;border-radius:9px;border:1px solid var(--ink-3);color:var(--ink-2);white-space:nowrap}
.fr .ff{font-size:12px;line-height:1.7;padding:0 9px;border-radius:9px;border:1px solid var(--line);color:var(--ink-2);text-decoration:none}.fr .ff:hover{border-color:var(--accent)}
.fr .fl{font-size:13px;color:var(--warn);margin-top:8px;line-height:1.6}.fr .fl a{color:inherit}
.mc.intent .fup{margin-top:6px;padding-top:6px;border-top:1px dashed var(--note-line);font-size:12px;color:var(--ink-3)}.mc.intent .fup i{font-style:normal;margin-right:6px}
.op.new{background:#2e9e6b}.op.upd{background:var(--accent);color:var(--on-accent)}.op.del{background:var(--bad)}
.cf .cu{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cf .cu b{font-weight:400;color:var(--ink-2);border:1px solid var(--line);border-radius:9px;padding:1px 9px;background:var(--panel)}
.mc.core .ed{margin-top:6px;font-size:12.5px;color:var(--ink-2);line-height:1.5}.mc.core .ed .mk{margin:4px 0 1px}.mc.core .ed div b{font-size:12.5px}
.cf .ch span{color:var(--ink-3);font-weight:400;letter-spacing:0;margin-left:6px}
.cf .ctabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px}
.cf .ctabs button{font:inherit;font-size:13px;padding:4px 14px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink-2);cursor:pointer}
.cf .ctabs button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.cf .dw{flex:none;position:relative}
.cf .d.go{border-color:var(--accent);cursor:pointer}.cf .d.go i{color:var(--accent)}.cf .d.go:hover{background:var(--accent-bg)}
.mtabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line);margin:0 0 10px}
.mtabs a{padding:6px 12px;font-size:13px;color:var(--ink-2);text-decoration:none;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;margin-bottom:-1px}
.mtabs a:hover{color:var(--ink)}
.mtabs a.on{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:600}
.mtabs a small{color:var(--ink-3);font-weight:400;margin-left:2px}
.mtabs a.red small{color:var(--bad);font-weight:600}
.mtabs.l1 a{font-size:14px}.mtabs.l3 a{font-size:12.5px;padding:4px 10px}
.mhead{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}.mhead h2{font-size:17px;margin:0}
.mhead .called{font-size:12px;color:var(--ink-3)}.mhead .fid{font-size:11.5px;color:var(--ink-3);margin-left:auto}
.mfn{display:flex;align-items:center;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:8px 0 10px;flex-wrap:wrap}
.mcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.mcol.left{width:260px}.mcol.mid{width:240px}.mcol.right{width:240px}
.mcap{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.mc{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--panel)}
.mc .mk{font-size:11px;color:var(--ink-3);margin-bottom:2px}
.mc.intent{background:var(--note);border-color:var(--note-line);color:var(--ink-2)}
.mc.data{background:var(--data);border-color:var(--data-line)}
.mc.core{border-width:2px;border-color:var(--accent);padding:10px 14px}.mc.core b{font-size:15px}
.mc.out{background:var(--area);border-color:var(--area-line)}
.mc .ft{font-size:12.5px;color:var(--ink-2);margin-top:2px}.mc .when{font-size:12px;color:var(--ink-3);margin-top:2px}
.marr{flex:1;min-width:70px;max-width:200px;display:flex;flex-direction:column;align-items:center;padding:0 6px}
.marr i{font-style:normal;font-size:11.5px;color:var(--ink-3);text-align:center;line-height:1.3;margin-bottom:3px}
.marr:after{content:"";display:block;width:100%;height:9px;background:linear-gradient(var(--ink-3),var(--ink-3)) left center/calc(100% - 8px) 1.3px no-repeat;clip-path:polygon(0 3.5px,calc(100% - 8px) 3.5px,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,calc(100% - 8px) 5.5px,0 5.5px)}
.marr:after{background:var(--ink-3)}
.mmore{display:flex;flex-wrap:wrap;gap:12px 28px;font-size:13px;color:var(--ink-2)}
.mmore a{color:var(--accent);text-decoration:none}.mmore a:hover{text-decoration:underline}
.mmore>div{min-width:240px;max-width:520px}.mmore ul{margin:2px 0 0;padding-left:18px}.mmore li{margin:2px 0}
.mchain{display:flex;align-items:center;flex-wrap:wrap;row-gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:8px 0}
.mchain .mc{width:190px}.mchain .mc.cause{border-color:var(--accent)}
.mask{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0 0 10px;max-width:760px;font-size:13px}
.mask.pending{border-color:var(--bad)}.mask.pending .mk{color:var(--bad)}.mask.done{background:var(--area);color:var(--ink-2)}
.mask .q{font-size:14px;color:var(--ink);margin-bottom:4px}.mask .mk{font-size:11.5px;font-weight:600;margin-right:6px;color:var(--ink-3)}
.mask .lean{color:var(--ink-2);margin:2px 0 6px}.mask .ans{color:var(--ink-2)}
.mbtn{font:inherit;font-size:12.5px;padding:3px 10px;margin:0 6px 4px 0;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);cursor:pointer}
.mbtn.b{border-color:var(--accent);color:var(--accent);font-weight:600}
.wf .st rect{fill:var(--panel);stroke:var(--ink-2);stroke-width:1.3;rx:10}.wf .st text{font-size:13px;text-anchor:middle}.wf .st text.sub{font-size:11px;fill:var(--ink-3)}
.wf path.mv{fill:none;stroke:var(--ink-2);stroke-width:1.3}.wf .ml rect{fill:var(--panel);stroke:none}.wf .ml text{font-size:11.5px;fill:var(--ink-2);text-anchor:middle}
/* 流程：入口、出口卡在最左边一列，虚线指到接着的那一步；opt、alt 是虚线框，alt 里横虚线隔成格 */
.end rect{fill:var(--panel);stroke:var(--accent);stroke-width:1.2}.end.out rect{stroke-dasharray:5 3}
.end text{font-size:12px}.end text.h{font-size:11px;fill:var(--accent)}
.flow a .end{cursor:pointer}.flow a:hover .end text.h{text-decoration:underline}
.elead{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3}
.frame rect.f{fill:none;stroke:var(--ink-3);stroke-width:1.1;stroke-dasharray:6 4}
.frame rect.tab{fill:var(--area);stroke:var(--ink-3);stroke-width:1}
.frame text{font-size:12px;fill:var(--ink-2)}.frame text.k{font-weight:600;fill:var(--ink)}.frame text.c{font-size:11.5px;fill:var(--ink-3)}
.frame line{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:6 4}
.data.tpc rect{stroke-width:1}.data.tpc text.tn{font-size:10px;fill:var(--ink-3);text-anchor:start}
/* 流程标题下一排主题：这一份讲的主题在前、加粗，后面是数据卡用到的别的主题 */
.ftopics{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
.ftopics a{font-size:12px;padding:1px 9px;border:1px solid;border-radius:10px;color:var(--ink);text-decoration:none}
.ftopics a.own{font-weight:600}
/* 流程的图框不自己滚（让主区滚），顶上参与方那一排才能 sticky 贴在主区顶上；横着滚时两者一起走 */
.flowbox{overflow:visible}
.flowbox svg{margin:0}
.flowbox .heads{position:sticky;top:0;z-index:5;height:50px;background:var(--panel);border-bottom:1px solid var(--line);margin-bottom:-1px}
.flowbox .hd{position:absolute;top:5px;height:38px;border-radius:14px;background:var(--role);border:1.2px solid var(--role-line);text-align:center;font-size:13px;font-weight:600;line-height:17px;padding-top:2px;color:var(--ink)}
.flowbox .hd.one{line-height:36px;padding-top:0}
.flowbox .hd small{display:block;font-size:11px;font-weight:400;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--ink-2);margin:10px 0 0}
.legend .sw{display:inline-block;width:18px;height:12px;border:1px solid;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend .sw.round{border-radius:7px;width:14px;height:10px}
.legend .sw.dash{border-style:dashed}
.detail{position:fixed;z-index:20;max-width:380px;box-shadow:0 6px 24px rgba(0,0,0,.2);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px}
.detail[hidden]{display:none}
.detail h4{margin:0 0 4px;font-size:13px;color:var(--ink-3);font-weight:400}
.detail div{padding:2px 0}
/* 上下文地图：项目级，一排上下文框、线上是事件或查询的小卡、底下共享内核 */
.cxmap{--evt:#fdf6d5;--evt-line:#b45309;--cmd:#fdeee0;--cmd-line:#c2410c}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .cxmap{--evt:#3a3220;--evt-line:#fbbf24;--cmd:#3a2a1c;--cmd-line:#fb923c} }
.cxmap .sp rect{stroke-width:1.5;rx:10}.cxmap .sp.sel rect{stroke-width:3}.cxmap .sp{cursor:pointer}
.cxmap .sp text.n{font-size:15px;font-weight:600}.cxmap .sp text.d{font-size:11.5px;fill:var(--ink-2)}
.cxmap .ed path{fill:none;stroke:var(--ink-2);stroke-width:1.3}
.cxmap .lb rect{fill:var(--panel);stroke:var(--line)}.cxmap .lb text{font-size:11.5px}.cxmap .lb text.k{fill:var(--ink-3);font-size:10.5px}
.cxmap .lb .evt rect{fill:var(--evt);stroke:var(--evt-line)}.cxmap .lb .qry rect{fill:var(--cmd);stroke:var(--cmd-line);stroke-dasharray:3 2}
.cxmap .lb .use rect{fill:var(--area);stroke:var(--area-line)}.cxmap .lb .use text{fill:var(--ink-2)}
.cxmap .kn rect{fill:var(--area);stroke:var(--area-line);stroke-dasharray:6 4;stroke-width:1.5}.cxmap .kn.sel rect{stroke-width:3}.cxmap .kn{cursor:pointer}
.cxmap .kn text.n{font-size:14px;font-weight:600}.cxmap .kn text.d{font-size:11.5px;fill:var(--ink-2)}
.cxmap .kd path{fill:none;stroke:var(--area-line);stroke-width:1.2;stroke-dasharray:4 3}
.cxmap table.t{border-collapse:collapse;font-size:13px;width:100%}.cxmap table.t td{padding:6px 14px 6px 0;border-top:1px solid var(--line);vertical-align:top}
.cxmap table.t tr.hd td{color:var(--ink-3);font-size:12px;border-top:0;white-space:nowrap}.cxmap table.t td.n{font-weight:600;white-space:nowrap}.cxmap table.t td.x{color:var(--ink-2)}
.cxmap table.t tr.sel td{background:var(--accent-bg)}.cxmap table.t tr[data-cx]{cursor:pointer}
.cxmap .st{display:inline-block;font-size:11.5px;padding:0 7px;border-radius:3px;border:1px solid var(--area-line);color:var(--ink-2);white-space:nowrap;margin-right:4px}
.cxmap .st.s1{background:var(--accent-bg);border-color:var(--accent)}.cxmap .st.s3{background:var(--data);border-color:var(--data-line)}.cxmap .st small{color:var(--ink-3);margin-left:4px}
.cxmap .cap{font-size:12px;color:var(--ink-3);letter-spacing:1px;margin-bottom:6px}

<script>
// 工作台起的时候 window.DATA 由 /data/<页>.js 先定义，下面每个常量都先取它；单开这份小样时 DATA 是空的，用写死的
const DATA = (typeof window !== 'undefined' && window.DATA) || {}
const LIVE = Object.keys(DATA).length > 0
const post = (action, body) => fetch('api/' + action, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then((r) => r.json()).then((o) => { if (o.ok) location.reload(); else alert(o.error) })
// 业务这个角色的三份输出，一个上下文一套；数据写死在这里，真做时是 上下文/<名>/业务/ 下三种 JSON 文件。
// 工作台注入 DATA.BIZ = { <上下文名>: { MAP, CONCEPTS, FLOWS } }，有业务的上下文各一项；单开时用下面写死的样例系统和排版系统。三份的形状：
// 1. 全局图.json
//    { topics: [{ id, title, c, x, y, does: [两句], concepts: [几样数据名] }],   c 是颜色号 1–5；x、y 是格子位置，从左到右、从上到下是发生的先后
//      edges:  [{ from, to, label }] }                                          label 是主题之间主要的业务交流，人写的，「；」分句
// 2. 概念/<主题>.json（一个主题一份，这里只写 g2 做例子）
//    { topic, title, summary,
//      concepts: [{ id, title, by: [角色], order, definition, source, nudge?, table?: { columns: [列名], rows: [[一格一格]] } }],  这一块自己的数据；先后（列）由线算出来，order 定同一列里的上下，nudge 是人手指定的上下挪动
//      external: [{ id, title, topic, context? }],                                别的主题里连着的数据，画成虚框；只连进来的在左、其余在右，由线定
//                                                                                 别的上下文的带 context（topic 是那边的主题号）；共享内核里的 topic 写「共享内核」
//      edges:    [{ id, from, to, label, by?: [角色], source?, tree? }] }           线是关系，by 是做这件事的角色（骑在线上），tree 是上下层级
//    数据太多、分了子主题的主题，这一份改成子主题图，形状照全局图：
//    { topic, title, summary, subs: [{ id, title, x, y, does: [两句], concepts: [数据名] }], edges: [{ from, to, label }] }
//    每个子主题一份 概念/<主题>/<子主题>.json，形状同上面的概念图，多一个 sub（子主题 id）；工作台给的 CONCEPTS 里键是「主题/子主题」
//    别处指进来的虚框写 sub 就进那个子主题；没写 sub 的，到那个主题的几份子主题里找这样数据在哪一份
// 3. 流程/<流程名>.json（一段流程一份）
//    { file, title, topic, summary, parties: [{ id, title, sub }],          文件名「主题号-两位序号-阶段名」；topic 是这一份讲的主题
//      entries?: [{ text, step, flow? }], exits?: [{ text, step, flow? }],    入口、出口：接在这一份的哪一步上；flow 是接着的那一份，两边都写
//      steps: [{ id, from, to, title, date, data?: [数据名], due?, source?, note?,
//                opt?: 一句话（可能发生的情况）, alt?: 一句话（几支只走一支）, case?: 这一支的情况,   挨着的几步写得一样就画在同一个框里；旁支步号写 9a、9b
//                rules?: [{ id, text, source?, status: '待定' | '定了', lean?, options?: [], answer?, answeredAt? }],   这一步守的规则；待定的就是问题
//                asks?:  [{ id, q, lean?, options?: [], answer?, answeredAt?, by?, screen? }] }] }                       这一步上不是规则的问题；答了写 answer
//                                                                    by 是别的角色问的（如「UI 设计」），screen 是它在界面页哪一屏问的「<需求编号>/<屏 id>」

// 4. 模块业务/<主题>.json（一个主题一份，页面上叫「业务」）：这个主题自己的业务逻辑，换一家公司来用也不变
//    { topic, title, summary,
//      intro?: { context, duty, concepts: [{ title, note }], users: [{ who, aim, steps: [一件一句] }], usual: [一步一句] },   业务概述，放在页签上面
//      groups: [{ title, functions: [{ id, title, called?, does, intent, subject: { title, from?, to }, in: [{ title, note }]（只写名字的旧写法也认）, out: [{ kind, title, when? }], rules?, uses?: [{ flow, step }], source? }] }],
//      chains: [{ id, title, after: { title, from?, to, when? }, then: [{ kind, title, from?, to?, when?, note? }] }],     内部流程：一样数据变了，接着哪几样怎么变
//      workflows: [{ id, title, states: [{ id, title, called? }], moves: [{ from, to, label }], note? }],                 工作流程：一种单据一份状态图

        const ax = a.x + a.w / 2 + (n - 1) * 14, bx = b.x + b.w / 2 - (n - 1) * 14
        const pts = down
          ? [...(clearBelow(a) ? [{ x: ax, y: a.y + a.h }, { x: ax, y: gy }] : [{ x: a.x + a.w, y: y1 }, { x: a.x + a.w + 40, y: y1 }, { x: a.x + a.w + 40, y: gy }]),
            ...(clearAbove(b) ? [{ x: bx, y: gy }, { x: bx, y: b.y - 2 }] : [{ x: b.x - 40, y: gy }, { x: b.x - 40, y: y2 }, { x: b.x - 2, y: y2 }])]
          : [...(clearAbove(a) ? [{ x: ax, y: a.y }, { x: ax, y: gy }] : [{ x: a.x, y: y1 }, { x: a.x - 40, y: y1 }, { x: a.x - 40, y: gy }]),
            ...(clearBelow(b) ? [{ x: bx, y: gy }, { x: bx, y: b.y + b.h + 2 }] : [{ x: b.x + b.w + 40, y: gy }, { x: b.x + b.w + 40, y: y2 }, { x: b.x + b.w + 2, y: y2 }])]
        cv = smooth(pts); d = cv.d
      } else if (stubColumn(e)) {
        // 同一列的两个虚框：中间没别的框就从上面那个的底边直下（或直上）进另一个；隔着框就从右边绕过去
        const lo = Math.min(a.y, b.y), hi = Math.max(a.y, b.y), down = b.y > a.y, x = a.x + a.w / 2
        const blocked = Object.values(pos).some((q) => q !== a && q !== b && Math.abs(q.x - a.x) < 1 && q.y > lo && q.y < hi)
        const pts = blocked
          ? [{ x: a.x + a.w, y: a.y + a.h / 2 }, { x: a.x + a.w + 36, y: a.y + a.h / 2 }, { x: a.x + a.w + 36, y: b.y + b.h / 2 }, { x: b.x + b.w + 2, y: b.y + b.h / 2 }]
          : [{ x, y: down ? a.y + a.h : a.y }, { x, y: down ? b.y - 2 : b.y + b.h + 2 }]
        cv = smooth(pts); d = cv.d
      } else if (b.x > a.x) {
        const x1 = a.x + a.w, x2 = b.x - 2
        if (skipped(a, b)) {
          // 隔着列：沿空当走，两头各拐一下
          const far = b.band != null ? b : a
          const ly = useLane(y2 >= y1 || far === a ? far.y - (ROW - H) / 2 : far.y + far.h + (ROW - H) / 2)
          const pts = [{ x: x1, y: y1 }, { x: x1 + 50, y: y1 }, { x: x1 + 95, y: ly }, { x: x2 - 95, y: ly }, { x: x2 - 50, y: y2 }, { x: x2, y: y2 }]
          cv = smooth(pts); d = cv.d
        } else {
          const dx = (x2 - x1) * 0.5
          const p0 = { x: x1, y: y1 }, p1 = { x: x1 + dx, y: y1 }, p2 = { x: x2 - dx, y: y2 }, p3 = { x: x2, y: y2 }
          d = `M ${p0.x} ${p0.y} C ${p1.x} ${p1.y}, ${p2.x} ${p2.y}, ${p3.x} ${p3.y}`
          cv = { at: (t) => bez(p0, p1, p2, p3, t) }
        }
      } else {
        // 往回走的线往上拱一下，跟往右走的分开
        const x1 = a.x, x2 = b.x + b.w + 2, dx = (x1 - x2) * 0.5, bulge = -60
        const p0 = { x: x1, y: y1 }, p1 = { x: x1 - dx, y: y1 + bulge }, p2 = { x: x2 + dx, y: y2 + bulge }, p3 = { x: x2, y: y2 }
        d = `M ${p0.x} ${p0.y} C ${p1.x} ${p1.y}, ${p2.x} ${p2.y}, ${p3.x} ${p3.y}`
        cv = { at: (t) => bez(p0, p1, p2, p3, t) }
      }
    }
    const n0 = hitsOf(cv, a, b)
    if (n0) { const alt = e.tree ? treeDetour(a, b) : detour(a, b, slot(e, e.from, a), slot(e, e.to, b)); if (alt && alt.n < n0) { cv = alt.cv; d = cv.d } }
    s += `<g class="ed${e.tree ? ' tree' : ''}" data-e="${geo.length}"><path class="vis" d="${d}" marker-end="url(#a)"/><path class="hit" d="${d}"/></g>`
    geo.push({ e, cv })
  }
  // 每条线一张小卡：做这件事的角色在卡顶上、说明在底下，整张骑在线上；骑不上就先在近处、再一圈圈往外（最远 300）找个不压框、不被别的线穿过的地方，拉虚线指过去。树的连线是直角，小卡放在横杠旁边
  geo.forEach(({ e, cv }, i) => {
    const others = geo.filter((x) => x.e !== e).map((x) => x.cv)
    labels += `<g data-e="${i}">` + placeLabel(cv, [e.label], taken, e.tree ? { roles: e.by, others, onLine: [], around: [[0.5, 110, 0], [0.5, -110, 0], [0.5, 130, 0], ...TRIES_NEAR], rings: true, inside: inG(e.from) && inG(e.to) ? frame : null, cardW: 30 } : { roles: e.by, others, around: TRIES_NEAR, rings: true, inside: inG(e.from) && inG(e.to) ? frame : null, cardW: 30 }).svg + '</g>'
  })
  // 画布的包围盒把线也算进去（往回拱的线、绕空当的线会伸出框外）
  const extents = []
  for (const { cv } of geo) for (let t = 0; t <= 1; t += 0.05) { const p = cv.at(t); extents.push({ x: p.x - 4, y: p.y - 4, w: 8, h: 8 }) }
  for (const n of mine) {
    const p = pos[n.id]
    s += `<g class="nd${n.id === selected ? ' sel' : ''}" data-n="${n.id}"><rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="3"/>
      <text x="${p.x + W / 2}" y="${p.y + 30}" text-anchor="middle">${esc(n.title)}</text></g>`
    // 角色标签一排放在框上方，不压框线
    if (n.by?.length) s += pills(n.by, p.x + 6, p.y - 26)
  }
  for (const id of outside) {
    const p = pos[id], n = byId[id], from = stubFrom(n)
    s += `<g class="stub" data-g="${esc(n.topic)}"${n.cx ? ` data-cx="${esc(n.cx)}"` : ''}${!n.cx && n.g !== n.topic ? ` data-s="${esc(n.g)}"` : ''} data-n="${esc(id)}"><rect x="${p.x}" y="${p.y}" width="${W}" height="${p.h}" rx="3" style="${from.style};fill-opacity:.5"/>
      <text x="${p.x + W / 2}" y="${p.y + 17}" text-anchor="middle">${esc(n.title)}</text><text class="sub" x="${p.x + W / 2}" y="${p.y + 32}" text-anchor="middle">${esc(from.text)} ›</text></g>`
  }
  s += labels
  return canvas(s, [frame, ...taken, ...extents], 20, avail)
}

// ---------- 流程：时序图 ----------
/** 数据名 → 它在哪个主题（照这个上下文各份概念图，分了子主题的也算主题的） */
function dataTopics() {
  const m = {}
  for (const [k, c] of Object.entries(CONCEPTS)) for (const n of c.concepts ?? []) m[n.title] ??= c.topic ?? k.split('/')[0]
  return m
}
/** 一份流程碰到的主题：这一份讲的主题在前，再是数据卡用到的别的主题 */
function flowTopics(f) {
  const DT = dataTopics(), ids = [f.topic, ...(f.steps ?? []).flatMap((p) => (p.data ?? []).map((d) => DT[d]))]
  return [...new Set(ids.filter((id) => id && grpOf[id]))]
}
function drawFlow(st) {
  const tw = (t, px) => textW(String(t ?? '')) * px / 12       // textW 按 12px 量的，换成别的字号
  const HEAD_H = 46, NOTE_GAP = 36, STEP_GAP = 22
  const nLanes = st.parties.length
  // 右边那一列框的宽度：按最长的一句自适应，280 起、最宽 360，再长就折行；单子里每条左边一列编号、右边一个标记，宽度里算上
  // 答过的问题不画（再有问题再问）；答过的规则当定了的画
  const asksOf = (p) => (p.asks ?? []).filter((a) => !a.answer)
  const qa = st.steps.flatMap((p) => [...(p.rules ?? []).map((r) => r.text), ...asksOf(p).map((a) => a.q), ...(p.rules ?? []).flatMap((r) => r.options ?? []), ...asksOf(p).flatMap((a) => a.options ?? [])])
  const NOTE_W = Math.max(280, Math.min(360, ...qa.length ? [Math.max(...qa.map((t) => tw(t, 12) + 96))] : []))
  const idx = (id) => st.parties.findIndex((p) => p.id === id)
  // 各方的名牌按字宽算；泳道间距先按最宽的名牌放宽（LANE 在下面算）
  const headW = Math.max(140, ...st.parties.map((p) => Math.max(tw(p.title, 13), tw(p.sub, 11)) + 28))
  const selfLines = (p) => wrapW(p.title, 220, 13)
  const selfW = (p) => Math.max(...selfLines(p).map((l) => tw(l, 13))) + 24
  // 数据卡前面写它在哪个主题、照主题上色；概念图里找不到的照旧绿卡
  const DT = dataTopics(), cardTopic = (d) => (DT[d] && grpOf[DT[d]]) || null
  const cardW = (d) => { const t = cardTopic(d); return tw(d, 11) + 14 + (t ? tw(t.title, 10) + 8 : 0) }
  // 第一条泳道左边要放得下「自己对自己」的框和它左边堆的数据卡；最后一条右边要放得下框和框底下的期限，再放说明卡
  const selfAt = (i) => st.steps.filter((p) => idx(p.from) === i && idx(p.to) === i)
  const leftNeed = Math.max(headW / 2 + 10, ...selfAt(0).map((p) => Math.max(selfW(p) / 2 + 8 + Math.max(0, ...(p.data ?? []).map(cardW)) + 10, tw(p.due, 11) / 2 + 24)))
  const rightNeed = Math.max(headW / 2 + 10, 80, ...selfAt(nLanes - 1).map((p) => Math.max(selfW(p) / 2 + 12, tw(p.due, 11) / 2 + 24)))
  // 入口、出口：最左边单独一列，卡跟它接着的那一步一样高
  const ends = [...(st.entries ?? []).map((x) => ({ ...x, kind: 'in' })), ...(st.exits ?? []).map((x) => ({ ...x, kind: 'out' }))]
  const ENW = ends.length ? 190 : 0, END_W = 160
  const X0 = Math.max(90, Math.ceil(leftNeed)) + ENW
  const hasSide = st.steps.some((p) => p.note || p.rules?.length || asksOf(p).length)
  // 泳道间距：平时 300 起；参与方多、主区放不下时先收窄泳道（最窄是名牌宽加 20、不窄过 200），说明栏宽度不动（卡上的选项按钮要完整）；
  // 收到最窄还放不下，最后整张等比缩（见 return）
  const avail = availW(), fixedW = X0 + rightNeed + (hasSide ? NOTE_GAP + NOTE_W : 0) + 20
  const LANE0 = Math.max(300, headW + 40), fitLane = nLanes > 1 ? Math.floor((avail - fixedW) / (nLanes - 1)) : LANE0
  const LANE = Math.max(Math.max(headW + 20, 200), Math.min(LANE0, fitLane))
  const lx = (i) => X0 + i * LANE
  const noteX = lx(nLanes - 1) + rightNeed + NOTE_GAP
  const width = Math.ceil(hasSide ? noteX + NOTE_W + 20 : lx(nLanes - 1) + rightNeed + 20)
  const card = (d, x, y) => {
    const w = cardW(d), t = cardTopic(d)
    if (!t) return `<g class="data"><rect x="${x}" y="${y}" width="${w}" height="18"/><text x="${x + w / 2}" y="${y + 13}">${esc(d)}</text></g>`
    const tw0 = tw(t.title, 10) + 8
    return `<g class="data tpc"><rect x="${x}" y="${y}" width="${w}" height="18" style="${tint(t)}"/><text class="tn" x="${x + 6}" y="${y + 13}">${esc(t.title)}</text><text x="${x + tw0 + (w - tw0) / 2}" y="${y + 13}">${esc(d)}</text></g>`
  }
  // 一步一行；每一步先算自己要占多高（标题几行、日子、期限、数据卡几张、右边几张说明卡），下一步从这一步最低的那张卡底下开始
  let y = HEAD_H + 34, s = '', fr = '', open = null, lastBottom = y
  // opt、alt 框横着从第一条泳道左边到最后一条右边；框顶上一个小标签写 opt / alt 和那一句，alt 每一格左上角写这一支的情况
  const FL = X0 - Math.ceil(leftNeed) + 4, FR = lx(nLanes - 1) + rightNeed - 4
  const endCard = (x, top) => {
    const f = x.flow ? FLOWS.find((g) => g.file === x.flow) : null, name = String(f?.title ?? x.flow ?? '').split('：')[0]
    const head = x.kind === 'in' ? (x.flow ? `从「${name}」来` : '入口') : (x.flow ? `接着去「${name}」` : '出口')
    const hl = wrapW(head, END_W - 16, 11), tl = wrapW(x.text ?? '', END_W - 16, 12), h = hl.length * 14 + tl.length * 16 + 12
    let svg = `<g class="end ${x.kind}"><rect x="10" y="${top}" width="${END_W}" height="${h}" rx="8"/>${hl.map((l, k) => `<text class="h" x="18" y="${top + 15 + k * 14}">${esc(l)}</text>`).join('')}${tl.map((l, k) => `<text x="18" y="${top + 16 + hl.length * 14 + k * 16}">${esc(l)}</text>`).join('')}</g>`
    if (x.flow) svg = `<a href="#flow/${esc(x.flow)}">${svg}</a>`
    return { svg, h }
  }
  const closeFrame = (bot) => {
    const o = open; open = null
    const tab = (o.kind === 'opt' ? 'opt' : 'alt'), tw0 = tw(tab, 12) + 16
    fr += `<g class="frame ${o.kind}"><rect class="f" x="${FL}" y="${o.top}" width="${FR - FL}" height="${bot + 8 - o.top}" rx="4"/><rect class="tab" x="${FL}" y="${o.top}" width="${tw0}" height="20"/><text class="k" x="${FL + 8}" y="${o.top + 14}">${tab}</text><text x="${FL + tw0 + 8}" y="${o.top + 14}">${esc(o.label)}</text>`
      + o.cases.map((c, i) => (i ? `<line x1="${FL}" y1="${c.y}" x2="${FR}" y2="${c.y}"/>` : '') + (c.case ? `<text class="c" x="${FL + 8}" y="${c.y + (i ? 15 : 36)}">［${esc(c.case)}］</text>` : '')).join('') + '</g>'
    y += 12
  }
  for (const p of st.steps) {
    const key = p.opt ? 'opt\u0000' + p.opt : p.alt ? 'alt\u0000' + p.alt : null
    if (open && open.key !== key) closeFrame(lastBottom)
    if (key && !open) {
      open = { key, kind: p.opt ? 'opt' : 'alt', label: p.opt ?? p.alt, top: y - 31, cases: [], cur: p.case }
      y += 24
      if (open.kind === 'alt') { open.cases.push({ case: p.case, y: open.top }); y += 18 }
    } else if (open && open.kind === 'alt' && p.case !== open.cur) {
      open.cases.push({ case: p.case, y: lastBottom + 8 }); open.cur = p.case; y += 20
    }
    const a = idx(p.from), b = idx(p.to), data = p.data ?? []
    let bottom, lineEnd
    if (a === b) {
      // 自己对自己：生命线上一个框，从这一行往下长；日子、期限在框底下；数据卡在框左边一张张往下堆
      const x = lx(a), lines = selfLines(p), w = selfW(p), h = lines.length * 18 + 12
      s += `<g class="self" data-id="${p.id}"><rect x="${x - w / 2}" y="${y - 10}" width="${w}" height="${h}"/>${lines.map((l, k) => `<text x="${x}" y="${y + 10 + k * 18}" text-anchor="middle">${esc(l)}</text>`).join('')}
        ${p.date ? `<text class="date" x="${x}" y="${y - 10 + h + 14}" text-anchor="middle">${esc(p.date)}</text>` : ''}</g>`
      let ty = y - 10 + h + (p.date ? 18 : 4)
      if (p.due) { s += `<g class="due"><text x="${x}" y="${ty + 10}" text-anchor="middle">⏱ ${esc(p.due)}</text></g>`; ty += 16 }
      data.forEach((d, i) => { s += card(d, x - w / 2 - 8 - cardW(d), y - 10 + i * 24) })
      bottom = Math.max(ty, y - 10 + data.length * 24)
      lineEnd = x + w / 2 + 8
    } else {
      // 横着的箭头：标题按两条泳道的距离折行、摞在箭头上方；日子、期限在箭头下方；数据卡在箭头指着的那一头底下一张张往下堆
      const x1 = lx(a), x2 = lx(b), dir = x2 > x1 ? 1 : -1, mx = (x1 + x2) / 2
      const lines = wrapW(p.title, Math.abs(x2 - x1) - 24, 13)
      y += (lines.length - 1) * 17
      s += `<g class="msg" data-id="${p.id}"><path d="M ${x1} ${y} L ${x2 - dir * 3} ${y}" marker-end="url(#a)"/>${lines.map((l, k) => `<text x="${mx}" y="${y - 8 - (lines.length - 1 - k) * 17}">${esc(l)}</text>`).join('')}
        ${p.date ? `<text class="date" x="${mx}" y="${y + 16}">${esc(p.date)}</text>` : ''}</g>`
      let ty = y + 22
      if (p.due) { s += `<g class="due"><text x="${mx}" y="${ty + 10}" text-anchor="middle">⏱ ${esc(p.due)}</text></g>`; ty += 16 }
      data.forEach((d, i) => { s += card(d, dir > 0 ? x2 - 10 - cardW(d) : x2 + 10, ty + 2 + i * 24) })
      bottom = data.length ? ty + 2 + data.length * 24 - 6 : ty
      lineEnd = Math.max(x1, x2) + 8
    }
    // 入口、出口卡：最左边一列，跟这一步一样高；虚线带箭头，入口指向这一步的起头，出口从这一步的起头指向卡
    const mine = ends.filter((x) => String(x.step) === String(p.id))
    if (mine.length) {
      const sx = a === b ? lx(a) - selfW(p) / 2 - 4 : Math.min(lx(a), lx(b)) - 4
      let top = y - 16
      for (const x of mine) {
        const c = endCard(x, top), cy = top + c.h / 2
        s += c.svg + (x.kind === 'in' ? `<path class="elead" d="M ${10 + END_W} ${cy} L ${sx} ${y}" marker-end="url(#a)"/>` : `<path class="elead" d="M ${sx} ${y} L ${10 + END_W + 3} ${cy}" marker-end="url(#a)"/>`)
        top += c.h + 6
      }
      bottom = Math.max(bottom, top - 6)
    }
    // 右边一步一个框：说明、规则、问题列成一张单子，一条虚线带箭头指回这一步那条横线；框多高这一步就占多高，下一步从它底下开始
    if (p.note || p.rules?.length || asksOf(p).length) {
      const c = sideBox({ p, asks: asksOf(p), flow: st.file, x: noteX, top: y - 12, w: NOTE_W, lineEnd, y })
      s += c.svg; bottom = Math.max(bottom, y - 12 + c.h)
    }
    lastBottom = bottom
    y = bottom + STEP_GAP + 25      // 下一步的箭头线：留出它标题的第一行
  }
  if (open) closeFrame(lastBottom)
  const height = y - STEP_GAP - 25 + 24
  // 各方的名牌单独一排 html，sticky 贴在主区顶上，往下滚也看得见是谁；横坐标和下面 svg 的泳道对齐。生命线在 svg 里照常跟着内容滚
  const heads = st.parties.map((p, i) => `<div class="hd${p.sub ? '' : ' one'}" style="left:${lx(i) - headW / 2}px;width:${headW}px">${esc(p.title)}${p.sub ? `<small>${esc(p.sub)}</small>` : ''}</div>`).join('')
  const lives = st.parties.map((p, i) => `<line class="life" x1="${lx(i)}" y1="0" x2="${lx(i)}" y2="${height - 10}"/>`).join('')
  // 比主区宽就整张等比缩：svg 用 viewBox 缩，顶上钉住的名牌那一排用同一个比例缩，列位跟 svg 对齐
  const k = width > avail ? avail / width : 1
  s = fr + s
  if (k === 1) return `<div class="heads" style="width:${width}px">${heads}</div><svg width="${width}" height="${height - HEAD_H}" viewBox="0 ${HEAD_H} ${width} ${height - HEAD_H}">${MARK}<g class="flow">${lives}${s}</g></svg>`
  return `<div class="heads" style="width:${Math.floor(width * k)}px;height:${Math.ceil(50 * k)}px"><div class="hds" style="position:relative;width:${width}px;height:50px;transform:scale(${k.toFixed(4)});transform-origin:0 0">${heads}</div></div><svg width="${Math.floor(width * k)}" height="${Math.ceil((height - HEAD_H) * k)}" viewBox="0 ${HEAD_H} ${width} ${height - HEAD_H}">${MARK}<g class="flow">${lives}${s}</g></svg>`
}

// 右边框展开没有：人点过的记下来（内存里一份，localStorage 再记一份，读写不成就只在内存）；没点过的按有没有要答的。
// 记的时候连带当时有没有要答的：要答的从有变没有、从没有变有，记的就不作数，回到默认（要答的不藏，全定了就折）
const SIDE_KEY = 'dev-team-lite/业务/右边框'
const sideOpen = (() => { try { return JSON.parse(localStorage.getItem(SIDE_KEY) ?? '{}') ?? {} } catch { return {} } })()
const sideKey = (flow, step) => context + '/' + flow + '/' + step
function isSideOpen(flow, step, pend) { const v = sideOpen[sideKey(flow, step)]; return v && v.pend === pend ? v.open : pend }
/** 点框的标题：展开的折起来、折着的展开，记下来、重画 */
function toggleSide(d) {
  sideOpen[sideKey(d.flow, d.step)] = { open: d.open !== '1', pend: d.pend === '1' }
  try { localStorage.setItem(SIDE_KEY, JSON.stringify(sideOpen)) } catch {}
  render()
}

/** 一步右边的一个框：标题一行「▾ 说明 · 规则 n 条 · 待定 k · 问 m」，点它展开、折叠；展开是一张单子：说明在最上（便签底色），
 *  规则一条一行（左边编号小字、右边「定了」「待定」），问题一条一行（右边「问」）。来源、谁在哪一屏问的小字跟在那条底下；
 *  待定的、没答的再列偏向和一排按钮（options 各一个，第一个加粗是偏向；「另说」自己输）。只有说明的不折、没有标题。
 *  框顶边在 top，虚线从框左边标题那一行指到这一步那条横线的右端。返回 svg 和框高 */
function sideBox({ p, asks, flow, x, top, w, lineEnd, y }) {
  const rules = p.rules ?? [], step = p.id
  const openRule = (r) => r.status !== '定了' && !r.answer
  const nPend = rules.filter(openRule).length, pend = nPend + asks.length > 0
  const list = rules.length + asks.length > 0
  const open = !list || isSideOpen(flow, step, pend)
  const HEAD = list ? 26 : 0
  const small = (t, wd) => wrapW(t, wd, 11)
  let cur = top + HEAD, body = ''
  if (list && open) body += `<line class="sep" x1="${x + 6}" y1="${cur}" x2="${x + w - 6}" y2="${cur}"/>`
  // 说明：便签底色一块，在单子最上
  if (open && p.note) {
    const lines = wrapW(p.note, w - (list ? 32 : 20), 12), nx = list ? x + 6 : x, nw = list ? w - 12 : w, ny = list ? cur + 6 : cur, nh = lines.length * 17 + 12
    body += `<g class="note"><rect x="${nx}" y="${ny}" width="${nw}" height="${nh}"/>${lines.map((l, k) => `<text x="${nx + 10}" y="${ny + 18 + k * 17}">${esc(l)}</text>`).join('')}</g>`
    cur = ny + nh + (list ? 2 : 0)
  }
  if (list && open) {
    const items = [...rules.map((r) => ({ kind: 'rule', item: r, open: openRule(r) })), ...asks.map((q) => ({ kind: 'ask', item: q, open: true }))]
    const idW = Math.max(26, ...items.map((t) => textW(String(t.item.id)) * 10.5 / 12)) + 12, MK = 34
    const tx = x + 10 + idW, colW = x + w - 10 - tx
    items.forEach(({ kind, item, open: o }, n) => {
      if (n > 0 || p.note) body += `<line class="sep" x1="${x + 10}" y1="${cur + 3}" x2="${x + w - 10}" y2="${cur + 3}"/>`
      const it0 = cur + 6, rule = kind === 'rule'
      const rows = wrapW(rule ? item.text : item.q, colW - MK, 12).map((l) => ({ l, cls: '', lh: 17 }))
      // 别的角色在界面上问的（by 谁问、screen 哪一屏）：小字标「UI 设计问 · N-01 屏名」，点它去界面页那一屏
      if (!rule && (item.by || item.screen)) {
        const sc = item.screen ? screenOf(item.screen) : null
        const text = [item.by ? item.by + '问' : '', sc ? sc.label : ''].filter(Boolean).join(' · ')
        rows.push(...small(text, colW).map((l) => ({ l, cls: 's', lh: 15, href: sc?.href, by: true })))
      }
      if (item.source) rows.push(...small('来源：' + item.source, colW).map((l) => ({ l, cls: 's', lh: 15 })))
      if (o && item.lean) rows.push(...wrapW('偏向：' + item.lean, colW, 12).map((l) => ({ l, cls: '', lh: 17 })))
      let h = 0, txt = ''
      for (const r of rows) {
        h += r.lh
        const t = `<text class="${r.cls}${r.by ? ' by' : ''}" x="${tx}" y="${it0 + h - 4}">${esc(r.l)}</text>`
        txt += r.href ? `<a class="scr" href="${esc(r.href)}">${t}</a>` : t
      }
      const mk = rule ? (o ? '待定' : '定了') : '问'
      let btns = '', end = it0 + h
      // 按钮：短的几个排一排，长的一个占一整行、字在按钮里折行，不会被框裁掉
      if (o) {
        const opts = [...(item.options ?? []).map((t, i) => ({ t, b: i === 0 })), { t: '另说', other: true }]
        let bx = tx, by = it0 + h + 4, rowH = 0
        for (const op of opts) {
          const lines = wrapW(op.t, colW - 16, 11.5), bw = lines.length > 1 ? colW : Math.min(colW, Math.max(...lines.map((l) => textW(l) * 11.5 / 12)) + 16), bh = lines.length * 15 + 8
          if (bx > tx && bx + bw > tx + colW) { bx = tx; by += rowH + 6; rowH = 0 }
          btns += `<g class="btn${op.b ? ' b' : ''}" data-flow="${esc(flow)}" data-step="${esc(step)}" data-kind="${kind}" data-id="${esc(item.id)}"${op.other ? ' data-other="1"' : ` data-opt="${esc(op.t)}"`}><rect x="${bx}" y="${by}" width="${bw}" height="${bh}"/>${lines.map((l, i) => `<text x="${bx + 8}" y="${by + 15 + i * 15}">${esc(l)}</text>`).join('')}</g>`
          bx += bw + 6; rowH = Math.max(rowH, bh)
        }
        end = by + rowH
      }
      body += `<g class="it ${kind} ${o ? 'pending' : 'done'}" data-id="${esc(item.id)}"><text class="id" x="${x + 10}" y="${it0 + 13}">${esc(item.id)}</text><text class="mk" x="${x + w - 10}" y="${it0 + 13}" text-anchor="end">${mk}</text>${txt}${btns}</g>`
      cur = end + 4
    })
    cur += 4
  }
  const h = cur - top
  const sum = [p.note ? '说明' : '', rules.length ? `规则 ${rules.length} 条` : '', nPend ? `待定 ${nPend}` : '', asks.length ? `问 ${asks.length}` : ''].filter(Boolean).join(' · ')
  const head = list ? `<g class="tog" data-flow="${esc(flow)}" data-step="${esc(step)}" data-open="${open ? 1 : 0}" data-pend="${pend ? 1 : 0}"><rect x="${x}" y="${top}" width="${w}" height="${HEAD}"/><text class="h" x="${x + 10}" y="${top + 17}">${open ? '▾' : '▸'} ${esc(sum)}</text></g>` : ''
  const ly = list ? top + 13 : y
  const svg = `<g class="qa side ${list ? (open ? 'open' : 'shut') : 'only'} ${pend ? 'pending' : 'done'}" data-step="${esc(step)}"><path class="lead" d="M ${x} ${ly} L ${lineEnd} ${y}" marker-end="url(#la)"/>${list ? `<rect class="bg" x="${x}" y="${top}" width="${w}" height="${h}"/>` : ''}${head}${body}</g>`
  return { svg, h }
}
/** 问题挂在哪一屏：screen 是「<需求编号>/<屏 id>」。label 是「N-01 屏名」（屏名找不到就照 screen 原文）；
 *  href 指界面页那一屏：工作台里是 <项目>/界面#<上下文>/<需求编号>/<屏 id>，单开时指旁边界面那份小样 */
function screenOf(screen) {
  const hit = SCREENS[screen], i = screen.indexOf('/'), req = i > 0 ? screen.slice(0, i) : screen
  const label = hit?.title ? req + ' ' + hit.title : screen
  const hash = (hit?.context ?? context) + '/' + screen
  const href = DATA.WB ? `${DATA.WB.base ?? ''}/${encodeURIComponent('界面')}#${hash}` : `../界面/小样.html#${hash}`
  return { label, href }
}
/** 答一条待定的规则或问题：工作台上发给后端写进流程文件、重载；单开时只改内存里的那条、重画 */
function answerQa(d) {
  const text = d.other ? (typeof prompt === 'function' ? prompt('另说：') : '') : d.opt
  if (!text) return
  const st = FLOWS.find((f) => f.file === d.flow)?.steps.find((s) => String(s.id) === String(d.step))
  const item = (d.kind === 'rule' ? st?.rules : st?.asks)?.find((r) => r.id === d.id)
  // sig 是工作台给每条没答的规则和问题带出来的「这一版的记号」：页面开着的时候业务改过这一条，工作台不记、提示刷新
  if (LIVE) return post('答', { flow: d.flow, context, step: d.step, [d.kind]: d.id, text, sig: item?.sig })
  if (!item) return
  item.answer = text; item.answeredAt = new Date().toISOString()
  if (d.kind === 'rule') item.status = '定了'
  render()
}

// ---------- 业务（模块业务）：一个主题一份，三层页签 ----------
// 地址：module/<主题>/功能/<第几组>/<功能号>、module/<主题>/内部流程/<号>、module/<主题>/工作流程/<号>、module/<主题>/待定；没写的落到头一个
const MTABS = ['功能', '内部流程', '工作流程', '待定']
const marr = (t) => `<span class="marr"><i>${esc(t ?? '')}</i></span>`
const fromTo = (x) => (x.from || x.to ? `<div class="ft">${x.from ? esc(x.from) : '新记下'} → ${esc(x.to ?? '')}</div>` : '')
function renderModule(main, id, tab0, a0, b0) {
  const t = grpOf[id], m = MODULES[id]
  if (!t && !m) { main.innerHTML = `<h1><a href="#map">全局图</a><span class="sep">›</span>${esc(id)}</h1><p class="sub">${esc(context)} 里没有主题 ${esc(id)}。</p>`; return }
  const h1 = `<h1><a href="#map">全局图</a><span class="sep">›</span>${esc(t?.title ?? m.title ?? id)} <span class="kind">· 业务</span></h1>`
  if (!m) { main.innerHTML = h1 + '<p class="sub">这个主题的业务还没写。</p>'; return }
  const groups = m.groups ?? [], chains = m.chains ?? [], wfs = m.workflows ?? [], asks = m.asks ?? [], nOpen = openMod(m)
  const tab = MTABS.includes(tab0) ? tab0 : '功能', base = 'module/' + id + '/'
  const tabs = (items, cls) => items.length ? `<div class="mtabs ${cls}">${items.map((x) => `<a href="#${esc(x.v)}" class="${x.on ? 'on' : ''}${x.red ? ' red' : ''}">${esc(x.text)}${x.n != null ? ` <small>${esc(x.n)}</small>` : ''}</a>`).join('')}</div>` : ''
  const count = { 功能: groups.reduce((n, g) => n + (g.functions ?? []).length, 0), 内部流程: chains.length, 工作流程: wfs.length, 待定: nOpen ? nOpen + ' 条没答' : asks.length }
  // 最上面是四段；背景、核心数据、业务目的一样都没写的主题，照旧只放那句简介
  let html = h1 + (frameView(m, id) || (m.summary ? `<p class="sub">${esc(m.summary)}</p>` : '')) + introView(m.intro) + coreFlow(m, id)
    + (m.locked ? `<p class="lock">${esc(m.locked.role)}正在改这一份（${esc(m.locked.step)}）。等它交回再答待定：现在答的会被它写回去时盖掉。</p>` : '')
    + tabs(MTABS.map((k) => ({ v: base + k, text: k, n: count[k], on: k === tab, red: k === '待定' && nOpen })), 'l1')
  if (tab === '功能') {
    if (!groups.length) html += '<p class="sub">还没有功能。</p>'
    else {
      const gi = Math.min(groups.length, Math.max(1, parseInt(a0, 10) || 1)) - 1, fns = groups[gi].functions ?? [], f = fns.find((x) => x.id === b0) ?? fns[0]
      html += tabs(groups.map((g, i) => ({ v: base + '功能/' + (i + 1), text: g.title, n: (g.functions ?? []).length, on: i === gi })), 'l2')
        + tabs(fns.map((x) => ({ v: base + '功能/' + (gi + 1) + '/' + x.id, text: x.title, on: x === f })), 'l3')
        + (f ? fnView(f, m) : '<p class="sub">这一组还没有功能。</p>')
    }
  } else if (tab === '内部流程') {

    html += tabs(chains.map((x) => ({ v: base + '内部流程/' + x.id, text: x.title, on: x === ch })), 'l2') + (ch ? chainView(ch) : '<p class="sub">还没有内部流程。</p>')
  } else if (tab === '工作流程') {
    const w = wfs.find((x) => x.id === a0) ?? wfs[0]
    html += tabs(wfs.map((x) => ({ v: base + '工作流程/' + x.id, text: x.title, on: x === w })), 'l2')
      + (w ? `<div class="diagram wf">${drawStates(w)}</div>${w.note ? `<p class="sub" style="margin-top:8px">${esc(w.note)}</p>` : ''}` : '<p class="sub">还没有工作流程。</p>')
  } else {
    html += asks.length ? asks.map((q) => askView(id, q)).join('') : '<p class="sub">没有待定。</p>'
  }
  main.innerHTML = html
}
// 业务概述：五个页签一次看一栏；收起没收起、看的是哪一栏，记在内存和本机，换主题以后照旧
const INTRO_TABS = [['duty', '模块职责'], ['users', '使用角色'], ['usual', '典型流程']]
const INTRO_KEY = 'dev-team-lite/业务/业务概述'
const introState = (() => { try { return JSON.parse(localStorage.getItem(INTRO_KEY)) ?? {} } catch { return {} } })()
function introSet(patch) { Object.assign(introState, patch); try { localStorage.setItem(INTRO_KEY, JSON.stringify(introState)) } catch {} render() }
function introView(it) {
  if (!it) return ''
  const shut = !!introState.shut, tab = INTRO_TABS.some(([k]) => k === introState.tab) ? introState.tab : 'duty'
  const v = it[tab], none = '<span class="none">还没写。</span>'
  const body = tab === 'concepts' ? (v?.length ? `<ul>${v.map((c) => `<li><b>${esc(c.title)}</b>：${esc(c.note ?? '')}</li>`).join('')}</ul>` : none)

/** 一项功能：左边操作意图和要用到的数据，中间业务数据从什么变成什么，右边顺带留下的；动作只是箭头上一行灰字 */
/** 核心数据：每一站是一样数据，线上是把前一样变成后一样的那件业务；来路从左边汇进来，去处在右边；状态只在站底下带一行小字（从工作流程取）。
 *  有几样核心数据就排成页签，一次看一样；图上的一站本身是另一样核心数据的，那个框能点，点了切过去 */
const coreTab = {}
const OPS = { 创建: 'new', 更新: 'upd', 删除: 'del' }
const opTag = (op) => (OPS[op] ? `<u class="op ${OPS[op]}">${esc(op)}</u>` : '')
/** 全局图上面：整个上下文的背景，和每个主题的业务目的（从各主题的模块业务里取） */
function cxFrame() {
  const any = MAP.topics.some((t) => (MODULES[t.id]?.purposes ?? []).length)
  if (!MAP.background && !any) return ''
  const rows = MAP.topics.map((t) => { const ps = MODULES[t.id]?.purposes ?? []; return `<tr><td><a href="#module/${esc(t.id)}">${esc(t.title)}</a></td><td>${ps.length ? ps.map((p) => `<div>${esc(p.text ?? '')}</div>`).join('') : '<span class="none">业务目的还没写</span>'}</td></tr>` }).join('')
  return `<div class="fr">${MAP.background ? `<div class="fh">背景</div><div class="fbg">${esc(MAP.background)}</div>` : ''}<div class="fh${MAP.background ? ' gap' : ''}">每个主题的业务目的</div><table class="ftp">${rows}</table></div>`
}
/** 主题页最上面的四段：背景 → 核心数据和概念 → 业务目的 → 具体的需求（落到哪样核心数据、哪项功能上）。
 *  业务目的没写出处的标「推出来的，等你确认」；没有需求落到它上面的核心数据在最下面列一行，指到待定 */
function frameView(m, id) {
  const it = m.intro ?? {}, cores = m.core ?? [], ps = m.purposes ?? [], groups = m.groups ?? [], key = context + '/' + id
  const notes = Object.fromEntries((it.concepts ?? []).map((c) => [c.title, c.note ?? '']))
  const names = [...cores.map((c) => c.title), ...Object.keys(notes).filter((k) => !cores.some((c) => c.title === k))].filter(Boolean)
  if (!it.context && !names.length && !ps.length) return ''
  const fnAt = (k) => { for (let gi = 0; gi < groups.length; gi++) { const f = (groups[gi].functions ?? []).find((x) => x.id === k); if (f) return { f, href: '#module/' + id + '/功能/' + (gi + 1) + '/' + k } } return null }
  // 核心数据的标签实心、能点，点了看板切到那一样；别的数据空心
  const chip = (t) => { const i = cores.findIndex((c) => c.title === t); return i >= 0 ? `<a class="fc" href="#module/${esc(id)}" data-core-tab="${i}" data-core-key="${esc(key)}">${esc(t)}</a>` : `<span class="fd">${esc(t)}</span>` }

  const landed = new Set(ps.flatMap((p) => (p.needs ?? []).flatMap((n) => n.cores ?? [])))
  const loose = ps.length ? cores.filter((c) => !landed.has(c.title)).map((c) => c.title) : []
  return `<div class="fr">${it.context ? `<div class="fh">背景</div><div class="fbg">${esc(it.context)}</div>` : ''}
    ${names.length ? `<div class="fh${it.context ? ' gap' : ''}">核心数据和概念</div>${names.map((t) => `<div class="fk">${chip(t)}<span>${esc(notes[t] ?? '')}</span></div>`).join('')}` : ''}
    <div class="fh gap">业务目的 <span>背景里藏着的要求</span>　具体的需求 <span>落到哪样核心数据、哪项功能上</span></div>${purposes || '<div class="none">业务目的还没写。</div>'}
    ${loose.length ? `<div class="fl">还没有需求落到它上面的核心数据：${loose.map(esc).join('、')}。它是为了什么，见<a href="#module/${esc(id)}/待定">待定</a>。</div>` : ''}</div>`
}
/** 功能上：操作意图下面列出这项功能对着的具体的需求；没有就不列 */
function fnFor(f, m) {
  const hit = (m?.purposes ?? []).flatMap((p) => p.needs ?? []).filter((n) => (n.fns ?? []).includes(f.id))
  return hit.map((n) => `<div class="fup"><i>对着的需求</i>${esc(n.text ?? '')}</div>`).join('')
}
function coreFlow(m, id) {
  const cores = m.core ?? []

  const sw = (i) => `data-core-tab="${i}" data-core-key="${esc(key)}"`

  const d = (title, kind, cls) => {

    return `<div class="dw"><div class="d ${cls}${oi >= 0 ? ' go' : ''}"${oi >= 0 ? ' ' + sw(oi) : ''}>${oi >= 0 ? '<i>也是核心数据 ›</i>' : kind ? `<i>${esc(kind)}</i>` : ''}<b>${esc(title ?? '')}</b></div></div>`
  }
  // 线上：做了什么（创建、更新、删除）标在那句话前面
  const e = (x) => { const at = x.fn ? fnAt(x.fn) : null; return `<div class="e"><span>${opTag(x.op)}${esc(x.by ?? '')}${at ? `<a href="${esc(at.href)}">${esc(x.fn)} ${esc(at.f.title)}</a>` : x.topic ? `<em>${esc(x.topic)}</em>` : ''}</span></div>` }
  const tip = '<div class="tip"></div>'
  // 看板只画把它新建出来的来路；旧数据里标着 change 的（改动已有数据的）不画

/** 内部流程：从左到右一个个数据变化框，箭头上是条件 */
function chainView(ch) {

/** 工作流程：状态排一排，往后走的线在上面拱过去、往回的在下面，挨着的两个直着连；线上一行字 */
function drawStates(w) {
  const st = w.states ?? [], idx = Object.fromEntries(st.map((x, i) => [x.id, i]))
  const BW = Math.max(110, ...st.map((x) => Math.max(textW(x.title) * 13 / 12, x.called ? textW('页面上叫' + x.called) * 11 / 12 : 0) + 28)), BH = 46
  const moves = (w.moves ?? []).filter((m) => idx[m.from] != null && idx[m.to] != null)
  const adj = moves.filter((m) => idx[m.to] - idx[m.from] === 1)
  const GAP = Math.min(240, Math.max(110, ...adj.map((m) => Math.min(220, textW(m.label) * 11.5 / 12 + 24))))
  const X = (i) => 20 + i * (BW + GAP), Y = 140
  let s = MARK, labels = '', boxes = []
  const label = (x, y, t) => { const ls = wrapW(t ?? '', 200, 11.5), lw = Math.max(...ls.map((l) => textW(l) * 11.5 / 12)) + 10, h = ls.length * 15 + 4; boxes.push({ x: x - lw / 2, y: y - h / 2, w: lw, h }); labels += `<g class="ml"><rect x="${x - lw / 2}" y="${y - h / 2}" width="${lw}" height="${h}"/>${ls.map((l, k) => `<text x="${x}" y="${y - h / 2 + 13 + k * 15}">${esc(l)}</text>`).join('')}</g>` }
  const used = {}
  for (const m of moves) {
    const i = idx[m.from], j = idx[m.to], span = Math.abs(j - i)
    if (j - i === 1) {
      const x1 = X(i) + BW, x2 = X(j) - 3
      s += `<path class="mv" d="M ${x1} ${Y} C ${x1 + 30} ${Y - 6}, ${x2 - 30} ${Y - 6}, ${x2} ${Y}" marker-end="url(#a)"/>`
      label((x1 + x2) / 2, Y - 20, m.label)
      continue
    }
    const fwd = j > i, k = (used[(fwd ? 'u' : 'd') + span] = (used[(fwd ? 'u' : 'd') + span] ?? 0) + 1)
    const h = 40 + span * 26 + (k - 1) * 22, sg = fwd ? -1 : 1
    const x1 = X(i) + BW / 2 + (fwd ? 12 : -12), x2 = X(j) + BW / 2 + (fwd ? -12 : 12), y0 = Y + sg * BH / 2, y1 = y0 + sg * 3
    s += `<path class="mv" d="M ${x1} ${y0} C ${x1} ${y0 + sg * h}, ${x2} ${y0 + sg * h}, ${x2} ${y1}" marker-end="url(#a)"/>`
    label((x1 + x2) / 2, y0 + sg * h * 0.75, m.label)
  }
  st.forEach((x, i) => { boxes.push({ x: X(i), y: Y - BH / 2, w: BW, h: BH }); s += `<g class="st"><rect x="${X(i)}" y="${Y - BH / 2}" width="${BW}" height="${BH}"/><text x="${X(i) + BW / 2}" y="${Y + (x.called ? -1 : 5)}">${esc(x.title)}</text>${x.called ? `<text class="sub" x="${X(i) + BW / 2}" y="${Y + 14}">页面上叫${esc(x.called)}</text>` : ''}</g>` })
  return canvas(s + labels, boxes, 20, availW())
}
/** 一条待定：没答的红框，带偏向和几个答法，点一个就是答了；答了的灰框写答案 */
function askView(topic, q) {
  if (q.answer) return `<div class="mask done"><div class="q"><span class="mk">${esc(q.id)}</span>${esc(q.q)}</div><div class="ans">答：${esc(q.answer)}${q.answeredAt ? ` <small>（${esc(q.answeredAt)}）</small>` : ''}</div></div>`

  return `<div class="mask pending"><div class="q"><span class="mk">${esc(q.id)} 待定</span>${esc(q.q)}</div>${q.lean ? `<div class="lean">偏向：${esc(q.lean)}</div>` : ''}<div>${(q.options ?? []).map((o, i) => btn(o, i === 0)).join('')}${btn('另说', false, true)}</div></div>`

/** 答模块业务上的一条待定：工作台上发给后端写回文件、重载；单开时只改内存里的那条、重画 */
function answerModule(d) {
  const text = d.other ? (typeof prompt === 'function' ? prompt('另说：') : '') : d.opt
  if (!text) return
  const item = (MODULES[d.module]?.asks ?? []).find((a) => a.id === d.ask)
  if (LIVE) return post('答', { module: d.module, context, ask: d.ask, text, sig: item?.sig })
  if (!item) return
  item.answer = text; item.answeredAt = new Date().toISOString().slice(0, 10)

// ---------- 上下文地图 ----------
// 上下文排一排，框高跟着「管什么」那句撑开、字不截。
// 相邻两个上下文之间的来往一条一条横线，间距 30（卡高 22，上下至少留 8）：事件在上、查询在下，同类里先排往右的；
// 每条线一张卡，放在自己那条线正中；两个框之间的横向距离按最宽的卡放宽，卡两边还看得见线和箭头。
// 框高至少盖住所有线的出入点。隔着别的上下文的线从框顶上绕过去，一条一层。整张比主区宽就等比缩，不截、不横滚
function drawCxMap() {
  const CW = 240, X0 = 30, LH = 30, PADV = 22, n = PROJECT.contexts.length
  const idx = {}
  PROJECT.contexts.forEach((p, i) => { idx[p.id] = i })
  const cardW = (e) => Math.ceil(36 + textW(e.name) * 11.5 / 12 + 12)
  const sortLines = (list) => list.map((e, i) => ({ e, i })).sort((p, q) => (p.e.kind === '事件' ? 0 : 1) - (q.e.kind === '事件' ? 0 : 1) || idx[p.e.from] - idx[q.e.from] || p.i - q.i).map((x) => x.e)
  const pairs = {}, far = []
  for (const e of EDGES) {
    if (idx[e.from] == null || idx[e.to] == null || e.from === e.to) continue
    const lo = Math.min(idx[e.from], idx[e.to]), hi = Math.max(idx[e.from], idx[e.to])
    if (hi - lo === 1) (pairs[lo] ??= []).push(e); else far.push(e)
  }
  for (const k of Object.keys(pairs)) pairs[k] = sortLines(pairs[k])
  // 框：名字一行，「管什么」照框宽折行全写上
  const roleLines = Object.fromEntries(PROJECT.contexts.map((p) => [p.id, wrapW(p.role, CW - 28, 11.5)]))
  const textH = Math.max(...PROJECT.contexts.map((p) => 50 + roleLines[p.id].length * 16))
  const most = Math.max(0, ...Object.values(pairs).map((l) => l.length))
  const CH = Math.max(86, textH, most ? PADV * 2 + (most - 1) * LH : 0)
  const gapOf = (i) => Math.max(160, ...(pairs[i] ?? []).map((e) => cardW(e) + 80))
  const xs = []
  PROJECT.contexts.forEach((p, i) => { xs[i] = i ? xs[i - 1] + CW + gapOf(i - 1) : X0 })
  const Y0 = 30 + (far.length ? far.length * LH + 20 : 0)
  const pos = {}
  PROJECT.contexts.forEach((p, i) => { pos[p.id] = { x: xs[i], y: Y0 } })
  let s = `<defs><marker id="cxa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2)"/></marker></defs>`, labels = ''
  const card = (e, mx, my) => {
    const lw = cardW(e), lh = 22
    return `<g class="lb"><g class="${e.kind === '事件' ? 'evt' : 'qry'}"><rect x="${mx - lw / 2}" y="${my - lh / 2}" width="${lw}" height="${lh}" rx="4"/><text class="k" x="${mx - lw / 2 + 8}" y="${my + 4}">${esc(e.kind)}</text><text x="${mx - lw / 2 + 36}" y="${my + 4}">${esc(e.name)}</text></g></g>`
  }
  // 相邻的：在两个框之间、框高里竖着居中排开
  for (const [k, list] of Object.entries(pairs)) {
    const L = PROJECT.contexts[+k].id, R = PROJECT.contexts[+k + 1].id
    const xl = pos[L].x + CW, xr = pos[R].x, top = Y0 + (CH - (list.length - 1) * LH) / 2
    list.forEach((e, i) => {
      const y = top + i * LH, rightward = e.from === L
      const x1 = rightward ? xl : xr, x2 = rightward ? xr - 2 : xl + 2
      s += `<g class="ed"><path d="M ${x1} ${y} L ${x2} ${y}" marker-end="url(#cxa)"/></g>`
      labels += card(e, (xl + xr) / 2, y)
    })
  }
  // 隔着别的上下文的：从框顶上出去、横着走一层、再下到对面框顶；一条一层
  far.forEach((e, k) => {
    const a = pos[e.from], b = pos[e.to], y = Y0 - 20 - k * LH
    const ax = a.x + CW / 2 + (b.x > a.x ? 1 : -1) * (30 + k * 14), bx = b.x + CW / 2 + (b.x > a.x ? -1 : 1) * (30 + k * 14)
    s += `<g class="ed"><path d="M ${ax} ${Y0} L ${ax} ${y} L ${bx} ${y} L ${bx} ${Y0 - 2}" marker-end="url(#cxa)"/></g>`
    labels += card(e, (ax + bx) / 2, y)
  })
  for (const p of PROJECT.contexts) {
    const q = pos[p.id]
    s += `<g class="sp${selected === p.id ? ' sel' : ''}" data-cx="${p.id}"><rect x="${q.x}" y="${q.y}" width="${CW}" height="${CH}" style="fill:var(--c${p.c});stroke:var(--c${p.c}l)"/>
      <text class="n" x="${q.x + 14}" y="${q.y + 28}">${esc(p.name)}</text>
      ${roleLines[p.id].map((ln, i) => `<text class="d" x="${q.x + 14}" y="${q.y + 50 + i * 16}">${esc(ln)}</text>`).join('')}</g>`
  }
  // 共享内核：底下一条虚线框，每个上下文一条虚线下去，线上写用了哪几个概念
  const K = { x: X0 + CW / 2, y: Y0 + CH + 110, w: Math.max(CW, xs[n - 1] - X0), h: 44 }
  s += `<g class="kn${selected === 'kernel' ? ' sel' : ''}" data-cx="kernel"><rect x="${K.x}" y="${K.y}" width="${K.w}" height="${K.h}" rx="8"/><text class="n" x="${K.x + 14}" y="${K.y + 20}">共享内核</text><text class="d" x="${K.x + 14}" y="${K.y + 36}">${esc(PROJECT.kernel.concepts.join('、'))}</text></g>`
  for (const p of PROJECT.contexts) {
    const q = pos[p.id], cx = q.x + CW / 2, y1 = q.y + CH, y2 = K.y - 2
    s += `<g class="kd"><path d="M ${cx} ${y1} L ${cx} ${y2}"/></g>`
    const used = USES[p.id] ?? [], t = used.length ? '用 ' + used.join('、') : '还没用', lw = Math.ceil(textW(t) * 11.5 / 12 + 16), my = (y1 + y2) / 2
    labels += `<g class="lb"><g class="use"><rect x="${cx - lw / 2}" y="${my - 11}" width="${lw}" height="22" rx="4"/><text x="${cx - lw / 2 + 8}" y="${my + 4}">${esc(t)}</text></g></g>`
  }
  const w = Math.ceil(Math.max(xs[n - 1] + CW + X0, K.x + K.w + X0)), h = K.y + K.h + 24, avail = availW()
  const size = w > avail ? `width="${Math.floor(avail)}" height="${Math.ceil(h * avail / w)}"` : `width="${w}" height="${h}"`
  return `<svg ${size} viewBox="0 0 ${w} ${h}">${s}${labels}</svg>`
}

  }
  if (context === '共享内核' || !BIZ[context]) {
    main.innerHTML = `<h1><span class="kind">上下文</span><span class="sep">›</span>${esc(context)}</h1><p class="sub">${context === '共享内核' ? '几个上下文都用的概念只在这里写一遍，各上下文的概念图引它：' + esc(PROJECT.kernel.concepts.join('、')) + '。' : `还没画。这个上下文的业务还没整理；业务的每一步都带着在哪个上下文做，产物落 上下文/${esc(context)}/业务/。`}</p>`
    return
  }
  // 地址里的主题号、流程名在这个上下文里没有：说一句，不抛错
  const missing = (what) => { main.innerHTML = `<h1><a href="#map">全局图</a><span class="sep">›</span>${esc(id)}</h1><p class="sub">${esc(context)} 里没有${what} ${esc(id)}。</p>` }
  // 概念带的对照表：按几类人或几种情形逐行对照，画在概念图下面，窄了横着滚
  const tableOf = (n) => `<div class="ctbl" data-n="${esc(n.id)}"><h3>${esc(n.title)}</h3><p class="def">${esc(n.definition)}</p>
      <div class="wrap"><table><thead><tr>${n.table.columns.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${(n.table.rows ?? []).map((r) => `<tr>${n.table.columns.map((_, i) => `<td>${esc(r[i] ?? '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      ${n.source ? `<div class="src">出处：${esc(n.source)}</div>` : ''}</div>`
  if (kind === 'concepts') {
    const t = grpOf[id], top = CONCEPTS[id]
    if (!t) return missing('主题')
    const subs = top?.subs
    // 分了子主题、地址里没写子主题：画子主题图，画法照全局图，颜色用这个主题的
    if (subs && !subId) {
      main.innerHTML = `<h1><a href="#map">全局图</a><span class="sep">›</span>${esc(t.title)} <span class="kind">· ${subs.length} 个子主题</span></h1>
      <p class="sub">${esc(top.summary ?? '')}</p>
      ${subs.length ? `<div class="diagram">${drawTop({ topics: subs.map((x) => ({ ...x, c: x.c ?? t.c, does: x.does ?? [], concepts: x.concepts ?? [] })), edges: top.edges ?? [] })}</div>` : '<p class="sub">子主题还没分。</p>'}`
      return
    }
    const x = subs && subs.find((y) => y.id === subId)
    if (subId && !x) { main.innerHTML = `<h1><a href="#map">全局图</a><span class="sep">›</span><a href="#concepts/${esc(id)}">${esc(t.title)}</a><span class="sep">›</span>${esc(subId)}</h1><p class="sub">${esc(t.title)} 里没有子主题 ${esc(subId)}。</p>`; return }
    const c = x ? CONCEPTS[id + '/' + x.id] : top
    const h1 = x ? `<h1><a href="#map">全局图</a><span class="sep">›</span><a href="#concepts/${esc(id)}">${esc(t.title)}</a><span class="sep">›</span>${esc(x.title)}</h1>`
      : `<h1><a href="#map">全局图</a><span class="sep">›</span>${esc(t.title)}</h1>`
    if (!c) { main.innerHTML = `${h1}<p class="sub">还没写。</p>`; return }
    const sel = (c.concepts ?? []).find((n) => n.id === selected)
    main.innerHTML = `${h1}
      <p class="sub">${esc(c.summary)}</p>
      <div class="row"><div class="diagram">${drawLocal(x ? { ...x, c: t.c } : t, c)}</div>${sel ? `<div class="side"><b>${esc(sel.title)}</b>${esc(sel.definition)}<div class="src">出处：${esc(sel.source)}</div></div>` : ''}</div>
      <div class="legend">${LEG.role}${LEG.data}${LEG.stub}</div>
      ${(c.concepts ?? []).filter((n) => n.table?.columns?.length).map(tableOf).join('')}`
  } else if (kind === 'module') {
    renderModule(main, ...view.split('/').slice(1))
  } else if (kind === 'flow') {
    const f = FLOWS.find((x) => x.file === id)
    if (!f) return missing('流程')
    const tps = flowTopics(f)
    main.innerHTML = `<h1>${esc(f.title)}</h1>
      ${tps.length ? `<div class="ftopics">${tps.map((id) => { const t = grpOf[id]; return `<a href="#concepts/${esc(id)}" class="${id === f.topic ? 'own' : ''}" style="background:var(--c${t.c});border-color:var(--c${t.c}l)">${esc(t.title)}</a>` }).join('')}</div>` : ''}
      <p class="sub">${esc(f.summary)}</p>
      ${f.locked ? `<p class="lock">${esc(f.locked.role)}正在改这份流程（${esc(f.locked.step)}）。等它交回再答上面的问题：现在答的会被它写回去时盖掉。</p>` : ''}
      <div class="diagram flowbox">${drawFlow(f)}</div>
      <div class="legend">${LEG.role}${LEG.fdata}${LEG.note}${LEG.qa}${LEG.frame}</div>`
  } else {
    main.innerHTML = MAP.topics.length ? `<h1>全局图 <span class="kind">· ${esc(context)}</span></h1>
      ${cxFrame()}<div class="diagram">${drawTop()}</div>` : `<h1>全局图 <span class="kind">· ${esc(context)}</span></h1><p class="sub">全局图还没画。</p>`
  }
}
// go 在上面：补上上下文写进地址，hashchange 再 render

// ---------- 指着、点 ----------
function bind() {
  const main = document.getElementById('main'), pop = document.getElementById('detail')
  const show = (html, x, y) => {
    pop.innerHTML = html; pop.hidden = false
    let px = x + 16; if (px + pop.offsetWidth > innerWidth - 8) px = x - pop.offsetWidth - 16
    pop.style.left = Math.max(8, px) + 'px'; pop.style.top = Math.max(8, Math.min(y - 20, innerHeight - pop.offsetHeight - 8)) + 'px'
  }
  main.addEventListener('mousemove', (ev) => {
    const [kind, vid, vsub] = view.split('/')
    const ed = ev.target.closest('.ed[data-t]')
    if (kind === 'concepts' && !vsub && subsOf(vid) && ed) {
      const [a, b] = ed.dataset.t.split('>'), items = fineSubEdges(vid, a, b), sa = subsOf(vid).find((x) => x.id === a), sb = subsOf(vid).find((x) => x.id === b)
      if (items.length) { show(`<h4>${esc(sa?.title ?? a)} ↔ ${esc(sb?.title ?? b)}</h4>` + items.map((t) => `<div>${esc(t)}</div>`).join(''), ev.clientX, ev.clientY); return }
    }
    if (kind === 'map' && ed) {
      const [a, b] = ed.dataset.t.split('>'), items = fineEdges(a, b)
      if (items.length) { show(`<h4>${esc(grpOf[a].title)} ↔ ${esc(grpOf[b].title)}</h4>` + items.map((t) => `<div>${esc(t)}</div>`).join(''), ev.clientX, ev.clientY); return }
    }
    const st = ev.target.closest('.msg,.self')
    if (kind === 'flow' && st) {
      const f = FLOWS.find((x) => x.file === view.split('/')[1]), p = f.steps.find((x) => String(x.id) === st.dataset.id)
      const who = (i) => f.parties.find((x) => x.id === i).title
      show(`<h4>${esc(p.id)}. ${esc(p.title)}</h4><div>${esc(who(p.from))}${p.from !== p.to ? ' → ' + esc(who(p.to)) : ''}</div>${p.date ? `<div>例子 ${esc(p.date)}</div>` : ''}${p.due ? `<div>期限 ${esc(p.due)}</div>` : ''}${p.source ? `<div>出处 ${esc(p.source)}</div>` : ''}<div>编号 ${esc(f.title.split('：')[0])} #${esc(p.id)}</div>`, ev.clientX, ev.clientY)
      return
    }
    pop.hidden = true
  })
  main.addEventListener('mouseleave', () => { pop.hidden = true })
  main.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.qa .btn')
    if (btn) { answerQa(btn.dataset); return }
    const mb = ev.target.closest('.mbtn')
    if (mb) { answerModule(mb.dataset); return }
    const ct = ev.target.closest('[data-core-tab]')
    if (ct) { coreTab[ct.dataset.coreKey] = +ct.dataset.coreTab; render(); return }
    const ih = ev.target.closest('[data-intro-shut]'), itab = ev.target.closest('[data-intro-tab]')
    if (ih) { introSet({ shut: ih.dataset.introShut === '1' }); return }
    if (itab) { introSet({ tab: itab.dataset.introTab }); return }
    const tog = ev.target.closest('.qa .tog')
    if (tog) { toggleSide(tog.dataset); return }
    if (ev.target.closest('a[href]')) return
    const cxEl = ev.target.closest('.cxmap [data-cx]')
    if (cxEl) { selected = selected === cxEl.dataset.cx ? null : cxEl.dataset.cx; render(); return }
    const tp = ev.target.closest('.tp'), stub = ev.target.closest('.stub'), nd = ev.target.closest('.nd')
    if (tp) { const [k, v] = view.split('/'); go(k === 'concepts' && subsOf(v) ? 'concepts/' + v + '/' + tp.dataset.g : 'concepts/' + tp.dataset.g); return }
    if (stub) { openStub(stub.dataset); return }
    if (nd) { selected = selected === nd.dataset.n ? null : nd.dataset.n; render() }
  })
  bindContexts('map')
}
;({ cx: context, v: view } = parseHash('map')); Shell.show(context)
render(); bind()
</script>
