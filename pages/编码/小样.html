<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台 · 编码</title>
<style>
:root{
  --bg:#f7f6f3; --panel:#ffffff; --ink:#1d1d1b; --ink-2:#55534e; --ink-3:#8a877f; --line:#dedbd3; --accent:#2563eb; --accent-bg:#e8efff;
  --role:#e3edff; --role-line:#2f5fc4; --data:#e7f5ec; --data-line:#2f855a; --area:#f4f4f1; --area-line:#b8b5ad;
  --badge:#fff3cd; --badge-ink:#7a5200; --badge-line:#f0d58c; --red:#cf222e;
  --cmd:#fdeee0; --cmd-line:#c2410c; --evt:#fdf6d5; --evt-line:#b45309; --svc:#f1ebfd; --svc-line:#7c3aed; --hdl:#e3f6f8; --hdl-line:#0891b2;
  /* 四种状态：未写 灰空心、已写 蓝、有测试 黄、跑过 绿 */
  --s0:transparent; --s0l:#b8b5ad; --s1:#dbe7ff; --s1l:#2563eb; --s2:#fdf6d5; --s2l:#b45309; --s3:#e7f5ec; --s3l:#2f855a;
  --code:#f4f4f1; --kw:#7c3aed; --str:#2f855a; --cm:#8a877f;
  /* 全局结构：一个上下文一种颜色（线色、底色），用的人沙色 */
  --g0:#3e6b34; --g0s:#e6efe2; --g1:#3f5f8a; --g1s:#e4ebf4; --g2:#b0642c; --g2s:#f6e9db; --g3:#6b4fa0; --g3s:#ece6f6; --gu:#efe8da;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#18181a; --panel:#222225; --ink:#ecebe7; --ink-2:#b5b2ab; --ink-3:#85827b; --line:#3a3a3e; --accent:#7aa2ff; --accent-bg:#26314d;
    --role:#243352; --role-line:#7aa2ff; --data:#1f3327; --data-line:#4ade80; --area:#1d1d20; --area-line:#4a4a50;
    --badge:#3a3220; --badge-ink:#fbbf24; --badge-line:#6b5f2e; --red:#ff6b6b;
    --cmd:#3a2a1c; --cmd-line:#fb923c; --evt:#3a3220; --evt-line:#fbbf24; --svc:#2d2342; --svc-line:#c4b5fd; --hdl:#1b3337; --hdl-line:#67e8f9;
    --s0:transparent; --s0l:#4a4a50; --s1:#1f2a44; --s1l:#7aa2ff; --s2:#3a3220; --s2l:#fbbf24; --s3:#1f3327; --s3l:#4ade80;
    --code:#1d1d20; --kw:#c4b5fd; --str:#4ade80; --cm:#85827b;
    --g0:#8db97f; --g0s:#2a3a26; --g1:#8fb0dc; --g1s:#273242; --g2:#d9985f; --g2s:#3d2d20; --g3:#b9a3e3; --g3s:#2f2840; --gu:#2f2c25;
  }
}
h1{font-size:22px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
h1 .sep{color:var(--ink-3);font-weight:400;font-size:16px}
h1 .kind{color:var(--ink-3);font-weight:400;font-size:14px}
h1 a.up{color:var(--ink-2);text-decoration:none}
.badge{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--badge);color:var(--badge-ink);border:1px solid var(--badge-line);font-weight:400}
.sub{color:var(--ink-2);margin:0 0 12px;max-width:960px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:12px}
.cap{font-size:12px;color:var(--ink-3);letter-spacing:1px;margin-bottom:6px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--ink-2);margin:10px 0 0}
.legend .sw{display:inline-block;width:18px;height:12px;border:1px solid;border-radius:2px;vertical-align:middle;margin-right:5px}
/* 状态点：四档 */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--s0l);background:var(--s0);flex:none}
.dot.s1{background:var(--s1l);border-color:var(--s1l)}
.dot.s2{background:var(--s2l);border-color:var(--s2l)}
.dot.s3{background:var(--s3l);border-color:var(--s3l)}
.st{font-size:11.5px;padding:0 7px;border-radius:3px;border:1px solid var(--s0l);color:var(--ink-2);white-space:nowrap}
.st.s1{background:var(--s1);border-color:var(--s1l)}
.st.s2{background:var(--s2);border-color:var(--s2l)}
.st.s3{background:var(--s3);border-color:var(--s3l)}
/* 代码结构：目录树 */
.tree{font:13px/1.6 ui-monospace,Menlo,Consolas,monospace}
.tree .cnt{font:12px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink-3);padding:0 6px 6px}
.tree .dr{display:flex;align-items:baseline;gap:4px;padding:1px 6px 1px calc(var(--d) * 14px + 6px);border-radius:4px;cursor:pointer;color:var(--ink-2);user-select:none}
.tree .dr:hover{background:var(--accent-bg)}
.tree .dr .tri{flex:none;width:12px;font-size:11px;color:var(--ink-3)}
.tree .dr .n{min-width:0;overflow-wrap:anywhere}
.tree .dr .c{flex:none;margin-left:auto;padding-left:8px;font:11px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink-3)}
.tree .f{display:block;padding:2px 6px 2px calc(var(--d) * 14px + 22px);border-radius:4px;cursor:pointer}
.tree .f:hover{background:var(--accent-bg)}
.tree .f.on{background:var(--accent-bg)}
.tree .f .p{display:block;word-break:break-all}
.tree .f .m{display:block;font:11.5px/1.4 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink-3)}
.tree .f .m .k{margin-right:6px}
.tree .f.none .p{color:var(--ink-3)}
/* 树栏：跟着页面停在上面，高度不超过一屏，超出在栏里滚 */
.row2>.l.tree-col{width:400px;position:sticky;top:0;transition:width .18s ease}
/* 树栏像侧边导航一样整栏收起：收起后只剩一条窄边，点它再展开 */
.row2>.l.tree-col.hide{width:32px}
.tree-col.hide .tree-box{display:none}
.tree-col .rail{display:none}
.tree-col.hide .rail{display:flex;flex-direction:column;align-items:center;gap:8px;width:32px;box-sizing:border-box;padding:10px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink-2);font:12px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer}
.tree-col .rail:hover{border-color:var(--accent);color:var(--accent)}
.tree-col .rail .w{writing-mode:vertical-rl;letter-spacing:2px}
.tree .cnt{display:flex;align-items:center}
.tree .cnt .tree-hide{margin-left:auto;border:1px solid var(--line);background:none;color:var(--ink-3);border-radius:4px;font-size:11px;line-height:1;padding:3px 6px;cursor:pointer}
.tree .cnt .tree-hide:hover{color:var(--accent);border-color:var(--accent)}
.tree-col .tree-box{position:relative;max-height:calc(100vh - 190px);overflow:auto;padding:10px 8px;margin-bottom:0}
.row2>.r .card{margin-bottom:0}
.tree .f .m b{font-weight:600;color:var(--ink)}
/* 模型一条 → 代码 */
.files{display:grid;grid-template-columns:1fr;gap:6px}
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
.file:hover,.file.on{border-color:var(--accent);background:var(--accent-bg)}
.file code{font:12.5px ui-monospace,Menlo,Consolas,monospace}
.file .k{color:var(--ink-3);font-size:12px}
.file .st{margin-left:auto}
pre.code{margin:0;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;overflow:auto;white-space:pre}
pre.code .kw{color:var(--kw)}pre.code .str{color:var(--str)}pre.code .cm{color:var(--cm)}
pre.code .hl{background:var(--accent-bg);display:inline-block;width:100%}
.row2{display:flex;gap:16px;align-items:flex-start}
.row2>.l{width:380px;flex:none}
.row2>.r{flex:1;min-width:0}
table.t{border-collapse:collapse;font-size:13px;width:100%}
table.t td{padding:4px 12px 4px 0;border-top:1px solid var(--line);vertical-align:top}
table.t tr:first-child td{border-top:0}
table.t td.n{font-weight:600;white-space:nowrap}
table.t td.x{color:var(--ink-3)}
table.t tr.hd td{color:var(--ink-3);font-size:12px;border-top:0;white-space:nowrap}
/* 走通一段：一步一行，四个格子各自点亮 */
.walk{display:grid;grid-template-columns:28px 1fr 1fr 1fr 1fr;gap:8px 12px;align-items:stretch;font-size:13px}
.walk .h{color:var(--ink-3);font-size:12px}
.walk .n{color:var(--ink-3);font-size:12px;padding-top:8px}
.walk .cell{border:1px solid var(--line);border-radius:6px;padding:6px 10px;display:flex;align-items:center;gap:8px;min-height:38px}
.walk .cell.cmd{background:var(--cmd);border-color:var(--cmd-line)}
.walk .cell.qry{background:var(--cmd);border-color:var(--cmd-line);border-style:dashed}
.walk .cell.hdl{background:var(--hdl);border-color:var(--hdl-line)}
.walk .cell.svc{background:var(--svc);border-color:var(--svc-line)}
.walk .cell.agg{background:var(--data);border-color:var(--data-line)}
.walk .cell.evt{background:var(--evt);border-color:var(--evt-line)}
.walk .cell .st{margin-left:auto}
.walk .cell.none{border-style:dashed;color:var(--ink-3);background:transparent}
.walk .cell small{color:var(--ink-3);font-size:11px}
.done{display:inline-block;font-size:12px;padding:1px 8px;border-radius:9px;background:var(--s3);border:1px solid var(--s3l);color:var(--ink)}
.todo{display:inline-block;font-size:12px;padding:1px 8px;border-radius:9px;background:var(--badge);border:1px solid var(--badge-line);color:var(--badge-ink)}
p.none{color:var(--ink-3);margin:0}
/* 规范页：模板挑一份，右边是定下的那份 */
svg.arch{display:block;max-width:100%;height:auto}
/* 一行：文件名在它的缩进上；种类、导出、说明跟在后面，放不下就整块折到下一行，比文件名再缩 4 格（悬挂缩进），说明自己也折行，不出卡片 */
pre.tree-sample{margin:0;white-space:normal;overflow:visible;font-size:14px}
pre.tree-sample .ln{position:relative;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;padding-left:calc(var(--ind) * 1.5 + 4ch)}
pre.tree-sample .g{position:absolute;top:0;bottom:0;left:calc(var(--k) * 3ch + 1ch);border-left:1px solid var(--ink-3)}
pre.tree-sample .g.end{bottom:auto;height:.8em}
pre.tree-sample .g.tee::after,pre.tree-sample .g.end::after{content:'';position:absolute;left:0;top:.8em;width:1.6ch;border-top:1px solid var(--ink-3)}
pre.tree-sample .p{margin-left:-4ch;min-width:0;overflow-wrap:anywhere}
pre.tree-sample .mt{flex:1 1 240px;min-width:0;overflow-wrap:anywhere}
pre.tree-sample .mt>span{margin-right:8px}
pre.tree-sample .lay{font-size:12px;padding:0 6px;border-radius:8px;border:1px solid var(--line);color:var(--ink-2);font-family:inherit;white-space:nowrap}
pre.tree-sample .ex{font-size:13px;color:var(--ink-2)}
pre.tree-sample .nt{font-size:13px;color:var(--ink-3)}
/* 结构图：照文件结构画的 SVG。框分两种：容器（src/、modules/、模块、infras/、events/）只是围起来，线可以穿过它的边；里面的格子是叶子，线只能连到它的边上 */
svg.struct{display:block;max-width:100%;height:auto}
svg.struct text{fill:var(--ink);font:13px system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
svg.struct text.tt{font:600 14px ui-monospace,Menlo,Consolas,monospace}
svg.struct text.mo{font:13px ui-monospace,Menlo,Consolas,monospace}
svg.struct text.fl{font:12px ui-monospace,Menlo,Consolas,monospace;fill:var(--ink-2)}
svg.struct text.ho,svg.struct text.sm,svg.struct text.tag{fill:var(--ink-2)}
svg.struct text.sm,svg.struct text.tag,svg.struct text.lt{font-size:12px}
svg.struct text.mt{font-weight:600;font-size:14px}
svg.struct rect.fr{fill:none;stroke:var(--ink-3);stroke-width:1.3}
svg.struct rect.fr.ctx{stroke:var(--area-line);stroke-dasharray:5 4}
svg.struct rect.fr.mod,svg.struct rect.fr.ev{fill:var(--panel)}
svg.struct rect.b{fill:var(--panel);stroke:var(--line)}
svg.struct rect.b.boot{fill:var(--badge);stroke:var(--badge-line)}
svg.struct rect.b.bus{fill:var(--evt);stroke:var(--evt-line);stroke-width:1.3}
svg.struct rect.b.rest{fill:none;stroke:var(--ink-3);stroke-dasharray:5 4}
svg.struct rect.b.out{fill:none;stroke:var(--area-line);stroke-dasharray:5 4;stroke-width:1.3}
svg.struct path.e{fill:none;stroke:var(--ink-2);stroke-width:1.3}
svg.struct path.e.x{stroke-dasharray:5 4}
svg.struct rect.lb{fill:var(--panel);stroke:var(--line)}
.notes{font-size:13px;color:var(--ink-2);margin:10px 0 0;padding-left:18px}
.notes li{margin:3px 0}
.notes b{color:var(--ink);font-weight:600}
.notes code{font:12.5px ui-monospace,Menlo,Consolas,monospace}
/* 全局结构：整个项目一份 */
svg.glob{display:block;max-width:100%;height:auto}
svg.glob text{fill:var(--ink)}
svg.glob .n rect{stroke-width:1.2}
svg.glob .n.tn rect.b{fill:var(--panel);stroke:var(--ink-3)}
svg.glob .n.tu rect.b{fill:var(--gu);stroke:var(--line)}
svg.glob .n.t0 rect.b{fill:var(--g0s);stroke:var(--g0)} svg.glob .n.t1 rect.b{fill:var(--g1s);stroke:var(--g1)} svg.glob .n.t2 rect.b{fill:var(--g2s);stroke:var(--g2)} svg.glob .n.t3 rect.b{fill:var(--g3s);stroke:var(--g3)}
svg.glob .n.dash rect.b{stroke-dasharray:5 4}
svg.glob .n.dash.tn rect.b{fill:var(--panel);stroke:var(--ink-3)}
svg.glob .n.kid rect.c{fill:var(--panel);stroke:var(--ink-3);stroke-dasharray:4 3}
svg.glob .n.kid.t0 rect.c{fill:var(--g0s);stroke:var(--g0)} svg.glob .n.kid.t1 rect.c{fill:var(--g1s);stroke:var(--g1)} svg.glob .n.kid.t2 rect.c{fill:var(--g2s);stroke:var(--g2)} svg.glob .n.kid.t3 rect.c{fill:var(--g3s);stroke:var(--g3)}
svg.glob .n text.nm{font-weight:700}
svg.glob .n.kid.t0 text.nm{fill:var(--g0)} svg.glob .n.kid.t1 text.nm{fill:var(--g1)} svg.glob .n.kid.t2 text.nm{fill:var(--g2)} svg.glob .n.kid.t3 text.nm{fill:var(--g3)}
svg.glob .n text.ho{fill:var(--ink-2)}
svg.glob .n text.la{fill:var(--badge-ink)}
svg.glob path.e{fill:none;stroke:var(--ink-3);stroke-width:1.4}
svg.glob path.e.t0{stroke:var(--g0)} svg.glob path.e.t1{stroke:var(--g1)} svg.glob path.e.t2{stroke:var(--g2)} svg.glob path.e.t3{stroke:var(--g3)}
svg.glob path.e.dash{stroke-dasharray:5 4}
svg.glob path.mk{fill:var(--ink-3)} svg.glob path.mk.t0{fill:var(--g0)} svg.glob path.mk.t1{fill:var(--g1)} svg.glob path.mk.t2{fill:var(--g2)} svg.glob path.mk.t3{fill:var(--g3)}
svg.glob path.hit{fill:none;stroke:transparent;stroke-width:10}
svg.glob g.eg:hover path.e{stroke-width:2.4}
svg.glob g.n,svg.glob g.el,svg.glob g.eg{cursor:help}
svg.glob rect.lb{fill:var(--panel);opacity:.94}
svg.glob text.lt{font-size:11.5px;fill:var(--ink)}
svg.glob text.rw{font-size:11.5px;fill:var(--ink-3);letter-spacing:.12em}
.glob-legend{margin:0 0 8px}
.glob-legend .sw{width:12px;border-radius:3px;border-color:var(--ink-3)}
.glob-legend .sw.t0{background:var(--g0s);border-color:var(--g0)} .glob-legend .sw.t1{background:var(--g1s);border-color:var(--g1)} .glob-legend .sw.t2{background:var(--g2s);border-color:var(--g2)} .glob-legend .sw.t3{background:var(--g3s);border-color:var(--g3)}
.glob-legend .sw.tu{background:var(--gu);border-color:var(--line)} .glob-legend .sw.dash{border-style:dashed}
.glob-legend .hint{color:var(--ink-3)}
table.qa td.q{font-weight:600;white-space:nowrap;width:1%}
.qa .dflt{font-size:12px;color:var(--ink-3);margin-top:2px}
.ask{font-size:12px;margin-top:4px;padding:4px 8px;border-radius:4px;background:var(--badge);border:1px solid var(--badge-line);color:var(--badge-ink)}
.qa .chip{font-size:11px;color:var(--accent);margin-left:6px}
/* 伪代码：一个方法一块，步骤编号 */
pre.code.ps{font-size:13px;line-height:1.7;white-space:normal}
.ps .ln{white-space:pre-wrap;word-break:break-word;padding-left:var(--ind);text-indent:calc(var(--ind) * -1)}
.psrow{display:flex;gap:12px;align-items:stretch;margin-bottom:12px}
.psrow>pre{flex:1;min-width:0;margin:0}
.psrow>pre.tests{flex:1.1;border-style:dashed}
.psrow>pre.tests.none{color:var(--ink-3)}
/* 软件工程师挂在伪代码块上的问题：红框的卡，跟在它说的那一块下面，底下一排选项 */
.lock{margin:0 0 10px;padding:7px 12px;border:1px solid var(--badge-line);background:var(--badge);color:var(--badge-ink);border-radius:8px}
.asks{margin:-4px 0 14px}
.ask{border:1.2px solid var(--red);background:var(--panel);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.ask + .ask{margin-top:8px}
.ask .wh{font-size:12px;color:var(--ink-3)}
.ask .q{font-size:13.5px;font-weight:600;color:var(--ink)}
.ask .lean{font-size:12.5px;color:var(--ink-2);border-left:3px solid var(--red);padding-left:8px}
.ask .lean b{color:var(--ink)}
.ask .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.ask .opt{font:inherit;font-size:12px;text-align:left;padding:3px 9px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);cursor:pointer}
.ask .opt.b{border-color:var(--accent);color:var(--accent);font-weight:600}
.ask .opt[disabled]{opacity:.5;cursor:default}
i.open{display:inline-block;min-width:8px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--red);color:#fff;font-style:normal;font-size:10.5px;font-weight:600;text-align:center;line-height:16px;vertical-align:1px}
.qlist a{display:block;margin:2px 0}
.ps .g{color:var(--s2l)}.ps .e{color:var(--evt-line)}.ps .w{color:var(--accent)}
.ps .fn{font-weight:700}.ps .kw{color:var(--kw)}.ps .cm{color:var(--cm)}
.ps .tn{color:var(--ink-3)}
</style>

<div class="topbar" id="topbar"></div>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>

<script>
// 工作台起的时候 window.DATA 由 /data/<页>.js 先定义，下面每个常量都先取它；单开这份小样时 DATA 是空的，用写死的
const DATA = (typeof window !== 'undefined' && window.DATA) || {}
const LIVE = Object.keys(DATA).length > 0
const post = (action, body) => fetch('api/' + action, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then((r) => r.json()).then((o) => { if (o.ok) location.reload(); else alert(o.error) })
// 软件工程师这个角色的输出，数据写死在这里。一页：定规范（结构设计、文件命名、技术选型）→ 文件结构＋伪代码；代码照伪代码写，进度归项目管理。各份的形状：
// 1. 代码/结构.json：目录树，一个文件一条，标它对应模型里哪一条——这就是代码与模型的对照
//    { lang, root, files: [{ path, kind, model?: { aggregate?, member?, behaviors?, item?, service?, event? }, tests?: [被测的行为或清单项] }] }
//      kind：聚合根 | 实体 | 值对象 | 事件 | 领域服务 | 命令 | 查询 | 事件处理器 | 仓储接口 | 内存仓储 | 测试 | 入口
//      model 指回模型：aggregate＋member 指成员（根、实体、值对象），item 指清单里的一条，service 指领域服务名，event 指事件名
// 2. 进度不归这里：任务到了哪一步在项目管理的日程里（三个阶段的日期）

}
const chipOf = (layer) => layer ? `<span class="lay" style="background:${LAYER_COLOR[layer] ?? 'var(--panel)'}">${esc(layer)}</span>` : ''

const modsDirOf = (st) => { const ls = (st.sample ?? []).map((r) => r.line.trim()); return ls.some((l) => /^contexts\//.test(l)) && !ls.some((l) => /^modules\//.test(l)) ? 'contexts/' : 'modules/' }

// 箭头是谁依赖谁：模块里照 deps 画层与层；bootstrap → 各模块的 module.ts；module.ts → infras 的总线，adapters/ → infras 的 http；两个示例模块之间一条虚线，后一个经 ports/ 向前一个要东西

    const tests = (b.tests ?? []).map((t) => ln(`<span class="kw">测试</span> <span class="fn">${esc(b.name)}</span> <span class="tn">· ${esc(t.name)}</span>`, 0) + ln('给  ' + esc(t.given), 6) + ln('做  ' + esc(t.when), 6) + ln('断  ' + esc(t.then), 6)).join('<div class="ln">&nbsp;</div>')

  }
  return `<div class="card"><div class="cap">${esc(f?.kind ?? '')} · ${esc(path)}</div><div class="sub" style="font-size:12px;margin:0 0 10px">不带语言和库，步骤到能照着写的粒度：<span class="g">抛</span>、<span class="w">改哪一栏</span>、<span class="e">发什么</span>各一个颜色；左边方法，右边它的测试。</div>
    ${p.locked ? `<p class="lock">${esc(p.locked.role)}正在改这份伪代码（${esc(p.locked.step)}）。等它交回再答这上面的问题：现在答的会被它写回去时盖掉。</p>` : ''}
    ${p.blocks.map(block).join('')}</div>`
}

// ---------- 页面 ----------
const gate = () => `<span class="badge">进度 ${PROGRESS.updatedAt}</span>`
function render() {
  useCx(context)
  Shell.current = context; Shell.nav()
  const main = document.getElementById('main')
  const [kind, ...rest] = view.split('/')
  if (view === '全局结构') {
    main.innerHTML = `<h1><span class="kind">定规范</span><span class="sep">›</span>全局结构${GLOBAL.fromTemplate ? ' <span class="badge">模板</span>' : ''}</h1>${globalView()}`
    // 照卡片的真宽重排一次，字不跟着缩
    const host = document.querySelector('.glob-host'), w = host && host.clientWidth
    if (w && Math.abs(w - globalW) > 4) { globalW = w; host.innerHTML = globalSvg(globalW) }
    return
  }
  const sp = sideSpecs(context)
  if (sp && kind === 'spec' && sp[rest[0]]) {
    main.innerHTML = `<h1><span class="kind">定规范</span><span class="sep">›</span>${esc(rest[0])}</h1>${specView(rest[0], sp[rest[0]])}`
    const host = document.querySelector('.struct-host'), w = host && host.clientWidth
    if (rest[0] === '结构设计' && (sp[rest[0]].kind === '前端' || sp[rest[0]].modules?.length) && w && Math.abs(w - structW) > 4) { structW = w; host.innerHTML = drawStruct(structW, sp[rest[0]]) }
    return
  }
  // 别的上下文有文件结构、却没有这一份规范的：直接看它的文件结构
  if (context !== CODE_CX && cxData(context) && kind === 'spec') { view = 'tree'; return render() }
  if (!cxData(context)) {
    main.innerHTML = `<h1><span class="kind">上下文</span><span class="sep">›</span>${esc(context)}</h1><p class="sub">${context === '共享内核' ? '共享内核没有代码，只有概念。' : `这个上下文还没开始。规范、技术选型、文件结构、伪代码、代码都落 上下文/${esc(context)}/代码/。`}</p>`
    return
  }
  if (kind === 'spec') {
    main.innerHTML = `<h1><span class="kind">定规范</span><span class="sep">›</span>${esc(rest[0])}</h1>${specView(rest[0])}`
    const host = document.querySelector('.struct-host'), w = host && host.clientWidth
    if (w && Math.abs(w - structW) > 4) { structW = w; host.innerHTML = drawStruct(structW, STRUCTURE) }
  } else if (kind === 'pseudo') {
    go('tree/' + rest.join('/'))
  } else if (kind === 'flow') {
    const f = MODEL.flows.find((x) => x.file === rest.join('/'))
    main.innerHTML = `<h1><span class="kind">走通一段</span><span class="sep">›</span>${esc(f.title)} ${gate()}</h1>${flowView(f)}`
  } else if (kind === 'model') {
    const key = rest.join('/')
    main.innerHTML = `<h1><span class="kind">模型 → 代码</span><span class="sep">›</span>${esc(keyTitle(key))} ${gate()}</h1>${modelView(key)}`
  } else {
    const openPath = rest.join('/') || null
    const box = document.querySelector('.tree-box'), top = box && box.scrollTop
    main.innerHTML = `<h1><span class="kind">文件结构 · 伪代码</span><span class="sep">›</span>${esc(STRUCT.root)}/${openPath ? `<span class="sep">›</span>${esc(openPath.split('/').pop())}` : ''}</h1>${treeView(openPath)}`
    const nb = document.querySelector('.tree-box')
    if (nb && typeof top === 'number') nb.scrollTop = top
    if (nb && nb.querySelector && openPath && treeScrolledFor !== openPath) {
      treeScrolledFor = openPath
      const on = nb.querySelector('.f.on')
      if (on && (on.offsetTop < nb.scrollTop || on.offsetTop + on.offsetHeight > nb.scrollTop + nb.clientHeight)) nb.scrollTop = Math.max(0, on.offsetTop - nb.clientHeight / 3)
    }
  }
}
function bind() {
  document.getElementById('main').addEventListener('click', (ev) => {
    const ob = ev.target.closest('.ask button.opt')   // 问题卡上的一个选项或「另说」
    if (ob) { if (!ob.disabled) answerAsk(ob.dataset); return }
    const th = ev.target.closest('[data-tree-hide], [data-tree-show]')
    if (th) { const on = th.hasAttribute('data-tree-hide'); treeHide(on); th.closest('.tree-col').classList.toggle('hide', on); return }
    const tg = ev.target.closest('.tree [data-tg]')
    if (tg) { treeToggle(context + ':' + tg.dataset.tg); render(); return }
    const row = ev.target.closest('.tree .f[data-key]')
    if (row) { go('tree/' + row.dataset.path); return }
    const file = ev.target.closest('.file[data-path]')
    if (file) { openFile = file.dataset.path; render(); return }
  })
  bindContexts('spec/结构设计')
}
;({ cx: context, v: view } = parseHash('spec/结构设计')); Shell.show(context)
window.addEventListener('resize', () => { if (view === '全局结构' || view === 'spec/结构设计') render() })
render(); bind()
</script>
</body>
</html>
