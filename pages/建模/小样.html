<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台 · 建模</title>
<style>
:root{
  --bg:#f7f6f3; --panel:#ffffff; --ink:#1d1d1b; --ink-2:#55534e; --ink-3:#8a877f; --line:#dedbd3; --accent:#2563eb; --accent-bg:#e8efff;
  --role:#e3edff; --role-line:#2f5fc4; --data:#e7f5ec; --data-line:#2f855a; --area:#f4f4f1; --area-line:#b8b5ad; --topic:#faf9f6; --topic-line:#8a877f;
  --c1:#fdf1e3; --c1l:#c2410c; --c2:#e8efff; --c2l:#2563eb; --c3:#f1ebfd; --c3l:#7c3aed; --c4:#fbf3d5; --c4l:#b45309; --c5:#e3f6f8; --c5l:#0891b2;
  --note:#fffdf5; --note-line:#e5d9a8; --warn:#b35c00; --badge:#fff3cd; --badge-ink:#7a5200; --badge-line:#f0d58c; --red:#cf222e;
  /* 建模页多出来的四种：命令、事件、领域服务、事件处理器 */
  --cmd:#fdeee0; --cmd-line:#c2410c; --evt:#fdf6d5; --evt-line:#b45309; --svc:#f1ebfd; --svc-line:#7c3aed; --hdl:#e3f6f8; --hdl-line:#0891b2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#18181a; --panel:#222225; --ink:#ecebe7; --ink-2:#b5b2ab; --ink-3:#85827b; --line:#3a3a3e; --accent:#7aa2ff; --accent-bg:#26314d;
    --role:#243352; --role-line:#7aa2ff; --data:#1f3327; --data-line:#4ade80; --area:#1d1d20; --area-line:#4a4a50; --topic:#26262a; --topic-line:#85827b;
    --c1:#3a2a1c; --c1l:#fb923c; --c2:#1f2a44; --c2l:#7aa2ff; --c3:#2d2342; --c3l:#c4b5fd; --c4:#3a3220; --c4l:#fbbf24; --c5:#1b3337; --c5l:#67e8f9;
    --note:#2e2b1f; --note-line:#6b5f2e; --warn:#fb923c; --badge:#3a3220; --badge-ink:#fbbf24; --badge-line:#6b5f2e; --red:#ff6b6b;
    --cmd:#3a2a1c; --cmd-line:#fb923c; --evt:#3a3220; --evt-line:#fbbf24; --svc:#2d2342; --svc-line:#c4b5fd; --hdl:#1b3337; --hdl-line:#67e8f9;
  }
}
h1 a.up{color:var(--ink-2);text-decoration:none}
.tabs{display:flex;gap:2px;margin:0 0 12px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:5px 12px;font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.who{font-size:12px;color:var(--ink-3);margin:0 0 10px}
.scroll{overflow:auto}
/* 来源在左、聚合成员在右，中间连线（照旧版聚合设计页）；指着一张来源卡，它落到的属性与行为亮起来 */
.attr{position:relative;display:flex;gap:28px;align-items:flex-start;min-width:1080px;padding:4px 0 8px}
.attr svg.wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.attr svg.wires path{fill:none;stroke:var(--line);stroke-width:1.2}
.attr svg.wires path.on{stroke:var(--accent);stroke-width:2}
.flow{display:grid;grid-template-columns:80px 250px;column-gap:14px;row-gap:14px;flex:none}
.flow .hd{font-weight:600;font-size:13px}
.flow .hd span{font-weight:400;color:var(--ink-3);font-size:11px;margin-left:5px}
.stage{position:relative;text-align:right;padding-right:14px;border-right:2px solid var(--line)}
.stage b{display:block;font-size:13px}
.stage span{font-size:11px;color:var(--ink-3)}
.stage.first::after{content:"";position:absolute;right:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--ink-2)}
.ent{border:1px solid var(--area-line);border-radius:8px;padding:5px 9px;background:var(--panel);align-self:start}
.ent b{display:block;font-size:13px}
.ent span{font-size:11px;color:var(--ink-3)}
.src{border:1px solid var(--data-line);border-radius:8px;overflow:hidden;background:var(--panel);cursor:default}
.src .w{padding:3px 9px;font-size:12.5px;border-bottom:1px solid var(--line)}
.src .w i{font-style:normal;font-size:11px;color:var(--ink-3);margin-right:8px}
.src .w span{color:var(--ink-3);font-size:11px;margin-left:6px}
.src .w em.k{font-style:normal;font-size:10.5px;padding:0 5px;border-radius:3px;margin-right:6px;border:1px solid var(--area-line);background:var(--area);color:var(--ink-2)}
.src .w em.k.角色{background:var(--role);border-color:var(--role-line)}
.src .w em.k.事件{background:var(--evt);border-color:var(--evt-line)}
.src .t{background:var(--data-line);color:#fff;font-weight:600;font-size:13px;padding:3px 9px}
.src .t i,.src .f i{font-style:normal;font-size:11px;font-weight:400;margin-right:8px;opacity:.85}
.src .f{padding:4px 9px;font-size:12.5px}
.src .f i{color:var(--ink-3)}
.src.on{box-shadow:0 0 0 2px var(--accent)}
.agg{flex:none;border:1px dashed var(--area-line);border-radius:14px;background:var(--area);padding:24px 18px 18px;position:relative}
.agg .body{display:flex;gap:18px;align-items:flex-start}
.agg .cls{width:400px;flex:none}
.agg .bcol{width:270px;flex:none}
.agg .bcol .bhs{grid-template-columns:1fr}
.agg>.cap{position:absolute;top:-9px;left:14px;background:var(--panel);padding:0 8px;font-size:12px;color:var(--ink-2)}
.cls{border:1.5px solid var(--ink);border-radius:8px;background:var(--panel);font-size:13px}
.cls .h{display:flex;align-items:baseline;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line)}
.cls .h small{color:var(--ink-3);font-size:11px}
.cls .h b{font-size:15px}
.cls .g{font-size:11px;color:var(--ink-3);padding:5px 10px 1px;border-top:1px dashed var(--line);letter-spacing:.05em}
.cls .g.first{border-top:0}
.cls .row{display:flex;gap:8px;padding:1px 10px}
.cls .row .n{flex:none}
.cls .row .m{color:var(--ink-3);font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cls .row .ty{color:var(--ink-3);font-size:12px;white-space:nowrap}
.cls .row .ty.cx{color:var(--ink);font-weight:600}
.cls .row.on{background:var(--accent-bg)}
.cls .none{padding:1px 10px 4px;color:var(--ink-3);font-size:12px;font-style:italic}
.cls .pad{height:6px}
.agg .bcap{font-size:12px;color:var(--ink-2);margin:0 0 6px}
.bh.on{box-shadow:0 0 0 2px var(--accent)}
/* 点住的：和指着的一样亮，外面多一道淡描边；属性行多一道左边线 */
.src,.bh,#cls .row[data-f]{cursor:pointer}
.src.pin,.bh.pin{box-shadow:0 0 0 2px var(--accent),0 0 0 5px var(--accent-bg)}
.cls .row.pin{background:var(--accent-bg);box-shadow:inset 3px 0 0 var(--accent)}
.attr svg.wires path.pin{stroke:var(--accent);stroke-width:2}
/* 留言：属性行末尾一个淡淡的按钮，指着那一行才显出来；留言挂在属性下面 */
.cls .row .nb{flex:none;font:inherit;font-size:11px;line-height:1.4;padding:0 5px;border:1px solid transparent;border-radius:3px;background:none;color:var(--ink-3);cursor:pointer;opacity:0}
.cls .row:hover .nb,.cls .row .nb:focus{opacity:1;border-color:var(--line)}
.cls .row .nb:hover{color:var(--accent);border-color:var(--accent)}
.cls .notes{padding:0 10px 3px 22px;font-size:12px}
.cls .notes:empty{display:none}
.note{border-left:2px solid var(--note-line);background:var(--note);padding:3px 8px;margin:2px 0;font-size:12px;color:var(--ink)}
.note .at{color:var(--ink-3);font-size:11px;margin-left:6px}
.note .re{color:var(--ink-2);margin-top:2px}
.note .fx{color:var(--ink-3);margin-right:4px}
.note .badge{margin-left:6px;font-size:10.5px;padding:0 5px}
.nf{display:flex;gap:6px;margin:3px 0}
.nf input{flex:1;min-width:0;font:inherit;font-size:12.5px;padding:2px 6px;border:1px solid var(--accent);border-radius:4px;background:var(--panel);color:var(--ink)}
.nf button{font:inherit;font-size:12px;padding:1px 8px;border-radius:4px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink-2)}
.nf button.ok{border-color:var(--accent);color:var(--accent)}
.stray{border:1px solid var(--note-line);background:var(--note);border-radius:8px;padding:6px 12px;margin:0 0 12px;font-size:12.5px;color:var(--ink-2)}
.stray .cap{display:block;margin:0 0 4px}
/* 建模挂在成员、行为上的问题：红框的卡，一条一张，底下一排选项 */
.lock{margin:0 0 10px;padding:7px 12px;border:1px solid var(--badge-line);background:var(--badge);color:var(--badge-ink);border-radius:8px;max-width:960px}
.asks{margin:0 0 12px;max-width:960px}
.asks>.cap{display:block;margin:0 0 6px}
.ask{border:1.2px solid var(--red);background:var(--panel);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.ask + .ask{margin-top:8px}
.ask .wh{font-size:12px;color:var(--ink-3)}
.ask .q{font-size:13.5px;font-weight:600}
.ask .lean{font-size:12.5px;color:var(--ink-2);border-left:3px solid var(--red);padding-left:8px}
.ask .lean b{color:var(--ink)}
.ask .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.ask .opt{font:inherit;font-size:12px;text-align:left;padding:3px 9px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);cursor:pointer}
.ask .opt.b{border-color:var(--accent);color:var(--accent);font-weight:600}
.ask .opt[disabled]{opacity:.5;cursor:default}
.asks a{margin-right:10px}
nav a .open,.asks a .open{display:inline-block;min-width:8px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--red);color:#fff;font-style:normal;font-size:10.5px;font-weight:600;text-align:center;line-height:16px;vertical-align:1px}
.bh.asked>b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--red);margin-left:6px;vertical-align:2px}
.stray .note{background:var(--panel)}
/* 业务概念在模型里没有自己的元素：收起来是一行，点开看列表 */
details.gap{border:1px solid var(--note-line);background:var(--note);border-radius:8px;padding:5px 12px;margin:0 0 12px;font-size:12.5px;color:var(--ink-2);max-width:960px}
details.gap summary{cursor:pointer;color:var(--warn)}
details.gap ul{margin:6px 0 4px;padding-left:18px}
details.gap li{margin:2px 0}
details.gap a{color:var(--accent);text-decoration:none}
details.gap .x{color:var(--ink-3);font-size:12px}
p.gap{font-size:12.5px;color:var(--warn);margin:-6px 0 12px}
p.none{color:var(--ink-3);margin:0}
h1{font-size:22px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
h1 .sep{color:var(--ink-3);font-weight:400;font-size:16px}
h1 .kind{color:var(--ink-3);font-weight:400;font-size:14px}
.badge{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--badge);color:var(--badge-ink);border:1px solid var(--badge-line);font-weight:400}
.badge.done{background:var(--data);color:var(--data-line);border-color:var(--data-line)}
.act{font-size:12px;padding:2px 10px;border:1px solid var(--accent);color:var(--accent);background:var(--panel);border-radius:4px;cursor:pointer}
.sub{color:var(--ink-2);margin:0 0 12px;max-width:960px}
.diagram{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;overflow:auto}
.row{display:flex;gap:16px;align-items:flex-start}
.row .diagram{flex:1;min-width:0}
.side{width:300px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--ink-2);position:sticky;top:12px}
.side b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}
.side b small{font-weight:400;color:var(--ink-3);font-size:11px;margin-right:6px}
.side .src{font-size:12px;color:var(--ink-3);margin-top:8px;border:0;border-radius:0;background:none}
.side a{display:block;margin-top:10px;font-size:12px;color:var(--accent);text-decoration:none}
/* 成员关系图：画法照业务小样的概念关系图 */
.lb rect{fill:var(--panel);stroke:var(--line);stroke-width:1;rx:6}
.lb text{font-size:11.5px;fill:var(--ink-2)}
.lb path{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3}
.grp rect{stroke-dasharray:6 5;stroke-width:1}
.grp text{font-size:13px;fill:var(--ink-3);letter-spacing:1px}
.nd rect{fill:var(--data);stroke:var(--data-line);stroke-width:1.2}
.nd.sel rect{stroke-width:2.6}
.nd{cursor:pointer}
.stub rect{stroke-dasharray:4 3;stroke-width:1}
.stub text{fill:var(--ink-2);font-size:13px}
.stub text.sub{fill:var(--ink-3)}
.stub{cursor:pointer}
.rl rect{fill:var(--role);stroke:var(--role-line);stroke-width:1}
.rl text{font-size:10.5px;fill:var(--role-line)}
.ed path.vis{fill:none;stroke:var(--ink-2);stroke-width:1.3}
.ed path.hit{fill:none;stroke:transparent;stroke-width:14}
svg{display:block;margin:0 auto}
svg text{font:12px system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--ink);pointer-events:none}
svg text.sub{font-size:11px;fill:var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--ink-2);margin:10px 0 0}
.legend .sw{display:inline-block;width:18px;height:12px;border:1px solid;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend .sw.round{border-radius:7px;width:14px;height:10px}
.legend .sw.dash{border-style:dashed}
.detail{position:fixed;z-index:20;max-width:380px;box-shadow:0 6px 24px rgba(0,0,0,.2);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px}
.detail[hidden]{display:none}
.detail h4{margin:0 0 4px;font-size:13px;color:var(--ink-3);font-weight:400}
.detail div{padding:2px 0}
/* 聚合卡 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.blk{margin-bottom:16px}
.blk:last-child{margin-bottom:0}
.cap{font-size:12px;color:var(--ink-3);letter-spacing:1px;margin-bottom:6px}
table.attrs{border-collapse:collapse;font-size:13px;width:100%}
table.attrs td{padding:3px 10px 3px 0;border-top:1px solid var(--line);vertical-align:top}
table.attrs tr:first-child td{border-top:0}
table.attrs td.n{font-weight:600;white-space:nowrap;width:1%}
table.attrs td.ty{color:var(--ink-3);white-space:nowrap;width:1%}
table.attrs td.nt{color:var(--ink-2)}
table.list td{padding:5px 14px 5px 0}
table.list tr.hd td{color:var(--ink-3);font-size:12px;border-top:0;white-space:nowrap}
table.list td a{color:var(--accent);text-decoration:none}
table.list .none{color:var(--ink-3)}
.mb rect{fill:var(--data);stroke:var(--data-line);stroke-width:1.2;cursor:pointer}
.mb.root rect{stroke-width:2.4}
.mb.vo rect{fill:var(--panel);stroke:var(--data-line);stroke-dasharray:0}
.mb.sel rect{stroke-width:2.6}
.mb text.k{font-size:10px;fill:var(--ink-3)}
.mb text.n{font-size:13px;font-weight:600}
.bhs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.bh{border:1px solid var(--data-line);background:var(--data);border-radius:3px;padding:8px 12px;font-size:13px;cursor:default}
.bh b{display:block;font-size:14px;margin-bottom:4px}
.bh b small{font-weight:400;color:var(--ink-2);font-size:12.5px}
.bh .r{display:grid;grid-template-columns:18px 1fr;gap:1px 6px;color:var(--ink)}
.bh .r i{font-style:normal;color:var(--ink-3);font-size:11px;padding-top:2px}
.bh .r .none{color:var(--ink-3)}
.chip{display:inline-block;font-size:11.5px;line-height:1.5;padding:0 7px;border-radius:3px;background:var(--evt);border:1px solid var(--evt-line);margin:1px 4px 1px 0}
.chip.svc{background:var(--svc);border-color:var(--svc-line)}
.rules{font-size:13px;color:var(--ink);border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.rules .cap{display:inline;margin-right:8px}
.rules .x{color:var(--ink-3);font-size:12px}
.st rect{fill:var(--panel);stroke:var(--ink-3);stroke-width:1.2}
.st rect.outer{fill:none}
.st text{font-size:13px;font-weight:600}
.start{fill:var(--ink-2)}
.tr path.vis{fill:none;stroke:var(--ink-2);stroke-width:1.3}
.tr path.hit{fill:none;stroke:transparent;stroke-width:16}
.tr text{font-size:11.5px;fill:var(--ink-2);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
/* 调动图 */
.bx rect{stroke-width:1.2}
.bx text.c{font-size:10.5px;fill:var(--ink-3)}
.bx text.n{font-size:13px;font-weight:600}
.bx text.s{font-size:11px;fill:var(--ink-2)}
.bx.cmd rect{fill:var(--cmd);stroke:var(--cmd-line)}
.bx.qry rect{fill:var(--cmd);stroke:var(--cmd-line);stroke-dasharray:4 3}
.bx.svc rect{fill:var(--svc);stroke:var(--svc-line)}
.bx.agg rect{fill:var(--data);stroke:var(--data-line)}
.bx.evt rect{fill:var(--evt);stroke:var(--evt-line)}
.bx.hdl rect{fill:var(--hdl);stroke:var(--hdl-line)}
.ln{fill:none;stroke:var(--ink-2);stroke-width:1.3}
.mv{cursor:default}
/* 聚合全图：主题框照业务全局图的排法和颜色，框里一个聚合一个小框 */
.tp rect{stroke-width:1.4}
.tp text.t{font-size:15px;font-weight:600}
.tp text.none{font-size:12px;fill:var(--ink-3)}
.ag{cursor:pointer}
.ag rect{fill:var(--panel);stroke:var(--data-line);stroke-width:1.2}
.ag:hover rect{stroke-width:2.4}
.ag text.n{font-size:13px;font-weight:600;pointer-events:auto}
.ag text.n:hover{text-decoration:underline}
.ag text.r{font-size:11px;fill:var(--ink-3)}
.ag text.k{font-size:10px;fill:var(--ink-3)}
.ag text.m{font-size:11.5px;fill:var(--ink-2);pointer-events:auto;cursor:pointer}
.ag text.m:hover{text-decoration:underline;fill:var(--ink)}
.ag path.sep{stroke:var(--line);stroke-width:1}
/* 线默认画淡、不放小卡；选中一个聚合：它进出的线高亮，别的线和不相干的聚合更淡 */
.allmap .ed path.vis{stroke:var(--ink-3);opacity:.5}
.allmap.focus .ed path.vis{opacity:.12}
.allmap .ed.on path.vis{stroke:var(--accent);stroke-width:2;opacity:1}
.allmap.focus .ag rect{opacity:.55}
.allmap.focus .ag.sel rect,.allmap.focus .ag.nb rect{opacity:1}
.allmap .ag.sel rect{stroke:var(--accent);stroke-width:2.6}
.allmap .ag.nb rect{stroke:var(--accent)}
nav a.sub .tri[data-tg]{cursor:pointer;width:16px;margin-left:-4px;text-align:center}
nav a.sub .tri[data-tg]:hover{color:var(--ink)}
/* 主题一层、聚合缩一格、成员再缩一格 */
nav .tn.tp{display:block;cursor:pointer;padding:4px 16px 4px 30px}
nav .tn.tp .tri{display:inline-block;width:12px;color:var(--ink-3);font-size:10px}
nav a.sub[data-k]{padding-left:44px}
nav a.sub[data-k] ~ a.sub2{padding-left:64px}
nav .tn.tp:hover,nav .tn.tp:hover .tri{color:var(--ink)}
</style>
<link rel="stylesheet" href="../../lib/shell.css">
<script src="../../lib/shell.js"></script>
</head>
<body>
<div class="topbar" id="topbar"></div>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="detail" id="detail" hidden></div>

<script>
// 工作台起的时候 window.DATA 由 /data/<页>.js 先定义，下面每个常量都先取它；单开这份小样时 DATA 是空的，用写死的
const DATA = (typeof window !== 'undefined' && window.DATA) || {}
const LIVE = Object.keys(DATA).length > 0
const post = (action, body) => fetch('api/' + action, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then((r) => r.json()).then((o) => { if (o.ok) location.reload(); else alert(o.error) })
// 建模这个角色的两份输出，数据写死在这里；真做时是两种 JSON 文件，按主题放文件夹。两份的形状：
// 1. 模型/<主题>/聚合/<聚合名>.json（一个聚合一份）
//    { id, title, topic, concepts: [概念名], summary,                             concepts 是它从业务的哪几个概念来的；summary 一段话说这个聚合管什么、为什么这几个在一起
//      members: [{ id, name, kind, desc,                                           聚合里的成员：kind 是「根」「实体」「值对象」；desc 一段话说它是什么、为什么归这个聚合
//                  groups: [{ group, aspect?, none?, fields: [{ name, type, note }] }],  属性分组摆：身份、业务属性（可按方面各起一组）、状态、外部关联、成员、审计；有哪组写哪组，不必凑齐
//                  sources?: { stages: [{ id, title, note? }], origins: [{ id, kind, title, note? }],   按时间：谁（角色）、哪个事件或哪个时间节点带来一份事实，落在哪几个属性上、由哪个行为接
//                              facts: [{ stage, from, event, fact, fields: [属性名], behavior?, trace? }] },   origins 的 kind 是「角色」「事件」「时间」；from 指一个 origin
//                  states?: [状态名], transitions?: [{ from, to, by }],            根和实体可以有自己的状态；by 是让它变的行为名，from 空着是开出来那一下
//                  behaviors?: [{ name, params, guards, throws, emits, trace?, asks? }], 行为也归成员；值对象有来源，没有状态和行为
//                  asks?: [{ id, q, lean, options?, answer?, answeredAt? }] }],     建模拿不准的问题：说的是这个成员就挂在成员上，说的是一个行为就挂在那个行为上（同一个格式）；id 在一份聚合里不重复，options 第一个是偏向
//      页面只摆没答的：在成员那一页顶上一条一张卡，写明问的是成员还是哪个行为；点一个选项或「另说」= post('答', { context, agg: 聚合 id, ask: 问题 id, text, sig })，写回聚合文件里那一条。
//      sig 是工作台给每条没答的问题带出来的「这一版的记号」，答的时候带回去；聚合的 locked 是角色正在改这一份，这时候先答不了。建模照答案改好模型，就把这条问题删掉
//      links: [{ from, to, label }],                                            成员之间的关系，label 写上一层拿它做什么
//      rules: [{ text, service? }] }                                            聚合边界守的规则；跨实例才守得住的写 service＝替它守的领域服务
// 2. 模型/<主题>/调动/清单.json（一个主题一份）：这个主题里所有的命令、查询、事件处理器，一条一个定义，三种共用一个格式，栏位固定、按 kind 填
//    { topic, items: [{
//        id, kind,                         kind：命令 | 查询 | 事件处理器
//        name,                             名字，用业务的说法
//        in,                               进来的是什么：命令、查询是 params（入参名）；事件处理器是 on（它听的事件）
//        via?: { name, does, throws? } | [同样的几个],  经过的领域服务：名字、它查什么、查不过抛什么；过几个写一串、按先后排；没有不写
//        call: { aggregate, behavior },    动哪个聚合的哪个行为；查询写 { aggregate, read: true }，只读不动
//        out,                              出去的是什么：命令、事件处理器是发出的事件名；查询是返回什么
//        throws?,                          它自己抛的：找不到要动的那份、入参不全；领域服务抛的、行为抛的不重写，页面从那两处汇上来
//        note? }] }
// 3. 模型/<主题>/调动/<流程名>.json（一段流程一份）：只是从清单里索引，行的先后就是这段流程里命令之间的自然调用顺序
//    { file, title, topic, summary, rows: [{ ref, trace?: { flow, step }, note? }] }   ref 指清单里的 id；trace 指回业务流程的第几步
// 4. 模型/全图.json（一个上下文一份，起骨架时写）：{ edges: [{ from, to, label }] }   from、to 是聚合 id；聚合放哪个主题框，看聚合的 topic

/** 状态图从上往下（照旧版聚合设计页的排法）：从开出来那一下起一层层往下，同一层的并排；
 *  回到上面的转移走左边，自环在右边；箭头旁写让它变的行为；没有出路的状态双框；

function drawStates(a) {

  const queue = [...new Set(starts.length ? starts : names.slice(0, 1))]
  queue.forEach((n) => { rank[n] = 0 })
  while (queue.length) {
    const n = queue.shift()
    for (const t of trans) if (t.from === n && t.to !== n && rank[t.to] === undefined) { rank[t.to] = rank[n] + 1; queue.push(t.to) }
  }
  let maxR = Math.max(0, ...Object.values(rank))
  for (const n of names) if (rank[n] === undefined) rank[n] = ++maxR
  const byRank = {}
  for (const n of names) (byRank[rank[n]] ??= []).push(n)
  // 自环让出的宽度：第 k 个自环的字从框右边 64+10k 起，按字数算长
  const loopW = {}
  for (const n of names) { let k = 0, w = 0; for (const t of trans) if (t.from === n && t.to === n) { k++; w = Math.max(w, 64 + k * 10 + t.by.length * CH) } loopW[n] = w }
  // 每层从左往右排：中心到中心 = 左框半宽 + 左框的自环 + 空 + 右框半宽；各层再对齐到同一条中线
  const rowX = {}, rowSpan = {}
  for (const [r, list] of Object.entries(byRank)) {
    let x = 0; rowX[r] = list.map((n, i) => { if (i) x += W + loopW[list[i - 1]] + GAP; return x })
    rowSpan[r] = x
  }
  const cx0 = 150 + Math.max(0, ...Object.values(rowSpan)) / 2
  const pos = {}
  for (const [r, list] of Object.entries(byRank)) list.forEach((n, i) => { pos[n] = { x: cx0 - rowSpan[r] / 2 + rowX[r][i], y: TOP + r * RANK, r: +r } })
  const outgoing = new Set(trans.filter((t) => t.from && t.from !== t.to).map((t) => t.from))
  let s = MARK, minX = cx0 - W / 2 - 20, maxX = cx0 + W / 2 + 20, maxY = 0
  const grow = (x, w, anchor) => { const l = anchor === 'end' ? x - w : anchor === 'middle' ? x - w / 2 : x; minX = Math.min(minX, l - 8); maxX = Math.max(maxX, l + w + 8) }
  const startTo = starts[0] ?? names[0]
  s += `<circle class="start" cx="${pos[startTo].x}" cy="22" r="7"/>`
  if (!starts.length) s += `<g class="tr"><path class="vis" d="M ${pos[startTo].x} 29 L ${pos[startTo].x} ${pos[startTo].y - H / 2 - 2}" marker-end="url(#a)"/></g>`
  for (const n of names) {
    const p = pos[n], x = p.x - W / 2, y = p.y - H / 2, final = !outgoing.has(n)

    else {

        d = `M ${x0} ${y0} C ${x0 + 58 + k * 10} ${y0 - 12}, ${x0 + 58 + k * 10} ${y0 + 34}, ${x0 + 2} ${y0 + 22}`; lx = x0 + 64 + k * 10; ly = y0 + 15

        else if (Math.abs(p.x - b.x) < 2) { const cx = p.x + W / 2 + 40; d = `M ${p.x + 30} ${y1} C ${cx} ${y1 + 40}, ${cx} ${y2 - 40}, ${b.x + 30} ${y2}`; lx = cx + 6; ly = (y1 + y2) / 2 }
        else {
          const sx = p.x + (b.x > p.x ? 30 : -30)

          // 横着走得远的，中段几乎是平的：字放在线上方，从中点往目标那侧写，左右两条不对撞；竖着走的放线旁边
          if (Math.abs(b.x - sx) > (y2 - y1) * 1.5) { const right = b.x > sx; anchor = right ? 'start' : 'end'; lx = (sx + b.x) / 2 + (right ? -6 : 6); ly = (y1 + y2) / 2 - 8 }
          else { const outerLeft = (sx + b.x) / 2 < cx0; anchor = outerLeft ? 'end' : 'start'; lx = (sx + b.x) / 2 + (outerLeft ? -14 : 14); ly = (y1 + y2) / 2 + 2 }
        }
      } else if (b.r < p.r) {
        const k = backN[t.to] = (backN[t.to] ?? 0) + 1
        const cx = Math.min(p.x, b.x) - W / 2 - 34 - (p.r - b.r) * 18 - k * 6
        const y1 = p.y + 4 + k * 3, y2 = b.y - 6 + k * 5
        d = `M ${p.x - W / 2} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${b.x - W / 2 - 2} ${y2}`
        anchor = 'end'; lx = cx + (Math.min(p.x, b.x) - W / 2 - cx) * 0.25 - 4; ly = (y1 + y2) / 2 + 4
      } else {
        const dir = b.x > p.x ? 1 : -1

    }
    grow(lx, t.by.length * CH, anchor)
    s += `<g class="tr" data-i="${i}"><path class="vis" d="${d}" marker-end="url(#a)"/><path class="hit" d="${d}"/><text x="${lx}" y="${ly}" text-anchor="${anchor}">${esc(t.by)}</text></g>`
  })

  return `<svg width="${w}" height="${h}" viewBox="${minX} 0 ${w} ${h}">${s}</svg>`
}

// ---------- 聚合卡：成员关系图 ----------
// 画法照业务小样的概念关系图搬过来：曲线连线、线上的说明做成带虚线引线的小卡、角色药丸、主题色虚线外框、指向别处的虚线桩

      for (let i = limit; i >= 1; i--) if ('，、；： '.includes(s[i - 1]) && width(s.slice(0, i)) >= 12) { cut = i; break }

 *  near 是查「贴着别的线」用的（每 0.05 取一点），hit 是查「穿过框」「虚线穿线」用的（从 0.02 起每 0.03 取一点） */

      if (ride) { taken.push(ride.box); labels += ride.svg; continue }
    }
    labels += placeLabel(cv, [e.label], taken, e.tree ? [[0.5, 0, 24], [0.5, 0, -24], [0.75, 110, 0], [0.75, -110, 0], [0.5, 110, 0], [0.5, -110, 0]] : TRIES_AROUND, 0, others).svg
  }
  for (const n of mine) {
    const p = pos[n.id]
    const text = n.kind
      ? `<text class="k" x="${p.x + 10}" y="${p.y + 17}">${esc(n.kind)}</text><text class="n" x="${p.x + 10}" y="${p.y + 36}">${esc(n.title)}</text>`
      : `<text x="${p.x + W / 2}" y="${p.y + 30}" text-anchor="middle">${esc(n.title)}</text>`
    s += `<g class="${n.cls ?? 'nd'}${n.id === selected ? ' sel' : ''}" ${n.attrs ?? `data-n="${n.id}"`}><rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="3"/>${text}</g>`
    if (n.by?.length) s += pills(n.by, p.x + 6, p.y - 10)
  }
  for (const id of outside) {
    const p = pos[id], n = byId[id], gg = grpOf[n.g]
    s += `<g class="stub" ${n.attrs ?? `data-g="${n.g}" data-n="${id}"`}><rect x="${p.x}" y="${p.y}" width="${W}" height="${p.h}" rx="3" style="${tintOf(gg)};fill-opacity:.5"/>
      <text x="${p.x + W / 2}" y="${p.y + 17}" text-anchor="middle">${esc(n.title)}</text><text class="sub" x="${p.x + W / 2}" y="${p.y + 32}" text-anchor="middle">${esc(gg?.title ?? '')} ›</text></g>`
  }
  s += labels
  // 画布按所有东西的外沿算：框、节点、桩、小卡（placeLabel 把小卡占的矩形记在 taken 里）；有探出 0 以外的就整体挪进来
  const boxes = [frame, ...Object.values(pos), ...taken]
  const minX = Math.min(...boxes.map((b) => b.x)), minY2 = Math.min(...boxes.map((b) => b.y))
  const dx = Math.max(0, 16 - minX), dy2 = Math.max(0, 16 - minY2)
  const w = Math.max(...boxes.map((b) => b.x + b.w)) + dx + 30 + extraRight
  const h = Math.max(...boxes.map((b) => b.y + b.h)) + dy2 + 30
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><g transform="translate(${dx} ${dy2})">${s}</g></svg>`
}
/** 聚合换成上面引擎要的形状：聚合是框，成员是框里的节点（上一行写它是根、实体还是值对象），成员关系是树的线，线上的说明做成小卡；
 *  外部关联那组里 type 写「→ 聚合名」的属性，那个聚合画成框外左边的虚线桩，成员到桩一条线，线上写属性名。点一个成员，旁边出它的说明 */
function drawMembers(a) {

const GROUP_ORDER = ['身份', '业务属性', '状态', '外部关联', '成员', '审计']

// 一个成员上还没答的问题：挂在成员上的（b 是 null）和挂在它的行为上的
const openAsks = (m) => [...(m.asks ?? []).map((q) => ({ q, b: null })), ...(m.behaviors ?? []).flatMap((b) => (b.asks ?? []).map((q) => ({ q, b })))].filter((x) => !x.q.answer)

// 答一条问题：工作台上发给后端写进聚合文件、重载；单开时只改内存里的那条、重画
function answerAsk(d) {

const sameAgg = (n, a) => n.agg === a.id || n.agg === a.title

const noteHtml = (n, withField) => `<div class="note"><div>${withField ? `<span class="fx">${esc(n.field)}：</span>` : ''}${esc(n.text)}<span class="at">${esc(n.at ?? '')}</span>${n.status === '已处理' ? '<span class="badge done">已处理</span>' : '<span class="badge">待处理</span>'}</div>${n.reply ? `<div class="re">建模：${esc(n.reply)}${n.repliedAt ? `<span class="at">${esc(n.repliedAt)}</span>` : ''}</div>` : ''}</div>`

// 业务概念在模型里没有自己的元素：全图页列全部（按主题），聚合页只列它 concepts 里有、却没给元素的
function gapBox(list) {

    <ul>${Object.entries(byTopic).map(([t, gs]) => `<li>${esc(TOPICS[t]?.title ?? t)}：${gs.map((g) => `<b>${esc(g.concept)}</b>${where(g)}`).join('、')}</li>`).join('')}</ul>
    <div class="x">每个业务概念在模型里都该有自己的聚合、实体或值对象，名字照概念；名字不同但确实对应的，在成员上写 concept 声明。</div></details>`

// 成员页「属性 · 行为」上亮哪几样：指着的（on）和点住的（pin）各算各的，样子略有区别；sel 是 { k: 'src' | 'row' | 'bh', v }
// 点属性行要反查：哪几张来源卡的 fields 有它，接这几张卡的行为
let pin = null, pinAt = null   // 点住的那一样、它在哪一页；换页清掉
function litOf(m, sel) {
  const facts = m.sources?.facts ?? []
  if (!sel) return { on: [], fields: new Set(), bns: new Set() }
  const idx = (ok) => facts.map((f, i) => (ok(f) ? i : -1)).filter((i) => i >= 0)
  const on = sel.k === 'src' ? [+sel.v] : sel.k === 'bh' ? idx((f) => f.behavior === sel.v) : idx((f) => (f.fields ?? []).includes(sel.v))
  const fields = sel.k === 'row' ? new Set([sel.v]) : new Set(on.flatMap((i) => facts[i]?.fields ?? []))

function paintLit(m, sel, cls) {
  if (!document.getElementById('attr')) return
  const L = litOf(m, sel)
  document.querySelectorAll('#cls .row[data-f]').forEach((r) => r.classList.toggle(cls, L.fields.has(r.dataset.f)))
  document.querySelectorAll('#attr .bh').forEach((r) => r.classList.toggle(cls, L.bns.has(r.dataset.bn)))
  document.querySelectorAll('#attr .src').forEach((r) => r.classList.toggle(cls, L.on.includes(+r.dataset.i)))
  document.querySelectorAll('#wires path').forEach((w) => w.classList.toggle(cls, w.dataset.i ? L.on.includes(+w.dataset.i) && (!w.dataset.f || L.fields.has(w.dataset.f)) : L.bns.has(w.dataset.b) && L.fields.has(w.dataset.f)))

// 指着或点着的是哪一样
const selOf = (t) => { const c = t.closest('#attr .src'), b = t.closest('#attr .bh'), r = t.closest('#cls .row[data-f]'); return c ? { k: 'src', v: c.dataset.i } : b ? { k: 'bh', v: b.dataset.bn } : r ? { k: 'row', v: r.dataset.f } : null }

/** 来源卡连到它落的属性行与接它的行为卡；靠真实几何，没有浏览器就不画 */
function wireAttr(m) {
  const root = document.getElementById('attr'), svg = document.getElementById('wires')
  if (!root || !svg || !root.getBoundingClientRect || !m.sources) return
  const R = root.getBoundingClientRect(); if (!R.width) return
  const box = (el) => { const r = el.getBoundingClientRect(); return { l: r.left - R.left, r: r.right - R.left, t: r.top - R.top, b: r.bottom - R.top, m: (r.top + r.bottom) / 2 - R.top } }
  const cls = box(document.getElementById('cls'))
  let p = ''
  const facts = m.sources.facts
  facts.forEach((f, i) => {
    const c = root.querySelector(`.src[data-i="${i}"]`), b = f.behavior && root.querySelector(`.bh[data-bn="${CSS.escape(f.behavior)}"]`)
    if (!c) return
    const s = box(c), mx = s.r + 14 + i * 3
    if (b) { const t = box(b); p += `<path data-i="${i}" d="M ${s.r} ${s.t + 13} L ${mx} ${s.t + 13} L ${mx} ${t.m} L ${t.l} ${t.m}"/>`; return }
    const bx = cls.l - 12 - i * 4
    for (const fn of f.fields) {
      const row = root.querySelector(`.row[data-f="${CSS.escape(fn)}"]`); if (!row) continue
      const r = box(row)
      p += `<path data-i="${i}" data-f="${esc(fn)}" d="M ${s.r} ${s.t + 13} L ${bx} ${s.t + 13} L ${bx} ${r.m} L ${cls.l} ${r.m}"/>`
    }
  })
  ;(m.behaviors ?? []).forEach((bh, bi) => {
    const b = root.querySelector(`.bh[data-bn="${CSS.escape(bh.name)}"]`); if (!b) return
    const t = box(b), bx = cls.l - 12 - bi * 4
    const fields = new Set(facts.filter((f) => f.behavior === bh.name).flatMap((f) => f.fields))
    for (const fn of fields) {
      const row = root.querySelector(`.row[data-f="${CSS.escape(fn)}"]`); if (!row) continue
      const r = box(row)
      p += `<path data-b="${esc(bh.name)}" data-f="${esc(fn)}" d="M ${t.r} ${t.m} L ${bx} ${t.m} L ${bx} ${r.m} L ${cls.l} ${r.m}"/>`
    }
  })
  svg.innerHTML = p; svg.setAttribute('width', root.scrollWidth); svg.setAttribute('height', root.scrollHeight)
}

// ---------- 调动图 ----------
const COL = [{ x: 30, w: 180 }, { x: 280, w: 180 }, { x: 530, w: 180 }, { x: 780, w: 160 }]   // 进来的 | 领域服务 | 聚合的行为 | 事件
const BH = 54, GAPY = 42, Y0 = 20, RET_W = 280   // RET_W：查询右边「返回 …」那几行的宽
// 框里的名字和小字按框宽折行（13px 粗体一个字宽约 6.5、11px 约 6，汉字算两个），框跟着长高；一行里几个框取最高的
const boxLines = (c, name, sub) => ({ name: wrap([name], Math.floor((c.w - 16) / 6.5)), sub: sub ? wrap([sub], Math.floor((c.w - 16) / 6)) : [] })
const boxH = (l) => Math.max(BH, 40 + (l.name.length - 1) * 16 + l.sub.length * 14)
function box(cls, c, y, h, cap, l) {
  const sy = y + 35 + (l.name.length - 1) * 16 + 14
  return `<g class="bx ${cls}"><rect x="${c.x}" y="${y}" width="${c.w}" height="${h}" rx="3"/><text class="c" x="${c.x + 10}" y="${y + 16}">${esc(cap)}</text>${l.name.map((s, i) => `<text class="n" x="${c.x + 10}" y="${y + 35 + i * 16}">${esc(s)}</text>`).join('')}${l.sub.map((s, i) => `<text class="s" x="${c.x + 10}" y="${sy + i * 14}">${esc(s)}</text>`).join('')}</g>`
}
const line = (x1, y1, x2, y2) => `<path class="ln" d="M ${x1} ${y1} L ${x2} ${y2}" marker-end="url(#a)"/>`
// via 一个也好一串也好，都当一串用
const viasOf = (r) => [].concat(r.via ?? [])

/** 一步一行从上往下：左边进来的命令／查询／事件处理器，经过领域服务，到聚合的行为，右边发出事件；处理器听的事件从上一行拐下来 */
function drawMove(m) {
  let s = MARK
  // 先把每行的框和折好的字算出来，行高取最高的那个（查询右边「返回 …」那几行也算），再一行行往下摆
  const plan = m.rows.map((r) => {
    const k = r.kind, bs = []
    if (k === '事件处理器') bs.push(['hdl', COL[0], '事件处理器', boxLines(COL[0], r.name, `听 ${r.in.on}`)])
    else bs.push([k === '查询' ? 'qry' : 'cmd', COL[0], k, boxLines(COL[0], sig(r.name, r.in.params))])
    const vs = viasOf(r)
    if (vs.length) bs.push(['svc', COL[1], '领域服务', boxLines(COL[1], vs.map((v) => v.name).join(' → '), vs.map((v) => v.does).join('；'))])
    bs.push(['agg', COL[2], r.call.aggregate, boxLines(COL[2], r.call.read ? '读' : r.call.behavior, r.call.read ? '只读，不动它' : '')])
    const ret = k === '查询' ? wrap(['返回 ' + (r.out ?? '')], Math.floor(RET_W / 6)).concat(r.note ? wrap([r.note], Math.floor(RET_W / 6)) : []) : []
    if (k !== '查询' && r.out) bs.push(['evt', COL[3], '事件', boxLines(COL[3], r.out)])
    return { r, bs, ret, h: Math.max(...bs.map((b) => boxH(b[3])), ret.length * 14 + 12) }
  })
  const rowY = {}, rowH = {}
  let y0 = Y0
  for (const p of plan) { rowY[p.r.id] = y0; rowH[p.r.id] = p.h; y0 += p.h + GAPY }
  plan.forEach(({ r, bs, ret, h }, i) => {
    const y = rowY[r.id], mid = y + h / 2
    let g = bs.map(([cls, c, cap, l]) => box(cls, c, y, h, cap, l)).join('')
    const k = r.kind
    if (viasOf(r).length) { g += line(COL[0].x + COL[0].w, mid, COL[1].x - 2, mid); g += line(COL[1].x + COL[1].w, mid, COL[2].x - 2, mid) }
    else g += line(COL[0].x + COL[0].w, mid, COL[2].x - 2, mid)
    if (k === '查询') { g += line(COL[2].x + COL[2].w, mid, COL[3].x - 2, mid); g += ret.map((t, j) => `<text class="sub" x="${COL[3].x + 4}" y="${mid - ret.length * 7 + 11 + j * 14}">${esc(t)}</text>`).join('') }
    else if (r.out) g += line(COL[2].x + COL[2].w, mid, COL[3].x - 2, mid)
    // 处理器听的事件：从上面那一行的事件框底下拐下来，进处理器顶上
    if (k === '事件处理器' && r.in.on) {
      const src = m.rows.slice(0, i).reverse().find((x) => x.out === r.in.on)
      if (src) { const ex = COL[3].x + COL[3].w / 2, ey = rowY[src.id] + rowH[src.id], ym = ey + GAPY / 2, hx = COL[0].x + COL[0].w / 2; g += `<path class="ln" d="M ${ex} ${ey} L ${ex} ${ym} L ${hx} ${ym} L ${hx} ${y - 2}" marker-end="url(#a)"/>` }
    }
    s += `<g class="mv" data-r="${esc(r.id)}">${g}</g>`
  })
  const hasRet = plan.some((p) => p.ret.length)
  const w = COL[3].x + (hasRet ? Math.max(COL[3].w, RET_W + 4) : COL[3].w) + 30, h = y0 - GAPY + 20
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${s}</svg>`
}

// ---------- 聚合全图 ----------
/** 主区里图框能用的宽：主区宽减左右 padding、图框边框与 padding（照业务页） */
const availW = () => { const main = typeof document !== 'undefined' && document.getElementById('main'); return ((main && main.clientWidth) || 1240) - 76 }
/** 画布按内容算大小（照业务页）：把画上去的每个矩形都框进来，整体平移到留出 pad 的位置，谁都不出画布。
 *  比 maxW 宽就等比缩（viewBox 还是原大小），最多缩到 0.6，字再小就看不清了；全图自己把框排到缩 0.85 左右就放得下 */
function canvas(s, boxes, pad = 20, maxW = Infinity) {
  const bs = boxes.filter((b) => b && Number.isFinite(b.x) && Number.isFinite(b.y))
  const x1 = Math.min(...bs.map((b) => b.x)), y1 = Math.min(...bs.map((b) => b.y))
  const x2 = Math.max(...bs.map((b) => b.x + b.w)), y2 = Math.max(...bs.map((b) => b.y + b.h))
  const w = Math.ceil(x2 - x1 + pad * 2), h = Math.ceil(y2 - y1 + pad * 2), k = w > maxW ? Math.max(0.6, maxW / w) : 1
  const size = k < 1 ? `width="${Math.floor(w * k)}" height="${Math.ceil(h * k)}" viewBox="0 0 ${w} ${h}"` : `width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"`
  return `<svg ${size}><g transform="translate(${(pad - x1).toFixed(1)} ${(pad - y1).toFixed(1)})">${s}</g></svg>`
}
/** 线上的说明小卡（照业务页全局图）：线够长、骑上去不压框也不压别的线，就骑在线上；不然挪到线旁边拉虚线指过去 */
function rideLabel(cv, lines, taken, others, around = TRIES_AROUND) {
  let len = 0
  for (let t = 0.05; t <= 1.001; t += 0.05) { const a = cv.at(t - 0.05), b = cv.at(t); len += Math.hypot(b.x - a.x, b.y - a.y) }
  if (len >= labelBox(0, 0, lines, null).box.w * 1.6) for (const t of [0.5, 0.42, 0.58, 0.34, 0.66, 0.26, 0.74]) {
    const p = cv.at(t), lb = labelBox(p.x, p.y, lines, null)
    if (!taken.some((b) => overlaps(b, lb.box)) && !lineHits(lb.box, others)) { taken.push(lb.box); return lb }
  }
  return placeLabel(cv, lines, taken, around, 0, others)
}
/** 全图里的聚合之间的线：认 id 也认名，两头都找得到、不是自己指自己的才算 */
const graphEdges = (graph) => (graph?.edges ?? []).map((e) => ({ e, from: aggOf[e.from]?.id, to: aggOf[e.to]?.id })).filter((x) => x.from && x.to && x.from !== x.to)
/** 聚合全图的排法：主题框照业务全局图的 x、y 格子排、用它的颜色号；框里一个聚合一个小框（名字、根的名字），从上往下摞，
 *  聚合多的框长高，同一排的框一样高。线：同一个主题里挨着的上下直连；同一列的从右边绕；同一排隔着别的主题的从顶上绕
 *  （最后一排从底下绕），几条一起绕的一条比一条远；其余的从对着的那一边出、进。几条线汇到一个小框的同一边，端点在那一边上错开。
 *  线上不放小卡、框间距收紧（只有选中的那个聚合进出的几条才放小卡）；图占满主区，九个主题五列的图在 1500 宽的窗口里缩到 0.85 左右 */
const MTAG = 38   // 全图聚合框里成员那一列种类小标占的宽（「值对象」三个字）
function layoutAll(graph, avail) {
  const PAD = 20, GX = 60, GY = 70, IN = 14, GAP = 10
  const topics = Object.entries(TOPICS).map(([id, t]) => ({ id, title: t.title, c: t.c, col: t.x ?? 0, row: t.y ?? 0 }))
  // 聚合的 topic 不在业务全局图里的，另起一排放在最下面，框名写主题号
  const lostRow = Math.max(-1, ...topics.map((t) => t.row)) + 1
  ;[...new Set(AGGS.map((a) => a.topic).filter((t) => !TOPICS[t]))].forEach((id, i) => topics.push({ id, title: id, c: 0, col: i, row: lostRow }))
  const cols = Math.max(...topics.map((t) => t.col)) + 1, rowsN = Math.max(...topics.map((t) => t.row)) + 1
  // 框宽：不缩就放得下、框又不窄过 180 的，照主区撑满（最宽 320）；放不下就按整张缩到 0.85 算框宽，最窄 150。80 是底图外沿四周各留的 40
  const fit = (k) => Math.floor((avail / k - PAD * 2 - 80 - (cols - 1) * GX) / cols)
  const TW = fit(1) >= 180 ? Math.min(320, fit(1)) : Math.max(150, fit(0.85)), AW = TW - IN * 2
  // 主题名按框宽折行（15px 粗体一个字约 15 宽）；小框里的名字按框宽折行（13px 粗体一个字宽约 6.5），底下写根的名字（11px 约 5.5）；
  // 再往下成员一个一行：左边一列种类小标（实体、值对象），右边名字（11.5px 约 5.8），名字长了折行；根已经在上面，不重复。框高跟着字
  for (const t of topics) { t.lines = wrap([t.title], Math.floor((TW - IN * 2) / 7.5)); t.head = 26 + t.lines.length * 19 }
  const card = {}
  for (const a of AGGS) {
    const root = (a.members ?? []).find((m) => m.kind === '根')
    const name = wrap([a.title], Math.floor((AW - 20) / 6.5)), sub = root ? wrap(['根 ' + root.name], Math.floor((AW - 20) / 5.5)) : []
    const mems = (a.members ?? []).filter((m) => m !== root).map((m) => ({ m, lines: wrap([m.name], Math.floor((AW - 20 - MTAG) / 5.8)) }))
    const memH = mems.length ? 6 + mems.reduce((t, x) => t + x.lines.length * 15, 0) : 0
    card[a.id] = { a, name, sub, mems, w: AW, h: 14 + name.length * 17 + sub.length * 14 + memH }
  }
  const inTopic = Object.fromEntries(topics.map((t) => [t.id, AGGS.filter((a) => a.topic === t.id)]))
  const frameH = (t) => t.head + (inTopic[t.id].length ? inTopic[t.id].reduce((s, a) => s + card[a.id].h + GAP, -GAP) : 20) + 14
  const rowH = [], rowTop = []
  for (let r = 0; r < rowsN; r++) { rowH[r] = Math.max(90, ...topics.filter((t) => t.row === r).map(frameH)); rowTop[r] = r ? rowTop[r - 1] + rowH[r - 1] + GY : 0 }
  const frame = {}
  for (const t of topics) {
    const f = frame[t.id] = { x: t.col * (TW + GX), y: rowTop[t.row], w: TW, h: rowH[t.row] }
    let y = f.y + t.head
    inTopic[t.id].forEach((a, i) => { Object.assign(card[a.id], { x: f.x + IN, y, t, i }); y += card[a.id].h + GAP })
  }

  // 线：先定每条从哪一边出、进哪一边，再把同一边上的端点按对面那头的远近错开
  const edges = graphEdges(graph).map((x) => ({ ...x, A: card[x.from], B: card[x.to] })).filter((x) => x.A && x.B)
  for (const x of edges) {
    const { A, B } = x
    if (A.t === B.t && Math.abs(A.i - B.i) === 1) { x.kind = 'stack'; x.sa = B.i > A.i ? 'b' : 't'; x.sb = B.i > A.i ? 't' : 'b' }
    else if (A.t.col === B.t.col) { x.kind = 'loop'; x.sa = x.sb = 'r' }
    else { x.kind = A.t.row === B.t.row && Math.abs(A.t.col - B.t.col) > 1 ? 'lift' : 'side'; x.sa = B.t.col > A.t.col ? 'r' : 'l'; x.sb = B.t.col > A.t.col ? 'l' : 'r' }
  }
  const ends = {}, mid = (c) => ({ x: c.x + c.w / 2, y: c.y + c.h / 2 })
  for (const x of edges) { (ends[x.A.a.id + '|' + x.sa] ??= []).push({ x, from: true }); (ends[x.B.a.id + '|' + x.sb] ??= []).push({ x, from: false }) }
  for (const [key, list] of Object.entries(ends)) {
    const side = key.slice(-1), across = side === 't' || side === 'b'
    const far = (it) => mid(it.from ? it.x.B : it.x.A)
    list.sort((p, q) => (across ? far(p).x - far(q).x : far(p).y - far(q).y))
    list.forEach((it, k) => {
      const c = it.from ? it.x.A : it.x.B, f = (k + 1) / (list.length + 1)
      const pt = side === 'r' ? { x: c.x + c.w, y: c.y + c.h * f } : side === 'l' ? { x: c.x, y: c.y + c.h * f } : side === 't' ? { x: c.x + c.w * f, y: c.y } : { x: c.x + c.w * f, y: c.y + c.h }
      if (it.from) it.x.p0 = pt; else it.x.p3 = pt
    })
  }
  // 绕的线都留在框之间的空当里：从右边绕的不出右边那一格空当，从顶上、底下绕的一条比一条远一点
  const loopN = {}, liftN = {}
  for (const x of edges) {
    const p0 = x.p0, off = { r: [2, 0], l: [-2, 0], t: [0, -2], b: [0, 2] }[x.sb], p3 = { x: x.p3.x + off[0], y: x.p3.y + off[1] }
    let p1, p2
    if (x.kind === 'stack') { const ym = (p0.y + p3.y) / 2; p1 = { x: p0.x, y: ym }; p2 = { x: p3.x, y: ym } }
    else if (x.kind === 'loop') { const k = loopN[x.A.t.col] = (loopN[x.A.t.col] ?? -1) + 1, xc = frame[x.A.t.id].x + TW + 24 + (k % 4) * 10; p1 = { x: xc, y: p0.y }; p2 = { x: xc, y: p3.y } }
    else if (x.kind === 'lift') {
      const r = x.A.t.row, below = rowsN > 1 && r === rowsN - 1, key = r + (below ? 'b' : 't'), k = liftN[key] = (liftN[key] ?? -1) + 1
      const yc = below ? rowTop[r] + rowH[r] + 50 + k * 24 : rowTop[r] - 50 - k * 24, dir = p3.x > p0.x ? 1 : -1
      p1 = { x: p0.x + dir * 30, y: yc }; p2 = { x: p3.x - dir * 30, y: yc }
    } else { const dx = (p3.x - p0.x) / 2; p1 = { x: p0.x + dx, y: p0.y }; p2 = { x: p3.x - dx, y: p3.y } }
    x.cv = { d: `M ${p0.x} ${p0.y} C ${p1.x} ${p1.y}, ${p2.x} ${p2.y}, ${p3.x} ${p3.y}`, at: (t) => bez(p0, p1, p2, p3, t) }
  }
  // 底图的外沿：主题框加上线（绕到顶上、右边的线不出画布）；再往外留 40 给选中时的小卡
  const pts = edges.flatMap((x) => Array.from({ length: 21 }, (_, i) => { const p = x.cv.at(i / 20); return { x: p.x - 4, y: p.y - 4, w: 8, h: 8 } }))
  const all = [...Object.values(frame), ...pts]
  const bx1 = Math.min(...all.map((b) => b.x)) - 40, by1 = Math.min(...all.map((b) => b.y)) - 40
  const bound = { x: bx1, y: by1, w: Math.max(...all.map((b) => b.x + b.w)) + 40 - bx1, h: Math.max(...all.map((b) => b.y + b.h)) + 40 - by1 }
  return { PAD, IN, topics, frame, card, inTopic, edges, bound }
}
/** 聚合框里的成员行：根那一行下面隔一道细线，一个成员一行，左边种类小标、右边名字（折行的接着往下）；点名字进它的成员页 */
function memRows(c) {
  if (!c.mems.length) return ''
  let y = c.y + 14 + c.name.length * 17 + c.sub.length * 14
  let out = `<path class="sep" d="M ${c.x + 8} ${y - 1} L ${c.x + c.w - 8} ${y - 1}"/>`
  y += 6
  for (const { m, lines } of c.mems) {
    out += `<text class="k" x="${c.x + 10}" y="${y + 11}">${esc(m.kind)}</text>`
      + lines.map((l, i) => `<text class="m" data-m="${esc(m.id)}" x="${c.x + 10 + MTAG}" y="${y + 11 + i * 15}">${esc(l)}</text>`).join('')
    y += lines.length * 15
  }
  return out
}
/** 画聚合全图。focus 是选中的聚合 id：它进出的线高亮、只给这几条放小卡，别的线和聚合更淡；没选中时线都画淡、不放小卡。
 *  小卡不压聚合小框和主题名那一条；底图外沿四周各立一堵「墙」记进 taken，小卡不往画布外头跑，选中前后画布一样大、不跳 */
const ALL_CACHE = {}
function drawAll(graph, focus) {
  const avail = availW(), key = avail + '|' + (focus ?? '')
  if (ALL_CACHE[key]) return ALL_CACHE[key]
  const L = layoutAll(graph, avail), { PAD, IN, frame, card, bound } = L
  const mine = (x) => focus && (x.from === focus || x.to === focus)
  const near = new Set(L.edges.filter(mine).flatMap((x) => [x.from, x.to]))
  let s = MARK.replace('</defs>', '<marker id="aon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker></defs>')
  for (const t of L.topics) {

    s += `<g class="tp" data-g="${esc(t.id)}"><rect x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" rx="10" style="${tintOf(t)}"/>${t.lines.map((l, i) => `<text class="t" x="${f.x + IN}" y="${f.y + 26 + i * 19}">${esc(l)}</text>`).join('')}${L.inTopic[t.id].length ? '' : `<text class="none" x="${f.x + IN}" y="${f.y + t.head + 12}">还没有聚合</text>`}</g>`
  }
  // 高亮的线最后画，压在淡线上面
  const order = [...L.edges.filter((x) => !mine(x)), ...L.edges.filter(mine)]
  for (const x of order) s += `<g class="ed${mine(x) ? ' on' : ''}" data-from="${esc(x.from)}" data-to="${esc(x.to)}"><path class="vis" d="${x.cv.d}" marker-end="url(#${mine(x) ? 'aon' : 'a'})"/><path class="hit" d="${x.cv.d}"/></g>`
  for (const c of Object.values(card)) {
    const cls = c.a.id === focus ? ' sel' : near.has(c.a.id) ? ' nb' : ''
    s += `<g class="ag${cls}" data-agg="${esc(c.a.id)}" data-t="${esc(c.t.id)}"><rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="4"/>`
      + c.name.map((l, i) => `<text class="n" x="${c.x + 10}" y="${c.y + 19 + i * 17}">${esc(l)}</text>`).join('')
      + c.sub.map((l, i) => `<text class="r" x="${c.x + 10}" y="${c.y + 18 + c.name.length * 17 + i * 14}">${esc(l)}</text>`).join('')
      + memRows(c) + '</g>'
  }
  const B = bound, BIG = 1e5
  const walls = [{ x: B.x - BIG, y: B.y - BIG, w: BIG, h: B.h + BIG * 2 }, { x: B.x + B.w, y: B.y - BIG, w: BIG, h: B.h + BIG * 2 }, { x: B.x - BIG, y: B.y - BIG, w: B.w + BIG * 2, h: BIG }, { x: B.x - BIG, y: B.y + B.h, w: B.w + BIG * 2, h: BIG }]
  const taken = [...Object.values(card), ...L.topics.map((t) => ({ x: frame[t.id].x, y: frame[t.id].y, w: frame[t.id].w, h: t.head - 6 })), ...walls]
  const labelled = L.edges.filter((x) => mine(x) && x.e.label)

  for (const x of labelled) labels.push(rideLabel(x.cv, String(x.e.label).split('；'), taken, labelled.filter((y) => y !== x).map((y) => y.cv)))
  s += `<g class="lbs">${labels.map((l) => l.svg).join('')}</g>`
  return (ALL_CACHE[key] = canvas(s, [bound, ...labels.map((l) => l.box)], PAD, avail))
}
let hoverAgg = null   // 全图上鼠标正指着的聚合；钉住的记在地址里：all/<聚合 id>
const allFocus = () => { const v = view.startsWith('all/') ? view.slice(4) : null; return hoverAgg ?? (v ? aggOf[v]?.id ?? v : null) }
/** 只换全图那一块，不重画整页：指着聚合移来移去时用 */
function paintAll() {
  const f = allFocus(), map = document.getElementById('allmap')
  if (map) { map.innerHTML = drawAll(GRAPH, f); map.className = 'diagram allmap' + (f ? ' focus' : '') }
}

// ---------- 页面 ----------
// 每个有模型的上下文一套数据：第一个（MODEL_CX）用上面顶层那几栏，别的用工作台给的 BY_CX；单开小样只有上面那一套
const indexAggs = (aggs) => Object.fromEntries(aggs.flatMap((a) => [[a.title, a], [a.id, a]]))
const FIRST = { MODEL_CX, TOPICS, AGGS, CATALOG, MOVES, FLOW_STEPS, aggOf, NOTES, UNMODELED }
const cxData = (cx) => {
  if (cx === FIRST.MODEL_CX) return FIRST
  if (!DATA.BY_CX) return null
  const d = DATA.BY_CX[cx]
  return d ? (d.aggOf ??= indexAggs(d.AGGS ?? [])) && d : null
}
// 换到 cx：页面上的那几样换成它的；没有模型的上下文 MODEL_CX 为空，render 只摆一句话
function useCx(cx) {
  const d = cxData(cx)
  MODEL_CX = d ? cx : null
  TOPICS = d?.TOPICS ?? {}; AGGS = d?.AGGS ?? []; CATALOG = d?.CATALOG ?? {}
  MOVES = d?.MOVES ?? []; FLOW_STEPS = d?.FLOW_STEPS ?? {}; aggOf = d?.aggOf ?? {}
  NOTES = d?.NOTES ?? []; UNMODELED = d?.UNMODELED ?? []
  GRAPH = DATA.GRAPHS ? DATA.GRAPHS[cx] ?? null : (d ? GRAPH0 : null)
}
const sw = (bg, ln, extra = '') => `<span class="sw${extra}" style="background:var(--${bg});border-color:var(--${ln})"></span>`
const LEG = {
  evt: `<span>${sw('evt', 'evt-line')}事件</span>`,
  final: `<span><span class="sw" style="border-color:var(--ink-3);box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--ink-3)"></span>终态</span>`,
  cmd: `<span>${sw('cmd', 'cmd-line')}命令</span>`,
  qry: `<span>${sw('cmd', 'cmd-line', ' dash')}查询</span>`,
  svc: `<span>${sw('svc', 'svc-line')}领域服务</span>`,
  agg: `<span>${sw('data', 'data-line')}聚合的行为</span>`,
  hdl: `<span>${sw('hdl', 'hdl-line')}事件处理器</span>`,
}
function render() {
  const main0 = document.getElementById('main')
  const [kind, id, mid] = view.split('/')
  if (kind !== 'all') hoverAgg = null
  if (pinAt !== context + '/' + view) { pin = null; pinAt = context + '/' + view }
  useCx(context)
  Shell.current = context; Shell.nav()
  const main = document.getElementById('main')
  // 共享内核没有模型；AGGS 是 MODEL_CX 那个上下文的，别的上下文、或它自己还没建模（AGGS 空），只摆一句话，不画
  if (context === '共享内核' || context !== MODEL_CX || !AGGS.length) {
    main.innerHTML = `<h1><span class="kind">上下文</span><span class="sep">›</span>${esc(context)}</h1><p class="sub">${context === '共享内核' ? '共享内核只有概念，没有模型；几个上下文都用的概念在它的 业务/概念 里。' : `这个上下文的模型还没建。建模的每一步都带着在哪个上下文做，产物落 上下文/${esc(context)}/模型/。`}</p>`
    return
  }
  document.getElementById('detail').hidden = true
  if (kind === 'all') {
    // 全图不用定下：它随着聚合改而变，标题旁不写未定、定了，也没有定下按钮。没有全图.json 也照主题摆出已有的聚合，只是没有线
    const f = allFocus()
    main.innerHTML = `<h1>聚合全图 <span class="kind">· ${esc(context)}</span></h1>
      ${GRAPH ? '' : '<p class="sub">还没有 全图.json（起骨架时写）：下面先照主题摆出已有的聚合，聚合之间还没有线。</p>'}
      ${gapBox(UNMODELED)}${strayBox(NOTES.filter((n) => !AGGS.some((a) => sameAgg(n, a))), '对不上聚合的留言')}
      <div class="diagram allmap${f ? ' focus' : ''}" id="allmap">${drawAll(GRAPH, f)}</div>
      <div class="legend"><span>移到一个聚合上看它连着谁；点框钉住，点名字进它的总览</span></div>`
  } else if (kind === 'list') {
    const items = CATALOG[id] ?? []
    const kinds = ['命令', '查询', '事件处理器']
    const cell = (x) => x?.length ? esc(x.join('、')) : '<span class="none">—</span>'
    const tbl = kinds.filter((k) => items.some((x) => x.kind === k)).map((k) => `<div class="cap" style="margin:14px 0 6px">${esc(k)}</div>
      <table class="attrs list"><tr class="hd"><td>名字</td><td>${k === '事件处理器' ? '听' : '入参'}</td><td>领域服务</td><td>聚合 · 行为</td><td>${k === '查询' ? '返回' : '发出'}</td><td>自己抛的</td><td>出现在</td></tr>
      ${items.filter((x) => x.kind === k).map((x) => `<tr><td class="n">${esc(x.name)}</td><td>${k === '事件处理器' ? esc(x.in.on) : cell(x.in.params)}</td><td>${viasOf(x).length ? viasOf(x).map((v) => `<span class="chip svc">${esc(v.name)}</span> <span class="x">${esc(v.does)}${v.throws?.length ? '；抛 ' + esc(v.throws.join('、')) : ''}</span>`).join('<br>') : '<span class="none">—</span>'}</td><td>${esc(x.call.aggregate)} · ${x.call.read ? '读' : esc(x.call.behavior)}</td><td>${x.kind === '查询' ? esc(x.out) : `<span class="chip">${esc(x.out)}</span>`}</td><td>${cell(x.throws)}</td><td>${usedIn(id, x.id).map((m) => `<a href="#move/${m.file}">${esc(m.title)}</a>`).join('、') || '<span class="none">还没用到</span>'}</td></tr>`).join('')}</table>`).join('')
    main.innerHTML = `<h1><span class="kind">调动</span><span class="sep">›</span>${esc(TOPICS[id]?.title ?? id)} · 清单</h1>
      <p class="sub">这个主题里所有的命令、查询、事件处理器，一条一个定义；流程页只是从这里索引，按先后排出来。</p>
      <div class="card">${tbl}</div>`
  } else if (kind === 'move') {
    const m = MOVES.find((x) => x.file === id)
    main.innerHTML = `<h1><span class="kind">调动</span><span class="sep">›</span>${esc(m.title)}</h1>
      <p class="sub">${esc(m.summary)}</p>
      <div class="diagram">${drawMove(expand(m))}</div>
      <div class="legend">${LEG.cmd}${LEG.qry}${LEG.svc}${LEG.agg}${LEG.evt}${LEG.hdl}</div>`
  } else if (kind === 'member') {
    const a = aggOf[id] ?? AGGS[0], m = memberOf(a, mid) ?? a.members[0]
    const names = fieldNames(m)
    main.innerHTML = `<h1><span class="kind">聚合</span><span class="sep">›</span><a class="up" href="#agg/${a.id}">${esc(a.title)}</a><span class="sep">›</span>${esc(m.name)}</h1>
      ${strayBox(NOTES.filter((n) => sameAgg(n, a) && sameMember(n, m) && !names.has(n.field)), '对不上属性的留言')}
      ${lockView(a)}${asksView(a, m)}
      ${memberView(a, m)}`
    // 重画连线后点住的再上一遍
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(() => { wireAttr(m); paintLit(m, pin, 'pin') })
  } else {
    const a = aggOf[id] ?? AGGS[0]
    const gaps = UNMODELED.filter((g) => g.aggs?.includes(a.id))
    main.innerHTML = `<h1><span class="kind">聚合</span><span class="sep">›</span>${esc(a.title)}</h1>
      ${gaps.length ? `<p class="gap">它的概念里，模型还没给自己元素的：${gaps.map((g) => esc(g.concept)).join('、')}</p>` : ''}
      ${strayBox(NOTES.filter((n) => sameAgg(n, a) && !a.members.some((m) => sameMember(n, m))), '对不上成员的留言')}
      ${lockView(a)}${asksOfAgg(a)}
      ${aggView(a)}`
  }
}

// ---------- 指着 ----------
function bind() {
  const main = document.getElementById('main'), pop = document.getElementById('detail')
  const show = (html, x, y) => {
    pop.innerHTML = html; pop.hidden = false
    let px = x + 16; if (px + pop.offsetWidth > innerWidth - 8) px = x - pop.offsetWidth - 16
    pop.style.left = Math.max(8, px) + 'px'; pop.style.top = Math.max(8, Math.min(y - 20, innerHeight - pop.offsetHeight - 8)) + 'px'
  }
  const fromStep = (t) => t ? `<div>${esc(traceText(t))}</div>${stepTitle(t) ? `<div>${esc(stepTitle(t))}</div>` : ''}` : '<div>这一段流程里没用到</div>'
  main.addEventListener('mousemove', (ev) => {
    const [kind, id] = view.split('/')
    if (kind === 'agg' || kind === 'member') {
      const a = aggOf[id] ?? AGGS[0], m = (kind === 'member' && memberOf(a, view.split('/')[2])) || a.members[0]
      const bh = ev.target.closest('.bh')
      if (bh) { const b = m.behaviors[+bh.dataset.b]; show(`<h4>行为 ${esc(sig(b.name, b.params))}</h4>${fromStep(b.trace)}`, ev.clientX, ev.clientY); return }
      const tr = ev.target.closest('.tr[data-i]')
      if (tr) { const t = m.transitions[+tr.dataset.i], b = (m.behaviors ?? []).find((x) => x.name === t.by); show(`<h4>${t.from ? esc(t.from) + ' → ' : '开出来就是 '}${esc(t.to)}</h4><div>${esc(t.by)} 让它变</div>${b ? fromStep(b.trace) : ''}`, ev.clientX, ev.clientY); return }
    } else {
      const mv = ev.target.closest('.mv')
      if (mv) {
        const m = expand(MOVES.find((x) => x.file === id)), r = m.rows.find((x) => x.id === mv.dataset.r)
        const bh = !r.call.read && AGGS.flatMap((a) => a.members).find((mm) => mm.name === r.call.aggregate)?.behaviors?.find((b) => b.name === r.call.behavior)
        const thr = [['自己', r.throws], ...viasOf(r).map((v) => ['领域服务 ' + v.name, v.throws]), ['行为 ' + (r.call.behavior ?? ''), bh?.throws]].filter(([, xs]) => xs?.length)
        const throwsHtml = thr.length ? `<div>抛：${thr.map(([who, xs]) => `${esc(xs.join('、'))}<small style="color:var(--ink-3)">（${esc(who)}）</small>`).join('；')}</div>` : ''
        const what = `${r.kind} ${esc(r.name)} → ${viasOf(r).map((v) => '领域服务 ' + esc(v.name) + ' → ').join('')}${esc(r.call.aggregate)}.${r.call.read ? '读' : esc(r.call.behavior)}${r.out ? (r.kind === '查询' ? ' → 返回 ' : ' → 事件 ') + esc(r.out) : ''}`
        show(`<h4>${esc(traceText(r.trace) || '不对应流程里的一步')}</h4><div>${what}</div>${stepTitle(r.trace) ? `<div>${esc(stepTitle(r.trace))}</div>` : ''}${throwsHtml}${r.note ? `<div>${esc(r.note)}</div>` : ''}`, ev.clientX, ev.clientY); return
      }
    }
    pop.hidden = true
  })
  main.addEventListener('mouseleave', () => { pop.hidden = true })
  // 指着一张来源卡：它落的属性行、接它的行为卡、连线一起亮；指着行为卡反过来亮它接的来源；指着属性行亮落到它的来源和接它的行为
  // 点一下把它定住（pin），再点同一个或点空白处放开；定住时指着别的照样临时亮（on），移开回到定住的
  const here = () => { const [kind, id, mid] = view.split('/'); if (kind !== 'member') return null; const a = aggOf[id] ?? AGGS[0]; return { a, m: memberOf(a, mid) ?? a.members[0] } }
  main.addEventListener('mouseover', (ev) => {
    const h = here(); if (!h) return
    paintLit(h.m, ev.target.closest('.nb, .nf') ? null : selOf(ev.target), 'on')
  })
  main.addEventListener('mouseleave', () => { const h = here(); if (h) paintLit(h.m, null, 'on') })
  // 留言：点属性行末尾的「留言」，就在它下面出一个输入框；回车或「提交」写进 模型/留言.json，Esc 或「取消」收起
  const closeForm = (m) => { const f = main.querySelector('.nf'); if (f) { f.remove(); wireAttr(m); paintLit(m, pin, 'pin') } }
  function submitNote(h, form) {
    const text = form.querySelector('input').value.trim(), field = form.dataset.f
    if (!text) { form.querySelector('input').focus(); return }
    if (LIVE) { post('留言', { context, agg: h.a.id, member: h.m.id, field, text }); return }
    NOTES.push({ id: 'n-' + (NOTES.length + 1), agg: h.a.id, member: h.m.id, field, text, at: '2026-11-09 16:20', status: '待处理' }); render()
  }
  main.addEventListener('keydown', (ev) => {
    const form = ev.target.closest('.nf'); if (!form) return
    const h = here(); if (!h) return
    if (ev.key === 'Enter' && !ev.isComposing) { ev.preventDefault(); submitNote(h, form) }
    else if (ev.key === 'Escape') closeForm(h.m)
  })
  main.addEventListener('click', (ev) => {
    const ob = ev.target.closest('.ask button.opt')   // 问题卡上的一个选项或「另说」
    if (ob) { if (!ob.disabled) answerAsk(ob.dataset); return }
    const h = here()
    if (h && ev.target.closest('.nb')) {
      const row = ev.target.closest('.row'), notes = row.nextElementSibling, open = main.querySelector('.nf')
      const again = open && open.dataset.f === row.dataset.f
      closeForm(h.m)
      if (again || !notes?.classList.contains('notes')) return
      const f = document.createElement('div'); f.className = 'nf'; f.dataset.f = row.dataset.f
      f.innerHTML = `<input placeholder="对「${esc(row.dataset.f)}」想说的，一句话"><button class="ok">提交</button><button class="no">取消</button>`
      notes.appendChild(f); f.querySelector('input').focus()
      wireAttr(h.m); paintLit(h.m, pin, 'pin')
      return
    }
    if (h && ev.target.closest('.nf')) { const form = ev.target.closest('.nf'); if (ev.target.closest('button.ok')) submitNote(h, form); else if (ev.target.closest('button.no')) closeForm(h.m); return }
    if (h && document.getElementById('attr') && !ev.target.closest('.tabs, a, button, .note, .stray')) {
      const sel = selOf(ev.target)
      pin = sel && !(pin && pin.k === sel.k && pin.v === sel.v) ? sel : null
      paintLit(h.m, pin, 'pin')
    }
    const tb = ev.target.closest('.tabs button')
    if (tb) { tab = tb.dataset.t; render(); return }
    const mb = ev.target.closest('.mb[data-m]')
    if (mb) { selected = selected === mb.dataset.m ? null : mb.dataset.m; render(); return }
    const st = ev.target.closest('.stub[data-agg]')
    if (st && st.dataset.agg) { go('agg/' + st.dataset.agg); return }
    // 全图上：点聚合的名字进它的总览，点成员名进它的成员页；点框别处把它钉住（记进地址 all/<聚合 id>），再点一下放开
    const ag = ev.target.closest('.ag[data-agg]')
    if (ag) { const id = ag.dataset.agg, mm = ev.target.closest('text.m'); if (mm) go('member/' + id + '/' + mm.dataset.m); else if (ev.target.closest('text.n')) go('agg/' + id); else go(view === 'all/' + id ? 'all' : 'all/' + id); return }
  })
  // 全图上指着一个聚合：它进出的线高亮、放出小卡，右边栏列它连着谁；指到空处回到钉住的那个（没钉就都不亮）
  main.addEventListener('mouseover', (ev) => {
    if (!view.startsWith('all')) return
    const ag = ev.target.closest('.ag[data-agg]'), id = ag ? ag.dataset.agg : null
    if (id !== hoverAgg) { hoverAgg = id; paintAll() }
  })
  main.addEventListener('mouseleave', () => { if (view.startsWith('all') && hoverAgg) { hoverAgg = null; paintAll() } })
  bindContexts(HOME)
}
;({ cx: context, v: view } = parseHash(HOME)); Shell.show(context)
render(); bind()
</script>
</body>
</html>
